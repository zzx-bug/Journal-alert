","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-12","tkey":"other","id":223},{"title":"Polarization‐Driven Optoelectronic Synapse With Programmable Plasticity for Neuromorphic Visual System","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78812?af=R","doi":"10.1002/adfm.78812","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Nannan Zhang","Zhi Zhang","Rui Feng","Yisong Yang","Yifan Zhong","Zejun Li"],"authorMore":false,"abstract":"Out-of-plane polarization in the two-dimensional (2D) semiconductor Nb 3 Cl 8 creates a built-in field that separates photogenerated carriers and makes recombination kinetics sensitive to gate voltage and temperature. This enables continuous STP-LTP tuning without heterostructures, yielding 171% PPF and 25 fJ. The device emulates learning-forgetting-relearning cycles, visual adaptation as an artificial pupil, and achieves 91.51% digit recognition accuracy (83.08% under 40% noise). ABSTRACT Optoelectronic synapses that integrate sensing and memory are vital for energy-efficient artificial vision. However, current devices generally depend on defect trapping or heterojunction interface … ✅ … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-12","tkey":"other","id":224},{"title":"A Single‐Channel Humidity‐Pressure Dual‐Modal Decoupling Sensor for Assistive Geriatric Rehabilitation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79572?af=R","doi":"10.1002/adfm.79572","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Xingfeng Zhao","Yangyang Pei","Bolin Kang","Maomao He","Yumeng Xue","Ting Liu"],"authorMore":false,"abstract":"Like bees that perceive both airflow and humidity via their antennae, we developed a dual-modal sensor that simultaneously detected pressure and humidity stimuli, featuring lightweight construction, a wide pressure range, good durability, and fast response. It enabled multi-scenario monitoring of limb exercise and respiratory conditions in the elderly. This design offered a transferable structural paradigm for low-crosstalk, high-performance intelligent sensing devices, contributing to smart healthcare and home-based rehabilitation. ABSTRACT Against the background of global population aging and the growing need for elderly care, developing multi-modal sensing platforms with high …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":225},{"title":"Pd Single‐Atom Engineered Janus BiOCl/MXene Heterostructure for Printed Self‐Decoupled Temperature‐Humidity Dual‐Mode Sensors","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75664?af=R","doi":"10.1002/adma.75664","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-09","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Hao‐Wen Zhang","Yan Chen","Xiang Xu","Lin‐Xue Zhang","Wei Liu","Cheng‐Rong Liao"],"authorMore":false,"abstract":"Pd single-atom engineered Janus BiOCl/MXene heterostructure enables self-decoupled temperature and humidity dual-mode sensing by establishing orthogonal response mechanisms, in which quasi-2D interfacial proton conduction governs hydrocapacitance transduction and delocalized carrier diffusion drives thermovoltage output. In combination with machine learning, this multi-modal sensing platform powers the integrated closed-loop therapeutic system capable of real time wound healing evaluation and on-demand drug release. ABSTRACT The advancement of flexible sensing technologies is of paramount importance in biomedical engineering. However, achieving high-fidelity multi-modal temperature-humidity …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":226},{"title":"Automated Conformational Clustering Reveals Desolvation Mechanisms in a Wide‐Temperature‐Range Sodium‐Ion Electrolytes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78718?af=R","doi":"10.1002/advs.78718","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Long Huang","Kun Gao","Yiyao Han","Jing Yang"],"authorMore":false,"abstract":"Temperature-driven solvation conformational shift reduces the desolvation barrier and enhances sodium-ion mobility. ABSTRACT The desolvation kinetics of Na + at the electrode-electrolyte interface critically limit the wide-temperature performance of sodium-ion batteries (SIBs). Conventional radial distribution function analyses, which rely on spherical symmetry averaging, inherently fail to capture the microscopic conformational inhomogeneity that governs this process. Herein, we develop an automated conformational clustering framework that integrates unsupervised machine learning with a multiscale DFT (Density Functional Theory) MD (Molecular Dynamics) approach to resolve the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":227},{"title":"Interface‐Mediated Self‐Rectifying CsCuCl3 Memristors With Tunable Thresholds for Reconfigurable Neuromorphic Computing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78702?af=R","doi":"10.1002/advs.78702","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"深度学习","topics":["深度学习"],"matchTerm":"CNN","matchWhere":"摘要：CNN","score":2,"authors":["Qingwei Shi","Mufan Zhu","Song He","Zhen Yan","Yuezhong Lu","Shuaidi Wu"],"authorMore":true,"abstract":"Interface-mediated CsCuCl 3 memristors achieve self-rectification and tunable thresholds, enabling selector-free 8 × 8 arrays with \u003e 10 5 ON/OFF and \u003e 10 4 rectification. Supporting dual-mode neuromorphic computing, negative thresholds preserve low-light recognition accuracy (91%), while positive thresholds enable sparsity-aware edge computing. This work advances selector-free, sparsity-aware artificial intelligence hardware systems. ABSTRACT We demonstrate a simple 1R self-rectifying halide perovskite memristor with dynamically tunable thresholds for selector-free crossbar arrays and programmable T-ReLU mapping. The memristors achieve an ON/OFF ratio \u003e 10 5 and rectification ratio \u003e 10 4. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":228},{"title":"Data‐Driven Design of Biofunctional Molecularly Imprinted Polymers for Precision Diagnostics","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78276?af=R","doi":"10.1002/advs.78276","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Nastasia Sanda Moldovean‐Cioroianu","Tamim B. Sarwar","Ekin Sehit","Roland Aydin","Zeynep Altintas"],"authorMore":false,"abstract":"Integrating molecular mechanics/dynamics (MM/MD) with machine learning (ML) enables data-driven design of nanoMIPs with exceptional performance in multiplex cancer biomarker detection. Guided by the epitopes’ physicochemical and structural traits, ML-optimized nanoMIPs enhance their charge complementarity, colloidal stability, and binding specificity. This predictive, transferable framework advances rational nanoMIPs design for diagnostics and next-generation of adaptive biomimetic materials. ABSTRACT Conventional imprinted receptors design is laborious and reliant on trial-and-error experimentation. To overcome existing challenges, this study integrates molecular mechanics/molecular …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":229},{"title":"Physics‐Aware Machine‐Learning‐Driven Inverse Design of Broadband Ultra‐Open Acoustic Metamaterials","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76894?af=R","doi":"10.1002/advs.76894","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Zhiwei Yang","Mengyu Li","Xiaohang Xie","Ao Chen","Thomas G. Bifano","Xin Zhang"],"authorMore":false,"abstract":"A physics-aware machine-learning framework enables inverse design of ultra-open acoustic silencers by decoupling spectral and radial design spaces. The approach rapidly identifies broadband, compact, and highly ventilated architectures, while revealing hidden linear design rules that link geometry, impedance matching, and acoustic performance. This work points toward interpretable data-driven discovery of multifunctional acoustic metamaterials. ABSTRACT Ventilated acoustic silencers combining strong sound attenuation with high ventilation are pivotal for advanced noise control. However, balancing attenuation, bandwidth, openness, and thickness remains a high-dimensional challenge. Here, we … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":230},{"title":"Grape Cluster Inspired Biomimetic Composite Solid Electrolyte for High‐Voltage and Long‐Life Solid‐State Lithium Metal Batteries","url":"https://doi.org/10.1002/adfm.79519","doi":"10.1002/adfm.79519","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-07","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Wanqing Fan","Xuetao Shi","Ying Huang","Kaihang She","Shumeng Wang","Zheng Zhang"],"authorMore":false,"abstract":"ABSTRACT Solid‐state lithium metal batteries suffer from poor interfacial stability and dendrite growth, primarily limited by the ion transport kinetics and mechanical properties of composite solid electrolytes (CSE). Inspired by the hierarchical grape cluster, we design a biomimetic electrolyte via electrospinning PAN fiber “pedicel” integrated with mesoporous SiO₂ ‐SO₃ Li “grape berry” fillers, followed by in‐situ polymerization. This structure establishes long‐range Li + conduction channels and a robust physical barrier, delivering a high Li + transference number of 0.65, ionic conductivity of 1.44 × 10 −3 S cm −1 at 25°C, and a modulus of 520 MPa. Benefiting from these advantages, the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":231},{"title":"Ultra‐Robust All‐Weather Perovskite Memristor Protected by Conformal Parylene Nanoscale Coating","url":"https://doi.org/10.1002/adfm.79525","doi":"10.1002/adfm.79525","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-07","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Qianwen Zhang","Fangchao Li","Ruijie Bu","Jianlong Shao","Tikai Zhang","Lijuan Ge"],"authorMore":true,"abstract":"ABSTRACT Halide perovskites are promising memristive materials for neuromorphic computing, yet their practical deployment in hardware is severely hindered by instability against moisture, oxygen, and reactive metallic ions. Here, we develop an ultra‐robust perovskite memristor with all‐weather adaptability protected by a ∼100 nm conformal polymeric nanoscale coating. Deposited by low‐temperature, solvent‐free chemical vapor deposition (CVD) technique, the polymeric Parylene serves as an encapsulation, interfacial passivation, and homogeneous dielectric layer. The memristor exhibits excellent bipolar resistive switching under ambient conditions with high uniformity, an endurance of 1.5 × 10 …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":232},{"title":"Atomic‐Scale Design, Performance Degradation Mechanisms, and System Integration of Multi‐Principal Element Hydrogen Storage Materials","url":"https://doi.org/10.1002/adma.75674","doi":"10.1002/adma.75674","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Yuna Wu","Xiaojie Qi","Yunfei Zhou","Huan Liu","Ting Yuan","Jinghua Jiang"],"authorMore":false,"abstract":"ABSTRACT Solid‐state metal hydrides offer high volumetric hydrogen density and intrinsic safety for hydrogen storage, yet their practical application is severely hindered by poor room‐temperature thermodynamics, sluggish kinetics, impurity gas poisoning, difficult activation, and cycling degradation. Multi‐principal element alloys (MPEAs) have recently emerged as promising candidates to overcome these bottlenecks through their vast compositional space, severe lattice distortion, and synergistic cocktail effect. This review systematically summarizes recent advances in MPEAs for solid‐state hydrogen storage, bridging atomic‐scale design to system‐level performance. A unified …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":233},{"title":"Ferroionic‐Assisted, Charge‐Driven Polymorphic Phase Engineering for Multilevel Memristive Devices","url":"https://doi.org/10.1002/adma.75648","doi":"10.1002/adma.75648","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Nayeon Kim","Chengqi Wei","Eunji Hwang","Woohyun Cho","Heemyoung Hong","Yongjoon Lee"],"authorMore":false,"abstract":"ABSTRACT Memristive device operation can arise from diverse microscopic mechanisms, including charge polarization and trapping, magnetic ordering, ionic migration, and structural phase transitions. Among these, crystalline–crystalline phase transitions in polymorphic materials offer a unique platform for nonvolatile resistance modulation but are often hindered by large energy barriers and limited endurance. Here, we demonstrate a multimodal, charge‐driven phase modulation in an atomically thin polymorphic material, Mo 0.92 W 0.08 Te 2, enabled by electrostatic coupling to a ferroionic substrate, CuInP 2 S 6. The polymorphic channel exhibits reversible switching between semiconducting and …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":234},{"title":"Inverse Design of Nanoparticulate Materials (Adv. Mater. 62/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75508?af=R","doi":"10.1002/adma.75508","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural networks","matchWhere":"摘要：neural networks","score":2,"authors":["Nabi Etienne Traoré","Annika Mauch","Michelle Berthold","Lukas Pflug","Wolfgang Peukert","Nicolas Vogel"],"authorMore":false,"abstract":"Nanoparticulate Materials Process functions link synthesis conditions to nanoparticle structures, while property functions link these structures to macroscopic properties. Inverting these relationships enables model-guided inverse design of nanoparticulate materials. The cover depicts reactor conditions producing distinct nanoparticle geometries, with colored halos symbolizing their (optical) properties and potential for tailored functionality. The background features neural networks and equations describing nanoparticle formation. More details can be found in the Perspective by Nabi Etienne Traoré, Nicolas Vogel, and co-workers (10.1002/adma.75110).","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":235},{"title":"Molecular Cocrystal‐Based Neuromorphic Vision System With Near‐Infrared Responsivity and High Electronic Performance for Facial Recognition in Scattering Media","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75044?af=R","doi":"10.1002/adma.75044","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":[],"authorMore":false,"abstract":"A high-performance NIR neuromorphic visual transistor is fabricated using a bulk perylene-TCNQ cocrystal. Its intrinsic ordered stacking structure ensures efficient carrier transport and broad photoresponse up to 1200 nm. The device realizes hazy imaging and achieves 94% facial recognition accuracy, offering reliable anti-interference visual perception for complex environments. ABSTRACT Neuromorphic visual systems are core technologies enabling round-the-clock perception for the Internet of Things (IoT). While reliable sensing in complex lighting conditions requires robust near-infrared (NIR) capabilities, existing optoelectronic devices struggle to simultaneously achieve a broad NIR …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":236},{"title":"Periodic Mesoporous Metal Oxides With Consistent Structure and Complementary Sensing Selectivity for Reliable Artificial Olfactory","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75089?af=R","doi":"10.1002/adma.75089","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":[],"authorMore":false,"abstract":"Several kinds of gas-sensitive periodic mesoporous metal oxides (PMMOs) with consistent structure and customized chemical microenvironments are rationally synthesized by using polymer cubosomes as versatile templates. By leveraging the well-defined gas diffusion pathway within the periodic structure of PMMOs and their complementary sensing behaviors, a reliable multi-dimensional dataset is established for constructing artificial olfactory, thereby achieving 97.1% accuracy in discriminating seven representative hazardous gases at 1–5 ppm with neural network model assistance. ABSTRACT The integration of functional materials and intelligent algorithms has endowed artificial olfactory systems …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":237},{"title":"120‐Channel High‐Fidelity Optical Multiplexing Using a Minimal Meta‐Atom Set","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75132?af=R","doi":"10.1002/adma.75132","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Zhiyu Tan","Xiaofei Zang","Zhe Gao","Jianshu Miao","Alexander P. Shkurinov","Fei Ding","Yiming Zhu","Songlin Zhuang"],"authorMore":false,"abstract":"Optical multiplexing is advanced by a multi-dimensional reconfigurable diffractive neural network that combines predictive neural optimization with multi-physical-dimension multiplexing. By exploiting polarization, interlayer distance, propagation direction, and metasurface arrangement, the framework enables 120 independently addressable optical channels with high fidelity using only four metasurface layers and 200 2 meta-atoms, overcoming conventional trade-offs between capacity and structural complexity. ABSTRACT High-capacity optical multiplexing is crucial for next-generation intelligent information systems, spanning high-speed communications, optical computing, and immersive displays. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":238},{"title":"Soft Interphases Design of Aqueous Zinc Metal Battery Driven by Quantifiable Descriptor","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78577?af=R","doi":"10.1002/adfm.78577","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Lingbo Yao","Zhurui Wang","Tianshi Zhao","Zeyu Wei","Gege Wang","Zifei Shi"],"authorMore":false,"abstract":"Explainable machine learning reveals a universal Metal Anode/Electrolyte Interphase Descriptor (MAEID) for AZMBs. Integrating ion transport, interfacial kinetics, and mechanical compliance, MAEID shows standalone predictive capability for full-cell capacity retention and provides a practical composite metric for interphase design. ABSTRACT Aqueous zinc metal batteries (AZMBs) face persistent challenges from interfacial instability including dendrite growth and side reactions, yet a critical obstacle lies in the mismatch between anode-side assessments and actual full-cell cycling performance. Through explainable machine learning analysis, this study introduces a physically motivated Metal … … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":239},{"title":"Analog‐Tunable Nonvolatile Memristors with Self‐Compliance Behavior via a MoSx‐Interlayer Strategy for Neuromorphic Recognition and Zero‐Trust Image Encryption","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79481?af=R","doi":"10.1002/adfm.79481","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Yuanyuan Zhu","Ziyi Yang","Daobin Luo","Youqing Wang","Huixia Liao","Chunyang Wu"],"authorMore":false,"abstract":"An HfO x /MoS x /HfO x trilayer memristor achieves intrinsic self-compliance and linear analog switching via oxygen-sulfur vacancy synergy. It emulates full synaptic plasticity, attains 93.84% MNIST accuracy, and acts as a physical entropy source for high-entropy XOR image encryption. ABSTRACT The von ite prediction. This study provides a basis for initial occupancy hypotheses and refinement prioritization in M-type hexaferrites. ABSTRACT Dopant site occupancy bridges chemical composition, local crystal structure, and macroscopic functional responses in M-type hexaferrites. However, reliable occupancy hypotheses are difficult to establish before structural refinement. Here, we … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":260},{"title":"Entropy Stabilized Li‐Rich Layered Oxide Nanoparticles for Advanced High‐Voltage Cathodes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75561?af=R","doi":"10.1002/adma.75561","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-29","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Siyu Zhu","Wei Nong","Ziying Yu","Lei Huang","Chengyi Liu","Erhai Hu"],"authorMore":true,"abstract":"A laser-induced carbothermal method is employed to synthesize high-entropy doped Li-rich nanoparticles. The particle minimization design is proved to reduce energy loss, while the high entropy doping strategy improves voltage and capacity retention. Together, these two features contribute to outstanding electrochemical performance of the cathode material. The assembled full cell and fiber battery provide significant practical feasibility during high-voltage cycling. ABSTRACT The performance enhancement of emerging flexible batteries relies on the development of advanced small-particle electrode materials. However, current cathode materials with reduced particle size mostly suffer from low …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":261},{"title":"Multiscale Design of Cathode Materials for Fast‐Charging Lithium‐Ion Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78457?af=R","doi":"10.1002/adfm.78457","journal":"Adva ABSTRACT Hybrid optical computing seeks to merge the versatility of free-space diffractive systems with the compactness and stability of integrated photonics, thereby providing a promising hardware platform for …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":263},{"title":"A Stretchable Organic Electrochemical Transistor Mechano‐Synapse With Biomimetic Mechanotransduction for Intelligent Soft Electronic Skin","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78465?af=R","doi":"10.1002/adfm.78465","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Yifan Li","Zhenguo Piao","Trung Dieu Do","Minhyuk Park","Seok Ju Hong","Yanqing Zhang","Nae‐Eung Lee"],"authorMore":false,"abstract":"A stretchable slowly adapting mechano synapse (sSA-MS) with a polarization controllable P-N dual layer (PC-PNDL) ionogel gate is introduced. Bilayer ion kinetics prolong postsynaptic current and deepen hysteresis under sub second static touch. The resulting single channel signatures enable reliable separation of contact material and pressure and support compact in sensor machine learning. ABSTRACT Tactile perception relies on early preprocessing of signals from adapting afferents; in particular, synapse-like coupling between afferent nerve fibers and adapting mechanoreceptors supports transduction and sensory memory, enabling efficient central representations of tactile information. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":264},{"title":"Shear‐Stimulated Bioprinting Enables Anisotropic and Multi‐Region Neural Bioconstruct","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78515?af=R","doi":"10.1002/adfm.78515","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","t encryption system, achieving over 97% accuracy for machine-learning-assisted optical information storage and encryption. ABSTRACT Optical data storage and anti-counterfeiting technologies require materials that combine high-contrast photoswitching with computational readout. Herein, we present a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":266},{"title":"Photothermal‐Modulated Electrohydrodynamic Jet Printing of Flexible and Recyclable Photocatalytic Devices for Visible‐Light‐Driven Water Purification","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78470?af=R","doi":"10.1002/adfm.78470","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Kai Li","Junyang Fang","Jialiang Liu","Meng Li","Zhongxian Wu","Dazhi Wang","Yang Lu"],"authorMore":false,"abstract":"Photothermal-modulated electrohydrodynamic jet printing enables one-step fabrication of flexible, recyclable g-C 3 N 4 /BiOI heterojunction photocatalytic devices on silanized quartz fiber fabrics. Laser-assisted droplet regulation suppresses secondary agglomeration, while ALA-ANN optimizes printing fidelity. The resulting devices combine efficient visible-light pollutant degradation, stable catalyst immobilization, facile recovery, and favorable environmental compatibility, offering a scalable route toward sustainable water purification. ABSTRACT Powder-based heterojunction photocatalysts suffer from aggregation, difficult recovery, and secondary pollution, limiting their practical …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":267},{"title":"Machine‐Learning‐Guided DNAzyme Nanocages for Photoresponsive Immunomodulation and Spatiotemporal Control of Diabetic Bone Regeneration","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78518?af=R","doi": producing a dynamically reconfigurable physical cipher within a diffraction-limited footprint for compact, hardware-bound information protection. ABSTRACT Secure encryption lies at the heart of data protection across virtually every sector of modern society. Physical unclonable functions (PUFs) provide an indispensable root of trust for ensuring this security. However, existing PUFs …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":269},{"title":"An Environmental Stable Ionogel‐Based Smart Glove System for Integrated Underwater Communication and Safety Warning","url":"https://doi.org/10.1002/advs.78325","doi":"10.1002/advs.78325","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Xiaoqin Li","Jianwen Liu","Wenhao Yang","Wenjing Yue","Nam‐Young Kim","Young‐Kee Shin"],"authorMore":false,"abstract":"ABSTRACT Flexible sensing technology based on hydrogel‐based smart gloves enables accurate gesture recognition in complex environments, but such gloves degrade in dry, high‐temperature, and underwater conditions, and their complex assembly limits practical usability. Here, a smart glove monitoring system is developed by integrating a poly(benzyl methacrylate‐co‐2‐hydroxyethyl acrylate)/ionic liquid (P(BZMA‐co‐HEA)/IL) ionogel sensing layer with a flexible printed circuit board (FPCB). The ionogel is constructed through a network‐constrained ionic soft‐space regulation strategy, where HEA‐rich segments strengthen the network, IL provides deformation‐adaptive ionic soft spaces, and BZMA‐rich …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":270},{"title":"XChrom: A Cross‐Cell Chromatin Accessibility Prediction Model Integrating Genomic Sequence and Cellular Context","url":"https://doi.org/10.1002/advs.78456","doi":"10.1002/advs.78456","journal":"Advanced Science","jabb d recurrence-free survival. ABSTRACT Immune checkpoint blockade (ICB) can produce durable responses in cancer, but reliable predictors of benefit are still lacking. CD8 + tumor-specific T cells (TSTs) are essential for ICB efficacy, yet it remains unclear which functional states of these cells are associated with therapeutic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":272},{"title":"Architecture‐Engineered Semi‐Crystalline Microporous Polymer Membranes for Precise Molecular Separation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77001?af=R","doi":"10.1002/advs.77001","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"random forest","matchWhere":"摘要：random forest","score":2,"authors":[],"authorMore":false,"abstract":"Guided by a Random Forest model, a π – π -driven ordered stacking strategy deploys functionally distinct substructures to restrict chain segment motion and increase free volume, while preserving the intermolecular interactions that maintain structural integrity. The resulting microporous semi-crystalline polymer membrane features rigid, low-resistance, interconnected transport channels, overcomes the permeability-selectivity trade-off, and combines high-performance separation with scalable fabrication. ABSTRACT Amorphous polymer membranes typically suffer from low fractional free volume (FFV) due to structural flexibility, limiting separation performance and operational stability. Herein, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":273},{"title":"Mesoporous‐Shell Monolayer Plasmonic Architecture Enables Quantitative and Decision‐Guided SERS","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77299?af=R","doi":"10.1002/advs.77299","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning", ut human oversight, meeting a clinical need that fixed-schedule treatments cannot …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":275},{"title":"Continuous and Wireless Monitoring of Myocardial Dynamics Using Biocompatible Magneto‐Viscoelastic Patches","url":"https://doi.org/10.1002/adma.75549","doi":"10.1002/adma.75549","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Sunjin Lee","Sumin Kim","Jeongmin Yoo","Ji Hoo Kim","Eun Saem Kang","Eojin Lee"],"authorMore":true,"abstract":"ABSTRACT We report a machine learning (ML)‐augmented magnetic sensing system for real‐time, wireless monitoring of cardiac kinematics during recovery following surgery. While conventional monitoring focuses on electrical activity, it overlooks mechanical performance and pumping efficiency. To bridge this diagnostic gap, we developed a biocompatible magnetic particle matrix (MPM) patch incorporating biocompatible ferromagnetic α″‐Fe 16 N 2 microparticles. By integrating this patch onto the epicardium during surgery, our platform enables passive magnetic readout and analysis of epicardial motion without implanted electronics. The system utilizes an external magnetometer to sense 3D magnetic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":276},{"title":"Noninvasive Detection and Subtyping of Esophageal Cancer by Circulating Cell‐Free mtDNA Fragmentomics: A Multi‐Center Validation Study","url":"https://doi.org/10.1002/advs.78377","doi":"10.1002/advs.78377","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Yue Liu","Wenying Yang","Yu Li","Siyuan Wang","Xiang Li","Fan Peng"],"authorMore":true,"abstract":"ABSTRACT Esophageal cancer achine learning -guided interfacial …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":278},{"title":"Thermal Stability of High‐Entropy Oxide Thin Films: From Stability Mechanisms to Materials Design","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78257?af=R","doi":"10.1002/adfm.78257","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Xian Li","Jiali Yang","Ke Liu","Daoyun Zhu","Xin‐Gui Tang","Zhongfei Mu","Fugen Wu"],"authorMore":false,"abstract":"High-entropy oxide (HEO) thin films show strong potential in gas sensing, energy storage, catalysis, water splitting, memristive and neuromorphic devices, and optoelectronics. Their applications require phase and chemical stability at elevated temperatures. Thermodynamics-guided control of ionic-size mismatch, elemental volatility, and chemical bonding enables the design of thermally stable single-phase HEO films. ABSTRACT High-entropy oxide (HEO) thin films, as an important branch of high-entropy material systems, have shown broad application prospects in energy, catalysis, protective coatings, and other fields, owing to their unique compositional design strategy and potentially excellent …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":279},{"title":"A Curved Bimodal Hair Sensor for Airflow and Electrostatic Perception in Robotic Control","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78429?af=R","doi":"10.1002/adfm.78429","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"random forest","matchWhere":"摘要：random forest","score":2,"authors":[],"authorMore":false,"abstract":"Curvature-engineered bimodal hair sensing integrates airflow and electrostatic perception within a single flexible device (CBHS). Weak forces down to 10 −4 N are detected, six wind-speed levels are classified with 98.89% accuracy, and distinct temporal signatures separate stimulus types. Direct translation of sensory inputs into robotic behaviors highlights a low-complexity route toward multimodal artificial perception. ABSTRACT Noncontact environmental perception is crucial for autonomous alerting and behavior control in mobile robots, yet existing artificial sensory systems still fall short in integrating weak-stimulus detection, interaction-direction discrimination, and multimodal …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":280},{"title":"Bioengineered Interfaces for Peripheral Nerve Sensory Restoration","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74815?af=R","doi":"10.1002/adma.74815","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Sydney Swedick","Salim El Hadwe","Kesi Liang","George G. Malliaras","Damiano G. Barone"],"authorMore":false,"abstract":"Half of amputees abandon their prosthetics for lack of feeling. This review charts the full path from peripheral nerve injury to restored sensation, through surgical, regenerative, noninvasive, and implanted approaches, and shows how injury type and interface material properties determine which strategy can deliver naturalistic feedback, and why proprioception remains the hardest problem to solve. ABSTRACT Peripheral nerve injuries (PNIs) severely impair motor and sensory function, diminishing patient independence and quality of life. Despite decades of research, rehabilitation has prioritized motor recovery and residual function over the sensory restoration essential for embodiment, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":281},{"title":"E <script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var A = D.articles;
  var TOPICS = D.topics;

  /* Inline SVG rather than emoji: emoji depend on a colour-emoji font being
     installed, and the missing-glyph box is worse than no icon at all. */
  var P = {
    all:   '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
    air:   '<path d="M3 7.5h9.6a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 12h13.2a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3 16.5h6.8"/>',
    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    ghg:   '<path d="M4.6 20v-6.2"/><path d="M2.2 15.6 4.6 13.2l2.4 2.4"/><path d="M12 20V9.4"/><path d="M9.6 11.8 12 9.4l2.4 2.4"/><path d="M19.4 20v-3.4"/><path d="M17 18.4l2.4-2.4 2.4 2.4"/>',
    wx:    '<path d="M13.2 2.6 4.4 13.8h6.2l-1 7.6 8.8-11.2h-6.2l1-7.6z"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'
  };
  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = (a.title+' '+a.abstract+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var ab = a.abstract
      ? '<p class="excerpt">'+esc(trunc(a.abstract,200))+'</p>'
      : '<p class="excerpt none">日报未收录摘要'+(a.matchTerm?'（命中词 '+esc(a.matchTerm)+'）':'')+' · 点击看原文</p>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+esc(a.title)+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+esc(a.title)+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="sec-t">摘要</div>'
      +   (a.abstract
            ? '<p class="abs">'+esc(a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">该条日报未收录摘要。</p>')
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
</body>
</html>
