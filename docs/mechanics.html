1","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Si Zhao","Yiwei Lv","Lituo Zheng","Luzhuo Chen","Bing Lin","Mingdeng Wei"],"authorMore":true,"abstract":"This study demonstrate a data-driven strategy to screen a broad library of M-MOF-74 structures and identify Zn-MOF-74 as an optimal filler for PVDF-based solid electrolytes. Such electrolyte displays a high ionic conductivity of 1.02 × 10 −3 S cm −1 and transference number of 0.84, enbling stable and high-energy-density solid-state sodium batteries by coupling with layered oxide or Na 3 V 2 (PO 4) 3 cathodes. ABSTRACT Solid-state batteries (SSBs) are widely regarded as a promising next-generation energy storage technology owing to their intrinsic safety and high energy density. Solid polymer electrolytes (SPEs) have been esteemed as a cost-effective route to realize commercial SSBs, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":105},{"title":"Contact‐Electrification Induced Electromagnetic Radiation and Charge Polarization Drive Spontaneous Microdroplet Interfacial Reactions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75039?af=R","doi":"10.1002/adma.75039","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Zhenyu Wang","Erming Su","Yu Huang","Andy Berbille","Xianjin Shi","Junji Cao"],"authorMore":true,"abstract":"Triboelectric-assisted microdroplet atomization enables real-time detection of triboelectric discharge-associated electromagnetic emissions, revealing spontaneous interfacial polarization and charge-transfer dynamics. The contact-electrification field drives electron transfer and redistribution, promoting water polarization, radical generation, and subsequent heterogeneous reactions, thereby providing a new strategy for enhancing interfacial microdroplet reactivity. ABSTRACT Spontaneous chemical reactions occurring at microdroplet interfaces are fascinating and significant, yet uncovering the underlying charge interaction mechanisms remain major challenges. In this study, we integrated …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":106},{"title":"Bottom‐Stack Shear Transfer in Thin‐Film Flexoelectric Measurements","url":"https://doi.org/10.1002/adfm.79435","doi":"10.1002/adfm.79435","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Renhong Liang","Yiyao Fang","Haoyang Ding","Zhenggang Rao","Zhiguo Wang","Zhibin Wen"],"authorMore":true,"abstract":"ABSTRACT Bending‐based measurements are widely used to probe flexoelectricity in ferroelectric thin films, but the measured response is often shaped by mechanical boundary conditions beyond the intrinsic flexoelectric coefficient. Here we show that the conducting bottom stack acts as a hidden electromechanical boundary condition in mica‐supported BaTiO₃ (BTO) capacitors. Dynamic bending measurements reveal opposite bottom‐layer‐thickness dependences for two‐dimensional and oxide electrodes, while a BTO(001)/LSMO(001)/MoS 2 /mica hybrid exhibits an intermediate response at the same nominal BTO orientation as the MoS 2 ‐supported films. Interface‐resolved first‐principles calculations show …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":107},{"title":"Multiscale Structural Engineering of a Wearable Gas Sensor for Simulated Breath Ammonia Monitoring Under High‐Humidity Conditions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78613?af=R","doi":"10.1002/adfm.78613","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":[],"authorMore":false,"abstract":"Through a multiscale structural design integrating a self-supporting YSZ nanofiber network, nanoscale heterojunctions, molecular-level acidic sites, and a macroscale hydrophobic layer, a flexible and wearable gas sensor with high breathability and moisture resistance is developed. The device enables highly sensitive and selective detection of low-concentration NH₃ under high humidity and demonstrates simulated exhaled ammonia monitoring via wireless integration. ABSTRACT Wearable gas sensors capable of monitoring volatile biomarkers in exhaled breath offer a promising approach for non-invasive health monitoring. However, existing wearable sensors are hindered by insufficient sensitivity, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":108},{"title":"Robust Ferroelectricity in Chalcogenides Down to 2 nm Particles","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78631?af=R","doi":"10.1002/adfm.78631","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Zhiguo Li","Qiang Li","Hongwei Wang","Jochi Tseng","Han Wu","Kun Lin"],"authorMore":true,"abstract":"Here, we report that nano-ferroelectric SnSe has been induced by the local structure, with the polar AA stacking order triggering robust ferroelectricity down to 2 nm particles. To date, it is the smallest size of ferroelectric material among previously reported nanoparticles. This work first breaks the critical size limit in nanoparticles and provides a structural manipulation strategy to discover ferroelectrics. ABSTRACT Nano-ferroelectric materials are essential for advancing miniaturized energy converters, optoelectronics, and nonvolatile memory devices. However, the depolarizing fields of size-reduced nanoparticles will weaken or even eliminate the ferroelectric spontaneous …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":109},{"title":"Tribo‐Ionovoltaic Coupling Effect of Perovskite Schottky Junction Enables Hybrid Energy Harvesting and Multimodal Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78681?af=R","doi":"10.1002/adfm.78681","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":[],"authorMore":false,"abstract":"In this work, an ionovoltaic-triboelectric coupling strategy is proposed for the first time to enable performance modulation of perovskite-based ionovoltaic devices. The dynamic coupling of these two mechanisms confers upon the devices not only distinctive hybrid energy harvesting capability and performance enhancement, but also superior multimodal sensing functionality, positioning them as promising candidates for wearable energy and self-powered sensing applications. ABSTRACT The ionovoltaic effect in halide perovskites enables moisture-induced electricity generation, opening a new avenue for sustainable energy harvesting. However, mediocre performance and the absence of reliable …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":110},{"title":"Intrinsic‐Decoupled Biomimetic Two‐Dimensional Sensing Enabled by Positive‐Negative Dielectric Heterostructures for Pressure Visualization","url":"https://doi.org/10.1002/adfm.79319","doi":"10.1002/adfm.79319","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-31","topic":"智能传感","topics":["智能传感"],"matchTerm":"tactile sensors","matchWhere":"摘要：tactile sensors","score":3,"authors":["Jingjing Li","Peng Li","Yuanhang Xu","Fujing Xie","Kaiqi Guo","Feihong Ran"],"authorMore":true,"abstract":"ABSTRACT Flexible tactile sensors capable of simultaneously emulating the multidirectional perception of human skin and realizing intrinsic force decoupling remain a critical challenge for advanced robotics and intelligent human‐machine interfaces. Inspired by the hierarchical architecture of epidermal cells, we present a two‐dimensional force sensor (TDFS) featuring a biomimetic heterostructure that enables structural separation of normal and tangential force components. Force discrimination is enabled by engineering a negative‐permittivity composite with a gradient‐modulus architecture that mechanically reduces the overlap between deformation fields induced by normal and tangential …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-31","tkey":"other","id":111},{"title":"Waveguided, Self‐Sensing Sheath–Core Liquid Crystal Elastomer Fiber Actuators","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75597?af=R","doi":"10.1002/adma.75597","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-30","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-sensing","matchWhere":"摘要：self-sensing","score":3,"authors":["Hailong Wei","Cheng Zhou","Zhoutao Li","Zhixin Wang","Futing Gao","Yuwei Tian"],"authorMore":true,"abstract":"Soft robotic systems demand fiber-form actuators merging actuation, sensing, and localized control for constrained environments. A waveguided sheath-core fiber actuator coupling a liquid crystal elastomer core with a carbon composite conductive sheath was developed. Light-induced reversible contraction up to 38% and 320-fold weight-bearing capacity enable optically addressable programmable gripping, with concurrent real-time actuation stroke readout from the resistance change of the conductive sheath. ABSTRACT Soft actuators capable of operating in confined and hard-to-access environments, while providing integrated self-sensing capabilities, are highly desired for next-generation robotic … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-31","tkey":"other","id":112},{"title":"A Superelastic Xylan‐Stabilized Liquid Metal Aerogel for Wearable Energy Harvesting and Personal Thermal Management","url":"https://doi.org/10.1002/adfm.79410","doi":"10.1002/adfm.79410","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-29","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Qiang Liu","Yin Yan","Mingguo Ma","Mingfei Li","Feng Peng","Jing Bian"],"authorMore":false,"abstract":"ABSTRACT The rapid development of wearable electronics places higher demands on materials with mechanical flexibility, sustainable energy supply, and thermal management. However, incorporating conductive fillers such as liquid metal (LM) into soft porous materials may introduce additional heat‐transfer pathways and complicate thermal management. Here, a molecular and structural engineering strategy is reported to integrate triboelectric energy harvesting with thermal insulation in a superelastic aerogel. Industrial xylan is converted into carboxymethyl xylan (CMX) through ball‐milling pretreatment and etherification, enabling stable dispersion of LM micro/nanodroplets. Subsequently, by … ✅ …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":113},{"title":"Fundamental Inhibition of Polyiodide Formation by a Site‐Separated Binder for Highly Stable Aqueous Zinc–Iodine Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75534?af=R","doi":"10.1002/adma.75534","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-29","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Guoli Zhang","Haoren Zheng","Xinkai Liang","Ping Lu","Xiao‐Xia Liu","Xiaoqi Sun"],"authorMore":false,"abstract":"A site-separated polymer binder is presented to address the polyiodide issues with iodine cathodes by fundamentally blocking their generation paths. The binder provides strong and selective binding of I 2 and I − on separated side chains and regulates their thermodynamic features, which disrupts their chemical coupling and promotes direct electrochemical conversion. Highly stable Zn-I 2 batteries are realized even with high loadings. ABSTRACT Aqueous Zn–I 2 batteries are promising for sustainable energy storage systems, yet their practical performance is severely limited by the formation and shuttling of polyiodide intermediates. Here, we report a site separation strategy to block the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":114},{"title":"Breaking the Limits of Piezo‐Photocatalysis: Pd‐O d‐p Orbital Hybridization Mediated Charge Reconstruction and Polarization Enhancement","url":"https://doi.org/10.1002/adfm.79377","doi":"10.1002/adfm.79377","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-29","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Meng Dai","Yi Ren","Shumeng Qin","Hongsheng Li","Ziye Zheng","Lihui Xiao"],"authorMore":true,"abstract":"ABSTRACT Piezo‐photocatalysis has emerged as a promising strategy to suppress charge recombination in conventional photocatalysis for the removal of refractory organic pollutants and green hydrogen peroxide (H₂O₂) production. Nevertheless, sulfide‐based piezo‐photocatalysts still suffer from weak piezoelectric response and ambiguous coupling mechanisms between atomic orbitals and polarization. Herein, we designed Pd‐doped and lattice oxygen‐modified Zn 3 In 2 S 6 piezo‐photocatalyst (Zn 3 In 2 S 6 ‐Pd‐350) by regulating d‐p orbital hybridization at Pd sites to achieve efficient piezo‐photocatalytic performance. Lattice oxygen occupies sulfur vacancies and converts Pd–S into Pd–O …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":115},{"title":"An Adaptive Dual‐Network Binder With Multiple‐Hydrogen‐Bond for Durable Aqueous Zn‐Ion Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78495?af=R","doi":"10.1002/adfm.78495","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Hongxu Zhang","Meijia Qiu","Yumeng Lu","Yanan Wang","Wanglin Li","Han Huang","Yuxuan Liang","Peng Sun","Wenjie Mai"],"authorMore":false,"abstract":"Inspired by the extracellular matrix, an adaptive dual-network binder with multiple hydrogen bonding enables balanced wettability, fast Zn 2 + transport, and suppressed cathode dissolution for durable aqueous Zn-ion batteries. ABSTRACT The practical application of aqueous Zn-ion batteries is limited by unstable cathode interfaces, sluggish Zn 2+ transport, and water-induced structural degradation. Here we report a biomimetic adaptive dual-network binder (DNB) with multiple-hydrogen-bond that simultaneously reinforces electrode mechanics, regulates interfacial wettability, and suppresses parasitic reactions. This binder integrates a hydrophobic polyvinylidene fluoride (PVDF) skeleton with a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":116},{"title":"Electric Eel‐Inspired Janus Nanofiber Membrane With Structure‐Charge Dual Asymmetry for Efficient Moisture‐to‐Electric Conversion and Self‐Powered Intelligent Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78525?af=R","doi":"10.1002/adfm.78525","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-powered sensing","matchWhere":"摘要：self-powered sensing","score":3,"authors":["Jin Fang","Zhiwei Zhao","Yifan Zu","Qingqing Ni","Zhenzhen Xu"],"authorMore":false,"abstract":"An electric-eel-inspired structure-charge dual-asymmetric architecture establishes directional ion transport, enhancing moisture-enabled electricity generation and self-powered sensing. The coupled asymmetry provides a bioinspired route toward efficient moisture-to-electric energy conversion and intelligent perception. ABSTRACT Moisture-electric generators (MEGs) harvest the chemical potential of ambient water vapor as electricity. The central limitation is not ion generation alone, but the failure to coordinate ionic release, directional flux, and interfacial separation, allowing diffusion and back migration to dissipate the available potential. Inspired by electric eel electrocytes, we …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":117},{"title":"Single‐Sensor Vibration Sensing in Anisotropic Composites Enabled by Disordered Metasurfaces","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76951?af=R","doi":"10.1002/advs.76951","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"智能传感","topics":["智能传感"],"matchTerm":"structural health monitoring","matchWhere":"摘要：structural health monitoring","score":3,"authors":["Jianjie Zhang","Lanhe Xu","Zhongzheng Zhang","Yongbo Li","Eric Li","Asoke K. Nandi","Bing Li"],"authorMore":false,"abstract":"This work develops a single-sensor vibration sensing (SSVS) framework that integrates disordered metasurfaces with compressive sensing. Comprehensive numerical and experimental validations demonstrate that, by manipulating anisotropic guided wave propagation through metasurfaces, the proposed SSVS framework enables high-fidelity multi-source vibration localization and signal identification with a single sensor across diverse anisotropic lay-ups, complex vibration conditions, and curved structures with different curvatures. ABSTRACT Efficient vibration sensing in composite structures is often hindered by the anisotropic nature of wave propagation, which traditionally necessitates dense …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":118},{"title":"One‐Pot Direct Recycling of Spent LiCoO2 via Synergistic Binder Defluorination and Phase Reconstruction","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76961?af=R","doi":"10.1002/advs.76961","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":[],"authorMore":false,"abstract":"A Li + -DES system enables targeted defluorination and synergistic repair of spent LiCoO₂ cathodes in a single medium. The regenerated material recovers a well-ordered layered structure with a high capacity of 157.4 mAh g −1 and 83.1% capacity retention after 300 cycles, demonstrating a sustainable and efficient closed-loop recycling strategy for lithium-ion batteries. ABSTRACT Direct recycling of spent lithium-ion battery cathodes is hindered by two interdependent challenges: persistent polyvinylidene fluoride (PVDF) binder residues that block particle surfaces and incomplete structural repair of degraded layered phases. Here, we report a one-pot regeneration strategy based on a Li + …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":119},{"title":"Latent Diffusion Process With Mechanistic Guidance For Designing Functionally Graded Metamaterials With Perfect Connectivity","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76914?af=R","doi":"10.1002/advs.76914","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"mechanical metamaterials","matchWhere":"摘要：mechanical metamaterials","score":3,"authors":["Jongbin Yu","Dosung Lee","Namjung Kim"],"authorMore":false,"abstract":"A latent diffusion-based framework is proposed for designing functionally graded metamaterials with perfect connectivity. By integrating vector-quantized latent representations with mechanistic guidance, the framework enables accurate inverse design toward target elastic properties. A hybrid interpolation strategy combining latent interpolation and diffusion-based guidance achieves smooth mechanical transitions while preserving complete connectivity, as demonstrated through a biomedical femoral implant application. ABSTRACT Recent advancements in artificial intelligence (AI)–based design strategies have expanded the ability to generate complex mechanical metamaterials across multiple length …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":120},{"title":"Giant Electrobending with Superior Thermal Stability in (K,Na)NbO3 Based Lead‐Free Piezoceramics: Insights from Polarization Configuration","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79325?af=R","doi":"10.1002/adfm.79325","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Tongxin Wei","Jinzhu Zou","Zhongna Yan","Miao Song","Xuefan Zhou","Kechou Zhou","Dou Zhang","Shujun Zhang"],"authorMore":false,"abstract":"The intrinsic coupling between polarization configuration and giant electrobending is uncovered in (K,Na)NbO₃ based lead-free piezoceramics. Multiscale flexible polarization engineering yields ultrahigh electrobending with exceptional thermal stability across −40°C–160 °C, paired with excellent small-signal piezoelectric performance promising for high-precision actuator applications. ABSTRACT Electrobending in lead-free piezoceramics has recently achieved remarkable attention, but the intrinsic coupling between electrobending and polarization configuration remains inadequately understood —leading to temperature instability that plagues practical applications. Herein, combining finite …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":121},{"title":"Harnessing Defect Engineered Multiferroic Catalysts for Cascade Responsive Microwave and Sonodynamic Therapy in Osteomyelitis","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79253?af=R","doi":"10.1002/adfm.79253","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Xuxu Chen","Jing Ren","Quanheng Yu","Ziwei Zhao","Shichang Liu","Xinhua Yin","Liang Yan","Ming Yang"],"authorMore":false,"abstract":"Schematic illustration of the fabrication of RP/Mn-BFO hydrogel microspheres and their sequential therapeutic mechanism for bacterial osteomyelitis under microwave/ultrasound dual-field stimulation. The dual-field stimulation triggers Mn-BFO nanosheets to generate heat and burst ROS for sterilization, while the sustained release of RP-EVs promotes macrophage M2 polarization and osteogenic repair. ABSTRACT Efficient multi physics energy conversion, particularly the transformation of microwave and ultrasound energy into localized heat and reactive oxygen species, offers great potential for non-invasive biomedical therapy. However, conventional single modal catalysts suffer from inefficient …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":122},{"title":"Materials and Design Strategies of Fully 3D Printed Biodegradable Wireless Devices for Biomedical Applications","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78432?af=R","doi":"10.1002/adfm.78432","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensor","matchWhere":"摘要：pressure sensor","score":3,"authors":[],"authorMore":false,"abstract":"A 3D-printable and fully biodegradable ink platform is presented to enable fully integrated bioelectronic systems, including conductors, semiconductors, and dielectrics. Demonstrated applications include a wireless pressure sensor and a wireless nerve stimulator, highlighting the potential for streamlined, monolithic fabrication of customizable, transient medical devices for diagnostics and therapy without requiring surgical retrieval. ABSTRACT 3D printing of bioelectronics offers a versatile platform for fabricating personalized and structurally integrated electronic systems within biological scaffolds. Biodegradable electronics, which naturally dissolve after their functional lifetime, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":123},{"title":"Lattice‐Level Negative Thermal Expansion Enables Thermomechanical Self‐Compensation in High‐Rate Lithium Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79327?af=R","doi":"10.1002/adfm.79327","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-26","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Yuhan Feng","Yaohui Dai","Chaozhong Liu","Lizhi Li","Zhenzhu Wang","Wenqiang Lu","Xingji Li","Bo Song"],"authorMore":false,"abstract":"A negative thermal expansion Cu 2 P 2 O 7 phase is coupled to a PVDF-HFP separator through a polydopamine interface, converting lattice contraction into macroscopic thermal shrinkage resistance. The composite membrane preserves ion pathways under thermal stress, stabilizes lithium deposition, and supports high rate Ni-rich lithium metal cells, highlighting an active thermomechanical design strategy for safer power systems. ABSTRACT Localized Joule heating in high-rate lithium metal batteries often induces severe thermomechanical failure of polymer separators and accelerates thermal runaway in cells with Ni-rich NCM cathode. Here we report a multiscale separator design strategy that …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":124},{"title":"From Artificial to Embodied and Physical Intelligence in Smart Manufacturing","url":"https://doi.org/10.1002/advs.78384","doi":"10.1002/advs.78384","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"multistable","matchWhere":"摘要：multistable","score":3,"authors":["Kang Wang","Xinyu Lu","Tong Liu","Jinjie Fang","Xin Li","Siqian Wu"],"authorMore":false,"abstract":"ABSTRACT Manufacturing is evolving from automation‐centered production toward systems capable of sensing, adaptation, and autonomous response across digital, mechanical, and material domains. Although recent progress has been largely driven by artificial intelligence, current manufacturing intelligence often remains external to physical systems and suffers from limited robustness, interpretability, and transferability in complex industrial environments. Here, we present a unified perspective on smart manufacturing through the framework of artificial intelligence (AI), embodied intelligence (EI), and physical intelligence (PI). AI provides abstraction, prediction, and generative capability; …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":125},{"title":"Fatigue‐Resistant Biaxially Stretchable Micro‐Origami Structured Electrodes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79271?af=R","doi":"10.1002/adfm.79271","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-24","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensor","matchWhere":"摘要：pressure sensor","score":3,"authors":["Yifei Huang","Yujun Deng","Peiyun Yi","Linfa Peng"],"authorMore":false,"abstract":"This work presents a micro-origami structured electrode which introduces biaxially foldable micro-origami structures onto the surface of a bilayer thin-film electrode composed of a metal film and a polymer substrate. The electrode exhibits biaxial stretchability (\u003e80%) while maintaining high conductivity and excellent fatigue resistance (ABSTRACT Stretchable electrodes are essential for next generation wearable electronics, but simultaneously achieving high conductivity, large stretchability, and long-term reliability remains challenging. This work proposes a micro-origami structured electrode (MOSE) that mitigates the conflicts between stretchability, conductivity and fatigue resistance. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":126},{"title":"Striated Core‐Sheath Fibers for Constructing Breathable Intelligent Fabrics With Multiple X‐Ray Shielding and Strain‐Pressure Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78385?af=R","doi":"10.1002/adfm.78385","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive","score":3,"authors":[],"authorMore":false,"abstract":"Striated core-sheath fibers fabricated via coaxial wet-spinning are woven into multilayer breathable textiles, integrating high-efficiency X-ray shielding, sensitive mechanical sensing and Morse-code transmission for wearable radiation-protection. ABSTRACT The extensive use of medical X-rays increases chronic radiation exposure risks for medical staff and patients. Traditional lead-based materials present low shielding efficiency at 20–100 keV, along with high weight, stiffness, poor flexibility, toxicity, and single functionality, limiting their wearable applications. Herein, hierarchical striated Bi 2 O₃ /WC/TPU@MXene/TPU (BWMT) core-sheath fibers are fabricated via coaxial wet-spinning. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":127},{"title":"Analog‐Tunable Nonvolatile Memristors with Self‐Compliance Behavior via a MoSx‐Interlayer Strategy for Neuromorphic Recognition and Zero‐Trust Image Encryption","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79481?af=R","doi":"10.1002/adfm.79481","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Yuanyuan Zhu","Ziyi Yang","Daobin Luo","Youqing Wang","Huixia Liao","Chunyang Wu"],"authorMore":false,"abstract":"An HfO x /MoS x /HfO x trilayer memristor achieves intrinsic self-compliance and linear analog switching via oxygen-sulfur vacancy synergy. It emulates full synaptic plasticity, attains 93.84% MNIST accuracy, and acts as a physical entropy source for high-entropy XOR image encryption. ABSTRACT The von Neumann memory wall severely restricts the performance of traditional computing systems, and memristors have emerged as premier candidates for neuromorphic computing by virtue of their ability to integrate storage and computation functions. However, conventional HfO x memristors suffer from abrupt resistive switching and lack of intrinsic self-protection, limiting their synaptic emulation …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":128},{"title":"Ion‐Modulated All‑Van Der Waals Spin–Orbit Torque Magnetic Tunnel Junctions With Multilevel Switching","url":"https://doi.org/10.1002/adfm.79511","doi":"10.1002/adfm.79511","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Yuxin Tian","Zhiyan Jia","Qian Chen","Shizhe Wu","Mengfan Zhao","Yi Wang"],"authorMore":false,"abstract":"ABSTRACT Advancing van der Waals (vdW) spintronics requires hardware for multistate storage and in‐memory processing. All‑vdW spin–orbit torque magnetic tunnel junctions (SOT‑MTJs) that simultaneously achieve field‑free operation and multilevel switching have remained elusive. Here, we report an ion‑modulated all‑vdW SOT‑MTJ with a stack structure of WTe 2 /Fe 3 GaTe 2 /WSe 2 /Fe 3 GaTe 2 /CuInP 2 S 6 (CIPS). We then apply pulsed currents along the crystallographic a ‑axis of WTe 2, which produce field‑free deterministic SOT switching with ultralow critical current density of 2–5 × 10 6 A/cm 2 at 300 K, and excite resistance changes at the MTJ. The SOT efficiency of WTe 2 is ∼0.35. The … ✅ …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":129},{"title":"Breaking the Aperture Limit: Interference‐Enhanced Stacking and Constraint‐Driven Design of Metallic Meshes","url":"https://doi.org/10.1002/adfm.79527","doi":"10.1002/adfm.79527","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Chengzhou Zhang","Jizhe Zhang","Zhikun Yang","Liang He","Caixia Kan","Xingzhong Zhu"],"authorMore":false,"abstract":"ABSTRACT Achieving high optical transmittance and shielding effectiveness (SE) remains challenging for transparent electromagnetic interference (EMI) shielding materials. Herein, a physics‐guided, constraint‐driven design strategy for metallic meshes is developed through electromagnetic simulations, machine learning, and experiments. Single‐layer SE approaches saturation with increasing conductivity at a level set by the mesh geometry, dominated by the period, while the conductivity required for saturation decreases with increasing conductor cross‐section. At a fixed cross‐sectional area, a narrow‐and‐high cross‐section (w ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":130},{"title":"Unlocking the Potential of Magnesium‐Based Hydrogen Storage Composites via Advanced Thermodynamic and Kinetic Tuning Strategies","url":"https:// etic tunnel junctions (MTJs) can be mapped to stochastic-threshold spiking neurons, providing a physical sampling primitive for Bayesian spiking inference. We develop a spiking Bayesian neural network (SBNN) with neuronal threshold distributions learned during training and sampled during inference. We also introduce a rate-estimation method …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":132},{"title":"CoSP: Reconfigurable Metamaterial Inverse Design via Contrastive Pretrained Large Language Model","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76917?af=R","doi":"10.1002/advs.76917","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"摘要：deep learning","score":2,"authors":["Shujie Yang","Yuqi Zhang","Xuzhe Zhao","Yansong Tang","Kaichen Dong"],"authorMore":false,"abstract":"In this work, CoSP (contrastive multi-state pretrain), an intelligent inverse design method for reconfigurable metamaterials based on a contrastive pretrained large language model, is proposed. Numerical experiments demonstrate that CoSP can design reconfigurable metamaterial structures for multi-state, multi-band optical responses, showing great potential in versatile applications such as thermal management, optical computation, and telecommunications. ABSTRACT Metamaterials for light manipulation at subwavelength scales face significant design challenges due to their complex and sophisticated structures, leading to the emergence of deep learning as a powerful tool to streamline their …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":133},{"title":"Trustworthy Multimodal Attention Framework for Creep Rupture Life Prediction Under Data‐Scarce Conditions: A Case Study on IN718","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77026?af=R","doi":"10.1002/advs.77026","journal":"Advanced Science","jabbr and microenvironmental organization remain poorly defined. Here, we integrated single-cell RNA sequencing, spatial transcriptomics, multiplex immunofluorescence, bulk …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":135},{"title":"Rainfall Shapes the Diversity of Soil Nitrogen‐Fixing Microorganisms Worldwide","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77215?af=R","doi":"10.1002/advs.77215","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"机器学习","topics":["机器学习"],"matchTerm":"XGBoost","matchWhere":"摘要：XGBoost","score":2,"authors":[],"authorMore":false,"abstract":"This study reveals the distinctive pattern and mechanism of rainfall driving the global biodiversity and biogeography of soil potential N-fixing microorganisms, and constructs the theoretical framework. The results guide us on how to maintain ecosystem productivity under future climate changes (e.g., whether a specific region needs more N fertilizers, N-fixing agents, or other nutrients). ABSTRACT Soil nitrogen-fixing microorganisms naturally fertilize terrestrial ecosystems, but the primary driver of their diversity across the globe and the underlying mechanisms remain unclear. We analyzed the nifH gene in 1257 (1137 publicly available + 120 self-generated) soil metagenomes from 318 …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":136},{"title":"Triple‐Level Content‐Addressable Vertical NAND Flash Memory","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77390?af=R","doi":"10.1002/advs.77390","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":[],"authorMore":false,"abstract":"Commercial triple-level-cell V-NAND flash memory is transformed into a compact content-addressable memory by directly exploiting its eight threshold- tkey":"other","id":138},{"title":"“Smelltronics”—From Gas to Smell Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.202523677?af=R","doi":"10.1002/adma.202523677","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Takeshi Ono","Tsunaki Takahashi","Jiangyang Liu","Haruka Honda","Zeng Jing","Wataru Tanaka"],"authorMore":true,"abstract":"The emerging field of smelltronics, encompassing sensing technologies for complex volatile organic compounds, holds significant potential for extracting valuable chemical information. It facilitates the noninvasive, real-time monitoring of humans, food, and the environment. This review examines the sensing materials, devices, and systems employed for odor detection, addressing current challenges and future perspectives. ABSTRACT This review discusses recent trends in smell and odor-sensing studies, including materials, devices, and interfaces. Since the invention of chemical sensors, particularly over the past few decades, gas sensor materials and devices for small molecules have been … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":139},{"title":"Machine‐Learning‐Powered Screening of CuNi@FeO Electrocatalyst for Nitrate‐to‐Ammonia Conversion in Industrial Wastewater Concentrate","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78621?af=R","doi":"10.1002/adfm.78621","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":[],"authorMore":false,"abstract":"A literature-informed machine-learning framework revealed composition-performance associations for nitrate-to-ammonia electrocatalysis, while a self-supported CuNi@FeO inte -ion batteries, directly linking lithium transport, dendrite growth and interfacial short-circuiting to a physics-informed machine-learning roadmap that turns this non-destructive operando measurement into a basis for intelligent battery design. ABSTRACT Neutron Depth Profiling (NDP) is a non-destructive, in situ quantitative depth-analysis technique underpinned by neutron-induced nuclear reactions. Offering high 6 Li-isotope sensitivity and nanometer-to-micrometer depth resolution, NDP delivers isotope-resolved lithium spatial …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-01","tkey":"other","id":143},{"title":"Blending With Insulating Polymers Enables Stable Anti‐Ambipolar Characteristics in n‐Type Organic Mixed‐Conductors for Heterogeneous Spiking Neurons","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75538?af=R","doi":"10.1002/adma.75538","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-31","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural networks","matchWhere":"摘要：neural networks","score":2,"authors":["Zachary Laswick","Ariel Lifer","Catherine Beaumont","Liad Hayoun","Priscila Cavassin","Zeinab Hamid"],"authorMore":true,"abstract":"A polymer blend of n-type OMIEC P(gNDI-gT2) with insulating PMMA yields mechanically stabilized, anti-ambipolar organic electrochemical transistors (OECTs) with tunable ionic-electronic transport. This blending allows low-power, fast-spiking heterogeneous Hodgkin–Huxley neurons, enabling biomimetic frequency deconvolution and reservoir computing, which are key primitives for realizing energy-efficient neuromorphic spiking neural networks. ABSTRACT Mammalian neurons exhibit diverse structural and physiological properties: a heterogeneity not present in current neuromorphic systems. Recent advancements have led to bio-realistic spiking systems which are based on the integration and long-term …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-01","tkey":"other","id":144},{"title":"Intelligent Polymer Electrolytes for Next‐Generation Zinc‐Based Energy Storage Devices","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78546?af=R","doi":"10.1002/advs.78546","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-31","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Sanath Kumar","Jhansirani Kesavan","Muhammad Asim","Atul Verma","Yen‐Pei Fu"],"authorMore":false,"abstract":"Intelligent polymer electrolytes are organized into a three-level hierarchy that advances zinc-based energy storage from passive ion conduction toward active, adaptive, and intelligent operation. Molecular regulation of Zn + coordination, water activity, desolvation, ion flux, and interfaces underpins adaptive self-healing, anti-freezing, adhesion, and mechanical responses, while feedback and AI/ML enable future self-adaptive ZIBs, ZABs, and ZIHCs. ABSTRACT Intelligent polymer electrolytes for zinc-based energy-storage devices have attracted considerable attention as multifunctional platforms capable of simultaneously regulating ion transport, water activity, interfacial chemistry, and …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-01","tkey":"other","id":145},{"title":"Non‐Invasive Assessment of Perineural Invasion Density: A Novel Marker for Prognosis and Treatment Stratification in Prostate Cancer","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78460?af=R","doi":"10.1002/advs.78460","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-31","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"摘要：deep learning","score":2,"authors":["Bohao Liu","Long Zhang","Weian Zhu","Meng Yang","Xiang Liu","Xiaoyang Li"],"authorMore":true,"abstract":"This study establishes perineural invasion density (PNID) as a superior prognostic marker in prostate cancer, outperforming conventional perineural inva e Hexaferrites via Hierarchical and Uncertainty‐Aware Machine‐Learning","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78493?af=R","doi":"10.1002/advs.78493","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-29","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Dan Liu","Jianyu Ren","Ruoshui Liu","Yinong Yin","Jianfeng Xi","Xin Ming"],"authorMore":true,"abstract":"Refined data are extracted from CIF files to construct a hierarchical machine-learning framework integrating sublattice classification, Fe-site occupancy prediction, and reliability assessment. External validation yields 96% accuracy for sublattice classification and a macro mean absolute error of 0.0584 for Fe-site prediction. This study provides a basis for initial occupancy hypotheses and refinement prioritization in M-type hexaferrites. ABSTRACT Dopant site occupancy bridges chemical composition, local crystal structure, and macroscopic functional responses in M-type hexaferrites. However, reliable occupancy hypotheses are difficult to establish before structural refinement. Here, we … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":148},{"title":"Entropy Stabilized Li‐Rich Layered Oxide Nanoparticles for Advanced High‐Voltage Cathodes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75561?af=R","doi":"10.1002/adma.75561","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-29","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Siyu Zhu","Wei Nong","Ziying Yu","Lei Huang","Chengyi Liu","Erhai Hu"],"authorMore":true,"abstract":"A laser-induced carbothermal method is employed to synthesize high-entropy doped Li-rich nanoparticles. The particle minimization design is proved to reduce energy loss, while the high entropy doping strategy improves voltage and capacity retention. Together, these two features contribute to outstanding electrochemical performance of the cathode material. The assembled full cell and fiber battery provide significant practical feasibility during high-voltage cycling. ABSTRACT The performance enhancement of emerging flexible batteries relies on the development of advanced small-particle electrode materials. However, current cathode materials with reduced particle size mostly suffer from low …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":149},{"title":"Multiscale Design of Cathode Materials for Fast‐Charging Lithium‐Ion Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78457?af=R","doi":"10.1002/adfm.78457","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":[],"authorMore":false,"abstract":"Advances in cathode materials are critical to improving the fast charging performance of lithium-ion batteries. Against this backdrop, we examine the multiscale challenges faced by fast-charging cathodes and the corresponding strategies for improvement. We also highlight the key role of advanced materials characterization and machine learning in guiding the design of high-power, long cycle life lithium-ion batteries. ABSTRACT The widespread adoption of electric vehicles is contingent upon the development of lithium-ion batteries capable of extreme fast charging (XFC). Although graphite anodes are often regarded as the primary bottleneck because of lithium plating risk, cathode transport …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":150},{"title":"Chip‐Compatible Optical Field Manipulation for a Single Mode Fiber Using Ultrathin 3D‐Nanoprinted Diffractive Neural Surfaces","url":"https://advanced.onlinelibrary.wil liable separation of contact material and pressure and support compact in sensor machine learning. ABSTRACT Tactile perception relies on early preprocessing of signals from adapting afferents; in particular, synapse-like coupling between afferent nerve fibers and adapting mechanoreceptors supports transduction and sensory memory, enabling efficient central representations of tactile information. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":152},{"title":"Shear‐Stimulated Bioprinting Enables Anisotropic and Multi‐Region Neural Bioconstruct","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78515?af=R","doi":"10.1002/adfm.78515","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Hanjun Hwangbo","Huyen Ngo","WonJin Kim","Hansang Cho","GeunHyung Kim"],"authorMore":false,"abstract":"This study presents a shear-based external stimulation (SES) bioprinting strategy for engineering anisotropic neural bioconstructs. SES-induced mechanical stimulation and aligned topographical guidance activated mechanotransduction, enhanced neurogenesis, and promoted neurite extension. Multi-region cellular–acellular–cellular neural architectures further enabled directed neuronal connectivity and spatially organized neural network formation. ABSTRACT Engineering neural tissues with controlled cellular organization remains challenging due to the limited ability of conventional bioprinting to regulate cellular anisotropy. Here, we present a blade-assisted shear-stimulated bioprinting …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":153},{"title":"Defect‐Mediated Optical Gating in Phase‐Engineered Ferroelectrics for Machine‐Learning‐Assisted Optical Encryption","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78076?af=R","doi":"10.1002/adfm.78076","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Peng Li","Zhengxiu Ma","Weiye Nie","Mingze Sun","Jingrui Qiu","Xihua An","Xiandi Jin","Qiwei Zhang","Wenwu Cao","Baoming Wang"],"authorMore":false,"abstract":"A phase-selective defect engineering strategy in Sm-doped ferroelectrics achieves high-contrast luminescence modulation. The r1hombohedral-to-tetragonal phase transition induces abundant oxygen vacancies, forming photo-responsive color centers that act as reabsorption-dominated optical shutters. This optical gating mechanism empowers a machine-learning-assisted polymorphic arithmetic encryption system, achieving over 97% accuracy for machine-learning-assisted optical information storage and encryption. ABSTRACT Optical data storage and anti-counterfeiting technologies require materials that combine high-contrast photoswitching with computational readout. Herein, we present a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":154},{"title":"Photothermal‐Modulated Electrohydrodynamic Jet Printing of Flexible and Recyclable Photocatalytic Devices for Visible‐Light‐Driven Water Purification","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78470?af=R","doi":"10.1002/adfm.78470","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Kai Li","Junyang Fang","Jialiang Liu","Meng Li","Zhongxian Wu","Dazhi Wang","Yang Lu"],"authorMore":false,"abstract":"Photothermal-modulated electrohydrodynamic jet printing enables one-step fabrication of flexible, recyclable g-C 3 N 4 /BiOI heterojunction photocatalytic devices on silanized quartz fiber fabrics. Laser-assisted droplet regulation suppresses secondary agglomeration, while ALA-ANN optimizes printing fidelity. The resulting devices combine efficient visible-light pollutant degradation, stable catalyst immobilization, facile recovery, and favorable environmental compatibility, offering a scalable route toward sustainable water purification. ABSTRACT Powder-based heterojunction photocatalysts suffer from aggregation, difficult recovery, and secondary pollution, limiting their practical …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":155},{"title":"Machine‐Learning‐Guided DNAzyme Nanocages for Photoresponsive Immunomodulation and Spatiotemporal Control of Diabetic Bone Regeneration","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78518?af=R","doi":"10.1002/adfm.78518","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Nanxin Liu","Mengjiao Huang","Can Shen","Siyu Tao","Wei Wu","Wei Du","Panpan Liang","Hong Huang","Tao Chen"],"authorMore":false,"abstract":"This work combines machine learning with a light-responsive DNAzyme nanocage to identify potent RNA-cleaving sequences and control when gene silencing begins. Near-infrared activation enables localized suppression of inflammatory signaling, while delayed treatment preserves beneficial early inflammation, promotes the clearance of dying cells, and markedly improves bone regeneration in diabetic defects. ABSTRACT Inflammation poses a therapeutic paradox, as cytokine signals driving inflammatory disease can also provide transient repair cues. Effective intervention therefore requires selective suppression of pathogenic mediators and control over inhibition timing. RNA-cleaving DNAzymes are …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":156},{"title":"Hardware‐Intrinsic Encryption Using Spectrally Multiplexed Nitrogen Vacancy Spin Ensembles in Nanodiamonds","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79303?af=R","doi":"10.1002/adfm.79303","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Jiaqi Li","Tongtong Zhang","Zhiqin Chu"],"authorMore":false,"abstract":"Spectrally multiplexed nitrogen-vacancy spin ensembles in randomly distributed nanodiamonds transform microwave-programmed plaintext into hardware-specific coherent Rabi waveforms. Microwave amplitude and phase encode the input, whereas channel-dependent coupling and decoherence impart hardware specificity, producing a dynamically reconfigurable physical cipher within a diffraction-limited footprint for compact, hardware-bound information protection. ABSTRACT Secure encryption lies at the heart of data protection across virtually every sector of modern society. Physical unclonable functions (PUFs) provide an indispensable root of trust for ensuring this security. However, existing PUFs …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":157},{"title":"An Environmental Stable Ionogel‐Based Smart Glove System for Integrated Underwater Communication and Safety Warning","url":"https://doi.org/10.1002/advs.78325","doi":"10.1002/advs.78325","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Xiaoqin Li","Jianwen Liu","Wenhao Yang","Wenjing Yue","Nam‐Young Kim","Young‐Kee Shin"],"authorMore":false,"abstract":"ABSTRACT Flexible sensing technology based on hydrogel‐based smart gloves enables accurate gesture recognition in complex environments, but such gloves degrade in dry, high‐temperature, and underwater conditions, and their complex assembly limits practical usability. Here, a smart glove monitoring system is developed by integrating a poly(benzyl methacrylate‐co‐2‐hydroxyethyl acrylate)/ionic liquid (P(BZMA‐co‐HEA)/IL) ionogel sensing layer with a flexible printed circuit board (FPCB). The ionogel is constructed through a network‐constrained ionic soft‐space regulation strategy, where HEA‐rich segments strengthen the network, IL provides deformation‐adaptive ionic soft spaces, and BZMA‐rich …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":158},{"title":"XChrom: A Cross‐Cell Chromatin Accessibility Prediction Model Integrating Genomic Sequence and Cellular Context","url":"https://doi.org/10.1002/advs.78456","doi":"10.1002/advs.78456","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"摘要：deep learning","score":2,"authors":["Yuanyuan Miao","Xuan Liang","Wenwen Zhang","Dongmei Han","Yurun Li","Zhen Wang"],"authorMore":false,"abstract":"ABSTRACT Single‐cell chromatin accessibility offers unique insights into transcriptional regulation beyond gene expression. However, paired datasets of these two modalities remain relatively scarce, and existing computational models cannot simultaneously predict chromatin accessibility for unseen genomic regions and cells. Here, we present XChrom, a deep learning framework for genome‐wide cross‐cell chromatin accessibility prediction that integrates genomic sequence and single‐cell transcriptomics‐derived cell identity into a unified model. Comprehensive evaluations show that XChrom consistently outperforms existing methods in cross‐region and cross‐cell predictions, and uniquely enables … …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":159},{"title":"TSTScope Unifies Single‐Cell Multi‐Omics to Identify Functional T Cell States Predictive of Immunotherapy Response","url":"https://advan sistance, interconnected transport channels, overcomes the permeability-selectivity trade-off, and combines high-performance separation with scalable fabrication. ABSTRACT Amorphous polymer membranes typically suffer from low fractional free volume (FFV) due to structural flexibility, limiting separation performance and operational stability. Herein, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":161},{"title":"Mesoporous‐Shell Monolayer Plasmonic Architecture Enables Quantitative and Decision‐Guided SERS","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77299?af=R","doi":"10.1002/advs.77299","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":[],"authorMore":false,"abstract":"Mesoporous-shell-regulated molecular transport combined with monolayer hotspot determinism transforms surface-enhanced Raman spectroscopy (SERS) from ultrasensitive detection into quantitative and decision-guided molecular sensing. ABSTRACT Quantitative surface-enhanced Raman spectroscopy (SERS) has long been impeded by stochastic hotspot formation, signal instability, and limited chemical fidelity in complex environments. Overcoming these intrinsic limitations requires structural control at the nanoscale rather than incremental improvements in signal amplification. Here, we introduce a mesoporous-shell monolayer plasmonic architecture that enables quantitative and decision-guided SERS by … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":162},{"title":"Closed‐Loop Bioelectronics: From Functional Materials to Autonomous Therapy","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75519?af=R","doi":"10.1002/adma.75519","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Narlawar Sagar Shrikrishna","Drishya Prakashan","Sonu Gandhi"],"authorMore":false,"abstract":"This graphical abstract illustrates the closed-loop bioelectronics paradigm, integrating functional materials, biosensing and actuation interfaces, intelligent system architectures, and clinical translation. At its core, the cycle of Sense–Analyze–Act highlights autonomous therapeutic feedback, showcasing how advanced materials, adaptive electronics, and real-world applications converge to enable next-generation bioelectronic healthcare solutions. ABSTRACT Closed-loop bioelectronic systems sense physiological signals, compute adaptive therapeutic decisions, then deliver precisely timed interventions without human oversight, meeting a clinical need that fixed-schedule treatments cannot …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":163},{"title":"Continuous and Wireless Monitoring of Myocardial Dynamics Using Biocompatible Magneto‐Viscoelastic Patches","url":"https://doi.org/10.1002/adma.75549","doi":"10.1002/adma.75549","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Sunjin Lee","Sumin Kim","Jeongmin Yoo","Ji Hoo Kim","Eun Saem Kang","Eojin Lee"],"authorMore":true,"abstract":"ABSTRACT We report a machine learning (ML)‐augmented magnetic sensing system for real‐time, wireless monitoring of cardiac kinematics during recovery following surgery. While conventional monitoring focuses on electrical activity, it overlooks mechanical performance and pumping efficiency. To bridge this diagnostic gap, we developed a biocompatible magnetic particle matrix (MPM) patch incorporating biocompatible ferromagnetic α″‐Fe 16 N 2 microparticles. By integrating this patch onto the epicardium during surgery, our platform enables passive magnetic readout and analysis of epicardial motion without implanted electronics. The system utilizes an external magnetometer to sense 3D magnetic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":164},{"title":"Noninvasive Detection and Subtyping of Esophageal Cancer by Circulating Cell‐Free mtDNA Fragmentomics: A Multi‐Center Validation Study","url":"https://doi.org/10.1002/advs.78377","doi":"10.1002/advs.78377","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Yue Liu","Wenying Yang","Yu Li","Siyuan Wang","Xiang Li","Fan Peng"],"authorMore":true,"abstract":"ABSTRACT Esophageal cancer (EC) is highly lethal due to late diagnosis, and accurate non‐invasive tools for early detection and subtyping remain lacking. Circulating cell‐free mitochondrial DNA (ccf‐mtDNA) fragmentomics offers a promising biomarker source. In this large multi‐center study enrolling 1,260 participants spanning healthy control (HC), benign esophageal diseases (BED), precancerous lesions and EC patients, we developed two machine learning models based on plasma ccf‐mtDNA fragmentomic profiles: an EC detection (ED) model and a pathological subtyping prediction (PSP) model. The ED model achieved an AUC of 0.9706 (EC vs. non‐EC) in the training cohort, with high performance in …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":165},{"title":"Self‐Adaptive Gradient Interphase Enables Durable Solid‐State Lithium Metal Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79304?af=R","doi":"10.1002/adfm.79304","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Hongmin Liu","Rui Li","Yitao Lou","Xinran Gao","Min Xu","Shijian Wang","Nana Wang","Huakun Liu","Guoxiu Wang","Zhongchao Bai"],"authorMore":false,"abstract":"This work presents a machine learning-guided interfacial design that forms a self-adaptive graded interphase on lithium metal anode. A B 105 M 40 composite interlayer evolves into lithiophilic, porous, and fast-ion-conducting phases, enabling intimate contact, dendrite suppression, and uniform lithium deposition. The engineered interface delivers high critical current density and long-term cycling stability in symmetric and full cells. ABSTRACT Garnet-type solid-state electrolytes (SSEs) enable safe, high-energy solid-state lithium metal batteries (SSLMBs) but suffer from poor interfacial contact and lithium dendrite penetration. Here, we report a machine learning -guided interfacial …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":166},{"title":"Thermal Stability of High‐Entropy Oxide Thin Films: From Stability Mechanisms to Materials Design","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78257?af=R","doi":"10.1002/adfm.78257","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Xian Li","Jiali Yang","Ke Liu","Daoyun Zhu","Xin‐Gui Tang","Zhongfei Mu","Fugen Wu"],"authorMore":false,"abstract":"High-entropy oxide (HEO) thin films show strong potential in gas sensing, energy storage, catalysis, water splitting, memristive and neuromorphic devices, and optoelectronics. Their applications require phase and chemical stability at elevated temperatures. Thermodynamics-guided control of ionic-size mismatch, elemental volatility, and chemical bonding enables the design of thermally stable single-phase HEO films. ABSTRACT High-entropy oxide (HEO) thin films, as an important branch of high-entropy material systems, have shown broad application prospects in energy, catalysis, protective coatings, and other fields, owing to their unique compositional design strategy and potentially excellent …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":167},{"title":"A Curved Bimodal Hair Sensor for Airflow and Electrostatic Perception in Robotic Control","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78429?af=R","doi":"10.1002/adfm.78429","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"random forest","matchWhere":"摘要：random forest","score":2,"authors":[],"authorMore":false,"abstract":"Curvature-engineered bimodal hair sensing integrates airflow and electrostatic perception within a single flexible device (CBHS). Weak forces down to 10 −4 N are detected, six wind-speed levels are classified with 98.89% accuracy, and distinct temporal signatures separate stimulus types. Direct translation of sensory inputs into robotic behaviors highlights a low-complexity route toward multimodal artificial perception. ABSTRACT Noncontact environmental perception is crucial for autonomous alerting and behavior control in mobile robots, yet existing artificial sensory systems still fall short in integrating weak-stimulus detection, interaction-direction discrimination, and multimodal …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":168},{"title":"Bioengineered Interfaces for Peripheral Nerve Sensory Restoration","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74815?af=R","doi":"10.1002/adma.74815","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Sydney Swedick","Salim El Hadwe","Kesi Liang","George G. Malliaras","Damiano G. Barone"],"authorMore":false,"abstract":"Half of amputees abandon their prosthetics for lack of feeling. This review charts the full path from peripheral nerve injury to restored sensation, through surgical, regenerative, noninvasive, and implanted approaches, and shows how injury type and interface material properties determine which strategy can deliver naturalistic feedback, and why proprioception remains the hardest problem to solve. ABSTRACT Peripheral nerve injuries (PNIs) severely impair motor and sensory function, diminishing patient independence and quality of life. Despite decades of research, rehabilitation has prioritized motor recovery and residual function over the sensory restoration essential for embodiment, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":169},{"title":"Electrolyte Engineering Challenges and Opportunities for Next‐Generation Aqueous Ammonium‐Ion Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74782?af=R","doi":"10.1002/adma.74782","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Zi‐Hang Huang","Xiaoyu Liu","Shuai Mao","Lingfeng Zhu","Zhijun Wu","Hongge Pan","Tianyi Ma"],"authorMore":false,"abstract":"Aqueous ammonium-ion batteries (AAIBs) face a hydrogen-bond paradox: the HB network enables fast NH 4 + transport but triggers water decomposition. This review dissects this dilemma, evaluates multiple electrolyte engineering strategies, and outlines four future directions for next-generation AAIB design ABSTRACT Aqueous ammonium-ion batteries (AAIBs) have emerged as a promising post-lithium energy-storage technology, combining intrinsic safety with sustainable viability. However, unlike other aqueous-ion batteries, the engineering of AAIB electrolytes confronts a fundamental dilemma: their unique hydrogen-bond (HB)-rich environment, which enabling ultrafast NH 4 + transport, concurrently …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":170},{"title":"A Textile‐Based, Battery‐Free, Electrochromic Platform for Visual Epidermal Sweat Biosensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74878?af=R","doi":"10.1002/adma.74878","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":[],"authorMore":false,"abstract":"Sweat-powered wearable biosensing is realized by coupling a flexible textile generator, power-management unit, enzymatic glucose sensor, and electrochromic display within a shared sweat-electrolyte architecture. The platform converts perspiration into both power and analytical information, enabling battery-free visual readout and image-assisted glucose prediction for integrated on-body sensing. ABSTRACT Noninvasive wearable sweat sensors are promising for personalized health management, yet their widespread adoption is hindered by complex multi-component architectures, reliance on rigid batteries, and a lack of intuitive visual feedback. Herein, we propose a sweat-powered …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":171},{"title":"Bio‐Inspired Janus All‐Nanofiber Self‐Powered Electronic Skins for Multifunctional, High‐Resolution, Artifact‐Free Human–Machine Interface","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74900?af=R","doi":"10.1002/adma.74900","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Kefan Fan","Kun Li","Liuwenlin Han","Yimin Wang","Feng Gao","Jue Cheng","Junying Zhang"],"authorMore":false,"abstract":"A heterogeneous Janus micro-/nanofibrous e-skin enabled by gel-fiber-mediated interlayer adhesio
