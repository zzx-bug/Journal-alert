other","id":45},{"title":"A Pressure‐Tolerant Composite Hydrogel for Wide‐Range, High‐Sensitivity Dual‐Mode Piezoresistive‐Piezoionic Pressure Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78839?af=R","doi":"10.1002/adfm.78839","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"标题：piezoresistive","score":9,"authors":["Wen Li","Fang Wang","Jiaqi Liu","Yimao Wu","Ruolin Zhai"],"authorMore":false,"abstract":"A multifunctional interpenetrating polymer network hydrogel is developed via room-temperature redox-initiated polymerization and dynamic imine crosslinking. Synergistic hydrogen bonding and metal-ligand coordination enable high compressive strength, self-healing, strong adhesion, anti-freezing stability, and dual-mode piezoresistive/piezoionic sensing. Real-time handwriting recognition, secure Morse code transmission, and high-resolution spatial mapping are demonstrated. ABSTRACT Single-mechanism hydrogel sensors struggle to simultaneously recognize static/dynamic pressure, map spatial patterns, and decode complex signals, while integrating dual-mode (e.g., piezoresistive/piezoionic) …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-13","tkey":"other","id":46},{"title":"Bubble Engineering for Controlled Thermal Transport and Piezoresistive Sensing in Anti‐Icing Surfaces","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78865?af=R","doi":"10.1002/adfm.78865","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"标题：piezoresistive","score":9,"authors":["Jiangpeng Qu","Yujun Liu","Junqin Ma","Jiahao Yang","Jing Zhao","Jiliang Mo"],"authorMore":true,"abstract":"Spatially engineered bubbles reconstruct heat-transfer pathways in a soft composite film, balancing through-thickness thermal insulation with lateral heat spreading. This architecture retains heat near the functional surface and enables effective anti-icing and rapid de-icing under photothermal or electrothermal heating, while the integrated conductive network provides mechanical sensing capability for multifunctional ice-resistant surfaces. ABSTRACT Efficient anti-icing in extreme environments is fundamentally limited by rapid heat dissipation through continuous heat-transfer pathways, which hinders stable thermal confinement at functional surfaces. Here, we report a strategy to regulate …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-13","tkey":"other","id":47},{"title":"A Sequential Photothermal‐Piezoelectric GBR Membrane for Cascading Anti‐Infection and Bone Regeneration in Periodontal Defects","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78427?af=R","doi":"10.1002/adfm.78427","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Li Ren","Mingkun Chen","Yaling Lu","Guodong Zhao","Luxuan Shen","Ao Gao"],"authorMore":true,"abstract":"A PLLA/AgPBT electrospun membrane enables sequential therapy for infected bone defects: rapid NIR photothermal heating achieves \u003e 99% bactericidal activity, followed by ultrasound-induced piezoelectric output for sustained bacterial inhibition and M1→M2 macrophage polarization, while promoting osteogenesis and acting as a barrier, ultimately enhancing new bone formation in rats. ABSTRACT The effective regeneration of infectious periodontal bone defects remains challenging, as current commercial guided bone regeneration (GBR) membranes offer only passive barrier function. Here, we report an electrospun, multifunctional GBR membrane engineered for active therapy. Composed of poly (L-lactic …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-12","tkey":"other","id":48},{"title":"Gradient‐Integrated High‐Strength and High‐Toughness Cellulose Triboelectric Materials for Enhanced Charge Storage and Transport","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78778?af=R","doi":"10.1002/advs.78778","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-10","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":["Pinle Zhang","Yanhao Xu","Huancheng Huang","Neng Xiong","Xinke Yu","Xinyue Nong"],"authorMore":false,"abstract":"Inspired by the gradient structure of sea urchin spines, a gradient-integrated cellulose/multi-walled carbon nanotube (MWCNT) triboelectric material is constructed. A compatible interface and built-in electric field synergistically suppress charge dissipation, achieving 20.5 nC cm −2 surface charge density, 8044-cycle stability, 126.33 MPa tensile strength, and 9.11 MJ m −3 toughness, providing a foundation for interfacial design in green self-powered wearable electronics. ABSTRACT The rapid advancement of wearable electronics places ever-increasing demands on the electrical and mechanical properties of materials. Cellulose offers renewability, low cost, and high durability for green …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-12","tkey":"other","id":49},{"title":"An Iontronic Bimodal Afferent Nerve for Cross‐Modal Neuromorphic Fusion and Robotic Sorting","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78621?af=R","doi":"10.1002/advs.78621","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-10","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"标题：iontronic","score":9,"authors":["Mengkang Deng","Wenxin Cao","Xinci Gong","Jiangdong Gong","Hang Xu","Wenjing Wang"],"authorMore":false,"abstract":"A flexible iontronic pressure–temperature sensor is integrated with pulse encoding and a multi-gate SnO₂ nanowire synaptic transistor to create a near-sensor neuromorphic platform. Pressure and temperature cues are encoded, temporally integrated, and fused for accurate multimodal object recognition and robotic sorting, establishing a compact pathway from tactile sensing to neuromorphic perception and embodied intelligent action. ABSTRACT Inspired by the multisensory perception and fusion strategy of the biological tactile system, we present a bimodal iontronic afferent nerve that integrates a flexible pressure–temperature sensor patch, pulse-encoding electronics, an electrolyte-gated …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-12","tkey":"other","id":50},{"title":"Negative Gauge Factor Piezoresistance in Soft Strain and Pressure Sensors: Mechanisms, Materials, and Emerging Applications","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78571?af=R","doi":"10.1002/advs.78571","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-10","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensors","matchWhere":"标题：pressure sensors","score":9,"authors":["Su‐Hyeong Lee","Minjae Kim","Soosang Chae"],"authorMore":false,"abstract":"Negative-gauge-factor materials reverse the usual rule of piezoresistive sensing: their resistance falls, rather than rises, under deformation. This review organizes such behavior into four mechanistic classes spanning intrinsic semiconductors, composites, conducting polymers, and engineered architectures. The unifying theme is that strain activates conduction, opening a path toward switch-type, event-triggered sensors that consume almost no standby power. ABSTRACT Soft strain and pressure sensors underpin wearable electronics, soft robotics, and human-centered healthcare, yet most piezoresistive devices rely on a positive gauge factor (pGF), in which resistance increases as deformation …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-12","tkey":"other","id":51},{"title":"Poisson's Ratio‐Driven Control of Myogenic Differentiation and Maturation in Auxetic Metamaterials under Dynamic Mechanical Stimulation","url":"https://doi.org/10.1002/adfm.79363","doi":"10.1002/adfm.79363","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"auxetic","matchWhere":"标题：auxetic","score":9,"authors":["Maria Kalogeropoulou","Prabhdeep Kaur","Monica Boffito","Pierpaolo Fucile","Gianluca Ciardelli","Lorenzo Moroni"],"authorMore":false,"abstract":"ABSTRACT Skeletal muscle regeneration requires scaffolds that accommodate the remarkable mechanical heterogeneity of different muscle types while supporting tissue development. Auxetic metamaterials—structures with negative Poisson's ratio that expand laterally when stretched—offer superior mechanical properties including enhanced energy absorption and high yield strain capacity. However, their effects on muscle differentiation under dynamic loading remain unexplored. This study systematically investigated how Poisson's ratio influences skeletal muscle development by designing, fabricating, and mechanically characterizing nine auxetic geometries via melt extrusion printing with a …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-11","tkey":"other","id":52},{"title":"Upcycling Piezoelectric Single‐Crystal Debris Into High‐Performance Flexible 0–3 Composites","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75650?af=R","doi":"10.1002/adma.75650","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-09","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Hyunhee Kwon","Yong Jun Choi","Yunseok Kim","Ho‐Yong Lee","Miso Kim"],"authorMore":false,"abstract":"Industrial PMN–PT single-crystal debris is upcycled into high-performance flexible 0–3 piezoelectric composites through controlled particle refinement and dielectrophoresis (DEP)-assisted curing. Vertically connected quasi-1–3-like particle networks embedded in a compliant PDMS matrix enable efficient stress transfer, high piezoelectric response, and mechanical flexibility. The optimized composite achieves d 33 = 118.5 pC N −1, positioning it among the highest-performing flexible 0–3 piezoelectric composites. ABSTRACT High-value piezoelectric single-crystal debris remains an untapped resource for flexible electromechanical materials. Although relaxor-based ferroelectric single crystals …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-11","tkey":"other","id":53},{"title":"Programmable Sequential 4D Actuation in Multistable Kirigami Metamaterials (Adv. Sci. 62/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78407?af=R","doi":"10.1002/advs.78407","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"multistable","matchWhere":"标题：multistable","score":9,"authors":["Eui‐Hyun Kim","Minsung Kim","Hyunsik Yoon","Keun Park"],"authorMore":false,"abstract":"Multistable 4D Kirigami Metamaterials Inspired by the geometric motifs of traditional Korean Dancheong patterns, the cover image reimagines the decorated façade of a Korean temple using the multistable kirigami metamaterials developed in this work. Upon exposure to sunlight, the kirigami panels on the illuminated side undergo a thermally triggered 4D transformation, forming an outward-curved surface that visualizes the thermally programmed bridging mechanism demonstrated in the study. The image bridges traditional architectural aesthetics with programmable 4D-printed metamaterials, highlighting their potential for thermally responsive and adaptive structures. Further details can be found in …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-11","tkey":"other","id":54},{"title":"Analog Synaptic Plasticity in 2D Layered Material Iontronic Memtransistors for Brain‐Inspired Computing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77150?af=R","doi":"10.1002/advs.77150","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"标题：iontronic","score":9,"authors":["Puranjay Saha","Saptarshi Bej","Bikas C. Das"],"authorMore":false,"abstract":"In this work, we demonstrated a robust 2D MoS 2 based iontronic memtransistor of planar architecture operated under the influence of an electrical double layer with versatile performance and applications, including pinched hysteresis nature of transfer curve, analogue channel conductance tuning, low-voltage operation, logic-gate operation, classical conditioning of the brain, and various synaptic and neural behaviors. ABSTRACT A simple iontronic memtransistor capable of emulating synaptic plasticity and cognitive functions showcases high performance and low energy consumption, fostering admiration for its efficiency. Here, we report the versatile, high-performance memtransistor behavior of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-11","tkey":"other","id":55},{"title":"Programmable Sequential 4D Actuation in Multistable Kirigami Metamaterials","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77412?af=R","doi":"10.1002/advs.77412","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"multistable","matchWhere":"标题：multistable","score":9,"authors":["Eui‐Hyun Kim","Minsung Kim","Hyunsik Yoon","Keun Park"],"authorMore":false,"abstract":"This study presents a modular kirigami metamaterial framework enabling programmable multistability and sequential 4D actuation. By coupling geometry-controlled multistability with material-dependent recovery kinetics, spatiotemporal deformation can be precisely programmed. The approach is validated through three functional mechanisms: multimodal transformations, multistable 4D grippers, and a biomimetic underwater cleaning robot, establishing a scalable strategy for electronics-free actuation in adaptive soft mechanisms. ABSTRACT Programmable shape transformation is essential for adaptive soft mechanisms operating in constrained or dynamic environments. This study presents a modular …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-11","tkey":"other","id":56},{"title":"Wireless Electrical Stimulation via Piezoelectric Nanogenerator for Parkinson's Disease Therapy Through Activating Calcium Channels and Mitigating Oxidative Damage","url":"https://doi.org/10.1002/adfm.79517","doi":"10.1002/adfm.79517","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-07","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Xueyao Li","Jiahui Fan","Xinyue Shao","Xiaoling Zhao","Yuling Li","Hailong An"],"authorMore":true,"abstract":"ABSTRACT The primary pathological hallmarks of Parkinson's disease (PD) comprise the loss of dopaminergic neurons in the substantia nigra and abnormal accumulation of α‐synuclein, accompanied by severe oxidative damage due to excessive reactive oxygen species (ROS). Clinical electrical stimulation therapies pose invasive risks from long‐term electrode implantation with neuroinflammation side effects, while antioxidant drugs for scavenging brain ROS also fail to meet clinical demands due to poor blood–brain barrier permeability and short half‐lives. Herein, we report a brain‐targeted piezoelectric nanogenerator (PEL) for wireless electrotherapy for PD. Under ultrasonic stimulation, the …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":57},{"title":"Skin‐Matched Ferroelectric Triboelectric Interfaces for Self‐Powered Human‐Machine Interactions Under Ultralow Force","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79533?af=R","doi":"10.1002/adfm.79533","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-06","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":["Jihun Son","Minwoo Song","Won Jae Kim","Jaeha Park","Minjin Kim","Gui Won Hwang"],"authorMore":false,"abstract":"A ferroelectric porous triboelectric interface enables an intrinsically stretchable, skin-matched self-powered HMI that operates under ultralow preload while maintaining stable performance under large deformation and underwater conditions. Integrated with a breathable bioadhesive interface and an orthogonal wrinkle electrode, the platform supports conformal biomechanical sensing and energy harvesting, offering a robust strategy for next-generation skin-attachable self-powered interfaces. ABSTRACT Triboelectric nanogenerators (TENGs) have emerged as promising power sources for self-powered human-machine interfaces (HMIs). However, self-powered sensing interfacing with the human body requires …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":58},{"title":"Uniting Ferroelectricity, Piezoelectricity, and Axial Negative Thermal Expansion in Single‐Component Organic Materials Enables High‐Performance Memristor and Energy‐Harvesting Nanogenerators (Adv. Mater. 62/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75510?af=R","doi":"10.1002/adma.75510","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectricity","matchWhere":"标题：piezoelectricity","score":9,"authors":[],"authorMore":false,"abstract":"Memory- and Energy-Harvesting Organic Materials for High-Precision Nanoelectronics The unprecedented coexistence of ferroelectricity, piezoelectricity, and negative thermal expansion in single-component, purely organic materials yields multifunctional properties, enabling high-performance memristors and energy-harvesting nanogenerators for wearable high-precision nanoelectronics and neuromorphic computing. More details can be found in the Research Article by Ramamoorthy Boomishankar, Parthapratim Munshi, and co-workers (DOI: 10.1002/adma.74984).","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":59},{"title":"Powering Skin Repair: Piezoelectric Biomaterials‐Driven Wound Healing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74903?af=R","doi":"10.1002/adma.74903","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Rahul V. Gopi","Rubina Qaiser","Unnikrishnan P S.","Ziona Somy","Zara Amrin","Mehmet R. Dokmeci","Johnson V. John"],"authorMore":false,"abstract":"We comprehensively review the structure–function relationships and therapeutic mechanisms of piezoelectric biomaterials in wound healing, with particular emphasis on their ability to convert mechanical stimulation into localized electrical signals. The interactions among material properties, piezoelectric responses, and biological processes including antibacterial activity, immunomodulation, angiogenesis, cell migration, and tissue remodeling are systematically discussed, while current challenges and future directions for translating piezoelectric biomaterials toward effective wound therapies are also addressed. ABSTRACT Over the past decade, piezoelectric biomaterials have emerged as …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":60},{"title":"Uniting Ferroelectricity, Piezoelectricity, and Axial Negative Thermal Expansion in Single‐Component Organic Materials Enables High‐Performance Memristor and Energy‐Harvesting Nanogenerators","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74984?af=R","doi":"10.1002/adma.74984","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectricity","matchWhere":"标题：piezoelectricity","score":9,"authors":[],"authorMore":false,"abstract":"A symmetry-breaking design strategy transforms centrosymmetric para-halogenated indolines into polar, multifunctional organic materials through controlled oxidation and rearrangement reactions. By integrating ferroelectricity, piezoelectricity, and negative thermal expansion (NTE) into a single-component framework, the isostructural materials enable high-performance memristor and energy-harvesting nanogenerators. This work bridges molecular design and device engineering, offering a promising blueprint for next-generation wearable nanoelectronics and neuromorphic computing. ABSTRACT The development of ferroelectric materials is fundamentally constrained by the stringent requirement for …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":61},{"title":"Piezoelectric Hydrogel Membranes Enabling Hydraulically Self‐Regulated Active‐Passive Antifouling for Oil‐Water Separation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78724?af=R","doi":"10.1002/adfm.78724","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Dafan Chen","Jingxue Wang","Mutai Bao","Zhining Wang","Wenjun Zhang","Shideng Yuan"],"authorMore":false,"abstract":"A novel active-passive antifouling membrane system integrating hydrogel and piezoelectric components is developed for sustainable, energy-efficient fouling mitigation during oily wastewater treatment. Harnessing the intrinsic pulsed hydraulic pressure in the filtration process to trigger the piezoelectric effect, the system generates a dynamically coupled electrostatic-dielectrophoretic force field, enabling the simultaneous active desorption of surfactants and oil droplets from membrane pores. ABSTRACT Membrane fouling caused by the diffusion and adsorption of oil droplets during oil-water separation severely hinders the long-term operation of membrane modules, highlighting the imperative …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":62},{"title":"Ultrasound‐Responsive Extracellular Vesicle‐Encapsulated Piezoelectric Nanoparticles for Chronic Inflammatory Pain Suppression","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78737?af=R","doi":"10.1002/adfm.78737","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Yu Wang","Shu‐Fan Li","Juan Ma","Siwei Zhang","Fengling Liu","Yi Su"],"authorMore":false,"abstract":"Extracellular vesicle-engineered UIONF piezoelectric nanoparticles enhance their stability in the brain and cellular uptake, enabling nuclear localization of piezoelectric nanomaterials and providing a new strategy for ultrasound-triggered localized bioelectrical regulation. Ultrasound-activated UIONF@EVs alleviate chronic inflammatory pain by suppressing astrocyte activation and the NF-κB signaling pathway. ABSTRACT Chronic inflammatory pain is characterized by the long-term coexistence of central sensitization and neuroinflammation. Electrical stimulation has been demonstrated to be an effective strategy for alleviating chronic inflammatory pain. However, implanted electrodes have limited …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":63},{"title":"Architected Bio‐Based Iontronic Skin With Dual‐Mode Pressure and Strain Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79432?af=R","doi":"10.1002/adfm.79432","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"标题：iontronic","score":9,"authors":["Maksims Jurinovs","Madara Veseta","Fevzihan Basarir","Beatrise Silava","Eduards Bakis","Krisjanis Smits"],"authorMore":false,"abstract":"Bio-based acrylates in combination with an ionic liquid create 3D-printed ionogels with compositionally tuneable mechanics and ionic conductivity. Gyroid architectures amplify low-pressure sensitivity while preserving robust strain sensing, enabling dual-mode detection of pressure and deformation. The study links sustainable chemistry with architected design to establish a versatile platform for responsive iontronic skins. ABSTRACT Human skin encodes pressure and stretch through the motion of ions, a principle soft iontronics reproduce but rarely on sustainable terms. Additive manufacturing has lifted ionogels from cast slabs into architected sensors, yet this progress rests on …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-06","tkey":"other","id":64},{"title":"Piezoelectric Amino Acid Salts with Halogen‐Based Coformers Produce Exceptional Force‐Generated Voltage Output","url":"https://doi.org/10.1002/advs.78588","doi":"10.1002/advs.78588","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-05","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Krishna Hari","Shubham Vishnoi","Sarah Guerin"],"authorMore":false,"abstract":"ABSTRACT Hierarchical self‐assemblies of bio‐inspired materials combine structural tunability with biocompatibility and environmental sustainability for multifunctional applications. Within this area of applied research, minimalistic building units such as amino acids and their derivatives have evolved as next‐generation piezoelectric materials. Their tendency towards chiral nature, polar molecular structure, asymmetric crystal packing, and designability enable efficient linear voltage generation under mechanical stress, yet their technological translation is at formative stages. Amino acid‐based multicomponent crystals (MCC s) are an emerging class of sustainable piezoelectrics, which …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-06","tkey":"other","id":65},{"title":"Bioinspired Microcone‐Array‐Based Eutectogel Triboelectric Nanogenerator for Self‐Powered Dual‐Modal Sensing and Human‐Machine Interfaces","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79491?af=R","doi":"10.1002/adfm.79491","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-04","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":["Binyao Zhang","Shenghao Di","Zijin Yan","Guang Chen","Yi Ding","Weizhong Yuan"],"authorMore":false,"abstract":"Boinspired M-TENG is constructed utilizing the NAP eutectogel as the back electrode. The eutectogel monitors human movements and electrophysiological signals, while the M-TENG enables self-powered, dual-modal motion monitoring. Additionally, a flexible touch panel is integrated to form a secure human-machine interface, facilitating the password-authenticated remote control of a hexapod robot, demonstrating its potential for complex unmanned search-and-rescue operations. ABSTRACT Flexible wearable sensors currently face challenges in terms of self-powering and human-machine interaction (HMI) capabilities. In order to cope with these challenges, through the utilization of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-06","tkey":"other","id":66},{"title":"Detection of Degraded Formulated BaTiO3 Induced by Oxygen Vacancy Migration Using Ultrasonic Attenuation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77083?af=R","doi":"10.1002/advs.77083","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Haley N. Jones","Clive A. Randall","Andrea P. Argüelles","Susan Trolier‐McKinstry"],"authorMore":false,"abstract":"Oxygen vacancy migration is a key degradation mechanism for the majority of MLCCs. There are limitations with spatially identifying regions of a capacitor that have degraded due to oxygen vacancy migration. This work showcases ultrasonic attenuation as a non-electrical and nondestructive technique of identifying oxygen vacancy degraded regions of an MLCC. ABSTRACT Insulation resistance degradation caused by electromigration of oxygen vacancies under DC bias is a common mechanism that limits lifetime in multilayer ceramic capacitors (MLCCs). This work explores the use of high frequency ultrasound (100 MHz) as a non-electrical, nondestructive characterization tool to spatially identify …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"other","id":67},{"title":"Piezoelectric Field‐Derived Mechano–Electrochemical Regulation for Durable SiO Anode","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74988?af=R","doi":"10.1002/adma.74988","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Qian Zhang","Chuang Sun","Kaiwen Yu","Tianpin Wu","Mengting Zheng","Junxiu Wu"],"authorMore":true,"abstract":"Piezoelectric LiTaO₃ converts the intrinsic expansion stress of SiO into localized electric fields, dynamically regulating Li + transport and homogenizing interfacial reactions. Coupled with a mechanically robust CNT framework, this mechano–electrochemical strategy stabilizes the electrode structure and interphase, enabling durable SiO anodes and providing a stress-responsive paradigm for high-energy lithium-ion batteries. ABSTRACT Silicon monoxide (SiO) has emerged as a promising high-capacity anode material for next-generation lithium-ion batteries. Nevertheless, the practical application of SiO anodes remains hindered by sluggish Li + ion transport kinetics and persistent mechanical …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":68},{"title":"Dielectrophoretic Assembly of BaTiO3 Radiative Cooling Textiles for Proactive Urban Cooling","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75018?af=R","doi":"10.1002/adma.75018","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Maoquan Zhang","Xuwang Tian","Chenhao Ding","Jiawei Wu","Zheng Yang","Weiyan Zhu"],"authorMore":true,"abstract":"A dielectrophoretic assembly strategy creates a BaTiO₃ surface-mineralized fibrous textile with semi-exposed nanoparticle architecture for enhanced Mie scattering and mechanical flexibility. This scalable and flexible textile achieves 96.78% solar reflectance, 110.1 W/m 2 net cooling power, and ∼20°C surface temperature reduction. Weather Research and Forecasting (WRF) simulations further indicate its potential to reverse urban heat island (UHI) circulation under large-scale deployment. ABSTRACT The urban heat island (UHI) effect threatens sustainable urban development. Passive daytime radiative cooling textiles are promising but face a trade-off between optical performance and …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":69},{"title":"Efficient Dynamic Piezo‐Photocatalysis of Freestanding Single‐Crystal BaTiO3 Membranes by Strain Gradient","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75029?af=R","doi":"10.1002/adma.75029","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Qian Yang","Guohua Dong","Na Dong","Guannan Yang","Zhengwei Tao","Zeqiong Wang"],"authorMore":true,"abstract":"Freestanding single-crystal BaTiO₃ membranes convert cavitation-induced flexural deformation into dynamic strain gradients and enhanced piezoelectric polarization. The resulting electric field promotes photogenerated-carrier separation and interfacial redox reactions. The (110)-oriented membrane exhibits 1.88 times the ultrasonic degradation activity of its substrate-clamped counterpart and removes 90.25% of tetracycline under combined ultrasound and ultraviolet irradiation. ABSTRACT Piezocatalysis, capable of direct mechanical-to-chemical energy conversion, emerges as a promising strategy to address the global challenge of antibiotic pollution. Herein, freestanding single-crystal BaTiO₃ …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":70},{"title":"Photon–Phonon Co‐Driven Ammonia Synthesis Over Ru/BaTiO3 Under Very Mild Conditions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75041?af=R","doi":"10.1002/adma.75041","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Linlin Hou","Ying Liu","Hongjie Cui","Ziying Qin","Muyao Liu","Lunqiao Xiong"],"authorMore":true,"abstract":"Photon-generated electrons dynamically enrich Ru sites on BaTiO₃, suppressing excessive hydrogen coverage while promoting N 2 adsorption and dissociation. Coupled photon and phonon enables efficient ammonia synthesis under mild conditions, delivering 746.6 mmol g Ru −1 h −1 at 350 °C under ambient pressure and 2269 mmol g Ru −1 h −1 under 2 MPa. ABSTRACT Ammonia, as an emerging energy carrier, holds significant strategic importance in the transition of future energy systems. Although the Haber-Bosch process remains the dominant industrial route for ammonia synthesis, its high energy demand and substantial carbon emissions underscore the urgent need for sustainable alternatives. Herein, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":71},{"title":"Hierarchically Aligned Core–Shell Yarn‐Shaped Triboelectric Yarns With Coupled High‐Density Charge Trapping and Efficient Transport","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78604?af=R","doi":"10.1002/adfm.78604","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":[],"authorMore":false,"abstract":"An aligned side-by-side triboelectric yarn is developed via one-step conjugate electrospinning. Its unique hierarchical structure creates a fivefold increase in deep trap density, effectively suppressing charge leakage and significantly boosting surface potential. This design delivers an exceptional output for energy harvesting and self-powered sensing, offering a transformative paradigm for wearable electronics. ABSTRACT Yarn-shaped triboelectric materials (Y-TENGs) hold great promise for high-performance wearable electronics, but conventional designs suffer from low charge density due to limited internal macro- and microscale structures. Here, an aligned side-by-side triboelectric yarn …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-03","tkey":"other","id":72},{"title":"Application of integrated epoxy electrically insulated piezoresistive carbon fiber sensors in strain sensing of CFRP structures","url":"https://doi.org/10.1016/j.compstruct.2026.121032","doi":"10.1016/j.compstruct.2026.121032","journal":"Composite Structures","jabbr":"Composite Structures","pubdate":"2026-11-01","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"标题：piezoresistive","score":9,"authors":["Maximilian Korff","Tobias Dickhut"],"authorMore":false,"abstract":"","tier": nanohybrid suppresses photocarrier recombination via the piezoelectric built-in electric field. Together with the constructed Mn─O─Sm covalent bridge that reduces interfacial barriers and forms an S-scheme heterojunction, these effects jointly boost mechano-driven photocatalytic H 2 evolution for sustainable water-splitting energy conversion. ABSTRACT Suppressing the recombination of photogenerated electrons and holes to achieve highly efficient energy conversion in an environmentally benign manner represents a pivotal challenge in green chemistry. In this work, we report on a novel composite that combines 2D piezoelectric Na─Sm co-doped CaBi 2 Nb …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":79},{"title":"Double‐Pendulum Bearing‐Joint Triboelectric Nanogenerator for Efficient Low‐Frequency Ocean Wave Energy Harvesting","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78314?af=R","doi":"10.1002/adfm.78314","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":["Zihua Wang","Shiyuan Chang","Boyuan Yao","Zhanqi Liu","Qinghe Wu","Weihua Han","Zhanyong Hong","Zhong Lin Wang"],"authorMore":false,"abstract":"Inspired by bearings, a new type of Triboelectric Nanogenerators was used as joints and mounted on double pendulums in this research. By integrating device into the buoy, this device is expected to provide power for monitoring nodes of the Marine Internet of Things, which will provide a reference for the realization of self-powered systems. ABSTRACT Marine Internet of Things (IoT) systems require reliable self-powered sensor nodes for long-term ocean monitoring. Triboelectric nanogenerators (TENGs) provide a promising solution for harvesting irregular ocean wave energy, but the low frequency, small amplitude, and randomness of ocean waves significantly limit the performance of conventional …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":80},{"title":"Molecularly Engineered Nitrate Double Perovskites with Elevated Ferroelectric Phase Transition Temperature and Large Piezoelectric Response","url":"https://doi.org/10.1002/advs.78404","doi":"10.1002/advs.78404","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Le Ye","Guang‐Yuan Hu","Yarou Duan","Yutong Lin","Ding‐Chong Han","Zi‐Luo Fang"],"authorMore":true,"abstract":"ABSTRACT Conventional ABX 3 perovskites place organic species at A ‐sites or as X ‐site linkers, where the B ‐site is reserved for metals. Molecular double perovskites with a general formula A 2 B I B III X 6 possess higher tunability and distinct B I ‐sites that can accommodate small cations, further regulating lattice connectivity and physical properties. Here, we introduce a new family of B I ‐site‐organic nitrate double perovskites, (RM3HQ) 2 B I Eu(NO₃) 6 (RM3HQ = (R)‐ N ‐methyl‐3‐hydroxyquinuclidinium), forming compounds 1 – 4 with B I = ammonium, methylammonium, formamidinium, and dimethylammonium, respectively. Compounds 1 and 2 adopt mixed corner‐/face‐sharing non‐perovskite …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":81},{"title":"Modulation of Surface‐Associated Transport in (Bi1‐xSbx)2Te3 via Battery‐ Inspired Solid‐State Iontronic Gating","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79295?af=R","doi":"10.1002/adfm.79295","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-25","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"标题：iontronic","score":9,"authors":["Gabriel Vinicius de Oliveira Silva","Reza Asadi","He Ren","Rabiul Islam","Jagadeesh Moodera","Guo‐Xing Miao"],"authorMore":false,"abstract":"Iontronic gating in a battery-inspired device modulates the relative weight of surface-associated and bulk-like transport fingerprints in (Bi 1-x Sb x) 2 Te 3, resulting in phenomenological valve-like transport behavior. The strongest WAL-associated coherent transport signatures emerge near the transport-defined carrier compensation regime at ultra-low gate voltages (ABSTRACT Topological insulators (TIs) possess unique topological surface states (TSS) with strong spin-momentum locking. This leads to a large net surface spin accumulation when a surface charge current flows, thereby efficiently exerting a strong spin-orbit torque (SOT) on an adjacent ferromagnet. However, the effectiveness …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":82},{"title":"Thermally Robust Piezoelectric KNN/Polyimide Separator for Regulating Lithium Deposition in Lithium Metal Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79294?af=R","doi":"10.1002/adfm.79294","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-25","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Shumin Lin","Qiang Zhou","Shuang Luo","Dan Zhong","Bo Peng","Zhouqishuo Cai","Jie Bai","Hao Xue","Hua Bai"],"authorMore":false,"abstract":"An electrospun KNN/polyimide separator introduces oriented piezoelectric polarization into lithium metal batteries. During plating, local pressure from nascent lithium protrusions triggers electrostatic feedback that redirects Li + migration away from hotspots, promotes uniform deposition, and preserves separator integrity under heat, providing a promising strategy for improving the cycling durability and safety of lithium metal batteries without relying on passive blocking alone. ABSTRACT Lithium-metal batteries offer exceptionally high theoretical energy density but are hindered by dendrite-induced short circuits and the limited thermal stability of conventional separators. Here, we …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":83},{"title":"A Biodegradable and Tough Piezoelectric Silk Fibroin Fiber","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77698?af=R","doi":"10.1002/adfm.77698","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":[],"authorMore":false,"abstract":"Dynamic salting-out-assisted microfluidic spinning yields biodegradable silk fibroin fibers with high toughness, molecular orientation, and enhanced piezoelectricity. The resulting fiber-based devices enable stable electromechanical conversion and in vivo monitoring of respiration, muscle activity, and ultrasound-driven energy harvesting, highlighting a promising platform for bioresorbable piezoelectric sensing. ABSTRACT Biodegradable piezoelectric implants are optimal platforms for transient biosensing and therapeutics. However, limited piezoelectric properties and toughness impede the deployment of biodegradable piezoelectric implants in dynamic tissues and organs. In this study, we have …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":84},{"title":"Dynamic Piezoelectric Polarization Directs Reaction Pathways in CO2 Reduction Over Pt/Cu2O@BaTiO3 Dual‐Site Heterostructures","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78402?af=R","doi":"10.1002/adfm.78402","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Chunlai Dong","Xiuli Zhang","Yi Wang","Feng Ru Fan"],"authorMore":false,"abstract":"Dynamic piezoelectric polarizati
