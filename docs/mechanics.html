enabling irreversible bending and the fusion of two nanofiber monolayers deposited on opposite sides of the frame. ABSTRACT The device integration of nanofiber architectures is limited by weak interfacial adhesion and inefficient load transfer at nanofiber–substrate interfaces, leading to poor mechanical robustness and restricted processing compatibility. Here, we report a nanoembossing strategy that enables the interfacial embedding of electrospun nanofibers into lithographically … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"must_read","tierLabel":"必读","reportDate":"2026-10-23","tkey":"other","id":11},{"title":"Bending‐Stable Pressure Sensor Based on Natural Wood Nanofibers for Ultra‐Low Detection Limit","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76900?af=R","doi":"10.1002/advs.76900","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、标题：pressure sensor","score":11,"authors":["Xu Zeng","Zhengnan Sun","Yilin Wang","Yao Tan","Ranran Xu","Beomjoon Kim"],"authorMore":true,"abstract":"A wood nanofiber-based flexible pressure sensor with intrinsic bending-stable performance is developed through a porous electrospun architecture and interdigital electrode design. The device exhibits an ultra-low detection limit and stable operation under deformation for physiological monitoring and spatial sensing, providing a sustainable strategy for next-generation wearable electronic skins. ABSTRACT Flexible pressure sensors, essential for intelligent electronic skins, are valued for their versatility and integration. However, the inherent coupling between the pressure and bending strain effects limits their sensing features atop curved surfaces and hinders ultralow detection …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":12},{"title":"Molecularly Engineered Nitrate Double Perovskites with Elevated Ferroelectric Phase Transition Temperature and Large Piezoelectric Response","url":"https://doi.org/10.1002/advs.78404","doi":"10.1002/advs.78404","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Le Ye","Guang‐Yuan Hu","Yarou Duan","Yutong Lin","Ding‐Chong Han","Zi‐Luo Fang"],"authorMore":true,"abstract":"ABSTRACT Conventional ABX 3 perovskites place organic species at A ‐sites or as X ‐site linkers, where the B ‐site is reserved for metals. Molecular double perovskites with a general formula A 2 B I B III X 6 possess higher tunability and distinct B I ‐sites that can accommodate small cations, further regulating lattice connectivity and physical properties. Here, we introduce a new family of B I ‐site‐organic nitrate double perovskites, (RM3HQ) 2 B I Eu(NO₃) 6 (RM3HQ = (R)‐ N ‐methyl‐3‐hydroxyquinuclidinium), forming compounds 1 – 4 with B I = ammonium, methylammonium, formamidinium, and dimethylammonium, respectively. Compounds 1 and 2 adopt mixed corner‐/face‐sharing non‐perovskite …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":13},{"title":"Modulation of Surface‐Associated Transport in (Bi1‐xSbx)2Te3 via Battery‐ Inspired Solid‐State Iontronic Gating","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79295?af=R","doi":"10.1002/adfm.79295","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-25","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"标题：iontronic","score":9,"authors":["Gabriel Vinicius de Oliveira Silva","Reza Asadi","He Ren","Rabiul Islam","Jagadeesh Moodera","Guo‐Xing Miao"],"authorMore":false,"abstract":"Iontronic gating in a battery-inspired device modulates the relative weight of surface-associated and bulk-like transport fingerprints in (Bi 1-x Sb x) 2 Te 3, resulting in phenomenological valve-like transport behavior. The strongest WAL-associated coherent transport signatures emerge near the transport-defined carrier compensation regime at ultra-low gate voltages (ABSTRACT Topological insulators (TIs) possess unique topological surface states (TSS) with strong spin-momentum locking. This leads to a large net surface spin accumulation when a surface charge current flows, thereby efficiently exerting a strong spin-orbit torque (SOT) on an adjacent ferromagnet. However, the effectiveness …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":14},{"title":"Thermally Robust Piezoelectric KNN/Polyimide Separator for Regulating Lithium Deposition in Lithium Metal Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79294?af=R","doi":"10.1002/adfm.79294","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-25","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Shumin Lin","Qiang Zhou","Shuang Luo","Dan Zhong","Bo Peng","Zhouqishuo Cai","Jie Bai","Hao Xue","Hua Bai"],"authorMore":false,"abstract":"An electrospun KNN/polyimide separator introduces oriented piezoelectric polarization into lithium metal batteries. During plating, local pressure from nascent lithium protrusions triggers electrostatic feedback that redirects Li + migration away from hotspots, promotes uniform deposition, and preserves separator integrity under heat, providing a promising strategy for improving the cycling durability and safety of lithium metal batteries without relying on passive blocking alone. ABSTRACT Lithium-metal batteries offer exceptionally high theoretical energy density but are hindered by dendrite-induced short circuits and the limited thermal stability of conventional separators. Here, we …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":15},{"title":"A Biodegradable and Tough Piezoelectric Silk Fibroin Fiber","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77698?af=R","doi":"10.1002/adfm.77698","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":[],"authorMore":false,"abstract":"Dynamic salting-out-assisted microfluidic spinning yields biodegradable silk fibroin fibers with high toughness, molecular orientation, and enhanced piezoelectricity. The resulting fiber-based devices enable stable electromechanical conversion and in vivo monitoring of respiration, muscle activity, and ultrasound-driven energy harvesting, highlighting a promising platform for bioresorbable piezoelectric sensing. ABSTRACT Biodegradable piezoelectric implants are optimal platforms for transient biosensing and therapeutics. However, limited piezoelectric properties and toughness impede the deployment of biodegradable piezoelectric implants in dynamic tissues and organs. In this study, we have …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":16},{"title":"Dynamic Piezoelectric Polarization Directs Reaction Pathways in CO2 Reduction Over Pt/Cu2O@BaTiO3 Dual‐Site Heterostructures","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78402?af=R","doi":"10.1002/adfm.78402","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Chunlai Dong","Xiuli Zhang","Yi Wang","Feng Ru Fan"],"authorMore":false,"abstract":"Dynamic piezoelectric polarization is coupled with a Pt/Cu 2 O@BTO dual-site heterostructure to regulate photocatalytic CO₂ reduction. The spatially differentiated Pt and Cu 2 O interfaces promote charge separation and CO₂ /H₂O half-reactions, while stress-induced polarization redirects post-*CO evolution by suppressing deep hydrogenation and favoring CO desorption under coupled light and mechanical stimulation, achieving high CO production and selectivity. ABSTRACT Efficient and selective CO₂ conversion under mild conditions remains challenging because rapid interfacial charge recombination and poorly controlled carbon-conversion pathways often limit both catalytic activity and …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":17},{"title":"Flexoelectric Suppression of Interfacial Carrier Loss in BaTiO3 Thin‐Film Bulk Photovoltaic Systems","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76848?af=R","doi":"10.1002/advs.76848","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Minwoo Jang","Hyunkyu Lim","Sanghoon Yeom","Jaewhan Oh","Yongsoo Yang","Hyungwoo Lee"],"authorMore":false,"abstract":"In single-crystalline BaTiO₃ thin films, flexoelectric strain gradients strongly enhance photocurrent by suppressing interfacial carrier loss. Loading experiments reveal a ∼35-fold photocurrent increase with applied force. Self-consistent electrostatic modeling shows that strain gradients reshape the interfacial potential landscape, strengthen local drift fields, and govern carrier-extraction efficiency, establishing flexoelectric modulation as a route to interfacial-loss engineering in bulk photovoltaic systems. ABSTRACT Bulk photovoltaic (BPV) effects in ferroelectric oxides have attracted significant attention for their potential to circumvent the bandgap-limited open-circuit voltage of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":18},{"title":"Machine Learning‐Driven Design of Electrolytes and Interfaces for Solid‐State Lithium Batteries: Progress and Outlook","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78357?af=R","doi":"10.1002/adfm.78357","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning、摘要：neural networks","score":8,"authors":["Jihan Wu","Huiqun Wang","Chen Wang","Hao Chen","Jiajia Han","Li Zhang"],"authorMore":false,"abstract":"This review summarizes recent advances in machine learning, especially machine-learning potentials (MLIPs), for solid-state lithium batteries, focusing on methodological foundations, bulk material design, interface engineering, and closed-loop R\u0026D (research and development) pathways. It highlights that machine learning has evolved from merely improving screening efficiency to a pivotal hub that integrates material discovery, interface analysis, and experimental optimization in an iterative process. ABSTRACT Solid-state lithium batteries are a leading candidate for next-generation high-energy-density and high-safety batteries but suffer from inherent trade-offs among ionic conductivity, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":19},{"title":"Self‐Electrostatic Interlock of β‐Chitin/MXenes/Ni Fiber‐Based Films for Multifunctional Electromagnetic Interference Shielding","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78409?af=R","doi":"10.1002/adfm.78409","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"自锁与互锁结构","topics":["自锁与互锁结构","智能传感"],"matchTerm":"interlocking","matchWhere":"摘要：interlocking、摘要：triboelectric","score":8,"authors":["Tong Wang","Fei Pan","Yongpeng Wu","Yuqing Zhu","Chunhua Sun","Pengxu Chen"],"authorMore":true,"abstract":"Magnetic-field-induced Ni fiber assembly and electrostatic interlocking between β-chitin and Ti 3 C 2 T x enable the construction of mechanically robust multifunctional SPMN films. The hierarchical conductive and magnetic network delivers high EMI shielding effectiveness, together with efficient Joule/photothermal heating and triboelectric response. These integrated functions further demonstrate the potential of SPMN films for smart wearable electronics and thermal management. ABSTRACT MXenes have emerged as promising electromagnetic interference (EMI) shielding materials because of their metal-like electrical conductivity, excellent processability, and lightweight nature. However, their …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":20},{"title":"A Physical Adaptive Material Motor Unit Neural Network: A Hygromorph Composite Material Machine","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77473?af=R","doi":"10.1002/advs.77473","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"surrogate model","matchWhere":"摘要：surrogate model、标题：neural network","score":8,"authors":["Charles de Kergariou","Helmut Hauser","David Correa"],"authorMore":false,"abstract":"This study introduces a new class of material-based intelligent machines. It presents a Physical Adaptive Material Motor Unit Neural Network, an assembly of smart 4D printed actuators and a controlling system that adapt through environmental interaction its shading behavior. The material-based machine regulates light through a self-actuating facade, which opens in response to temperature and humidity. ABSTRACT Advances in novel materials science enable structures to function as intelligent machines by embedding memory and learning capabilities directly into materials. Our work introduces a physical adaptive material motor unit neural network, leveraging a new generation of controllable …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":21},{"title":"Machine learning-driven impact response of discrete patterns of A 0-26","tkey":"other","id":23},{"title":"Interpretable Deep Learning of Molecule‐Solvent Interactions Using a Solvatochromic Subgroup Contribution Framework","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77347?af=R","doi":"10.1002/advs.77347","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Jinyong Park","Minhi Han","Kiwoong Lee","Seokwoo Kim","Sungnam Park"],"authorMore":false,"abstract":"Chemistry-informed deep learning (DL) models based on the solvatochromic subgroup contribution (SSC) framework predict and interpret solvent-dependent spectral shifts, revealing physically meaningful subgroup-solvent interactions. ABSTRACT Solvent effects critically influence the photophysical and optical properties of molecules in solution, yet a quantitative and interpretable description of solvent effects remains a long-standing challenge. In this study, to quantitatively understand and chemically interpret solvatochromism, deep learning (DL) models based on the solvatochromic subgroup contribution (SSC) framework were introduced, which describes solvatochromic shifts through localized …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":24},{"title":"Deformation‐Robust Multimodal Electronic Skin Enabled by Conformal Surface Plasmons for Cross‐Medium Robotic Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79263?af=R","doi":"10.1002/adfm.79263","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：piezoresistive","score":5,"authors":["Yongze Li","He Gao","Lang Yuan","Ting Cui","Minglu Zhu","Jian He"],"authorMore":true,"abstract":"An ultrathin deformation-robust e-skin unifies a five-channel piezoresistive network and a conformal surface plasmon waveguide within one flexible interdigitated-electrode architecture. It maps grasp pressure, perceives approaching targets before contact, and interrogates concealed substances through dielectric barriers. Frequency-resolved microwave fingerprints, interpreted by machine learning, reveal cross-medium material identity during dexterous robotic manipulation. ABSTRACT Electronic skins (e-skins) generally transduce contact mechanics but cannot interrogate materials concealed by packaging, limiting robotic perception to accessible surfaces. A multimodal cross-medium e-skin is …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":25},{"title":"Mechanical Programming of PEGDA‐β‐CD Polyrotaxane‐Based Hydrogels via Host–Guest Molecular Recognition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77853?af=R","doi":"10.1002/adfm.77853","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":[],"authorMore":false,"abstract":"A mechanically programmable hydrogel for tissue engineering is developed by modulating the molecular threading density of poly(ethylene glycol) diacrylate- β -cyclodextrin (PEGDA- β -CD) polyrotaxane and combining it with β -CD-modified gelatin. The polyrotaxane-guided transition from disordered pores to laminar microstructures enables precise tuning between high elasticity and high damping. Hydrogels ideally accelerate wound healing in vivo due to their biocompatibility and proper mechanical properties. ABSTRACT Polyrotaxane-based hydrogels with mechanically interlocked structures offer unique opportunities for designing biomaterials with tunable mechanical properties in tissue …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":26},{"title":"Decoupled Temperature‐Pressure Sensing via Hierarchical Porous Sponge for Thermo‐Tactile Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78367?af=R","doi":"10.1002/adfm.78367","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：piezoresistive","score":5,"authors":["Jiachen Dong","Bo Xu","Hongyu Mi","Xin Zhao","Yuqing Zhai","Yongqi Zhu"],"authorMore":true,"abstract":"A hierarchically porous PDMS/CNT sponge sensor was fabricated via a template method. It converts pressure and temperature into independent resistance and voltage signals via piezoresistive and thermoelectric effects, physically avoiding crosstalk. Benefiting from excellent compressibility, thermal insulation, and conductivity, it achieves high sensitivity, fast response, and outstanding durability for electronic skin and motion detection even under complex mechanical stimuli. ABSTRACT Precise and crosstalk-free discrimination of pressure and temperature remains a fundamental challenge in artificial sensory systems due to the intrinsic coupling of mechanical and thermal transduction. Herein, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":27},{"title":"Embedded Direct Ink Writing of Thermoset and Elastomeric Polymers via Frontal Polymerization","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78142?af=R","doi":"10.1002/adfm.78142","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":[],"authorMore":false,"abstract":"Embedded frontal polymerization direct ink writing (FP-DIW) combines frontal ring-opening metathesis polymerization with embedded 3D printing to decouple deposition from curing. A yield-stress support bath stabilizes low-viscosity inks, while on-demand thermal initiation enables controlled front propagation. This approach expands the accessible feature size, geometry, and material range beyond conventional FP-DIW in air. ABSTRACT Direct ink writing (DIW) using frontal ring-opening metathesis polymerization (FROMP) enables rapid, energy-efficient fabrication of thermoset and elastomeric architectures through a self-propagating exothermic curing reaction. However, FP-DIW is constrained by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":28},{"title":"An Integrated Artificial Intelligence Framework for Nanomedicine Engineering","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78125?af=R","doi":"10.1002/advs.78125","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：neural networks","score":4,"authors":["Meichen Dong","Qin Luo","Xinyi Ding","Chaoqi Lu","Ru Zhang","Qingqing Tan"],"authorMore":true,"abstract":"This review outlines a closed-loop AI ecosystem for nanomedicine engineering. By synergizing multimodal data harmonization, objective-driven AI architectures, and automated high-throughput validation, this “Design-Make-Test-Analyze” (DMTA) workflow transforms traditional heuristic formulation into a predictive, self-optimizing paradigm, accelerating the translation of next-generation nanotherapeutics. ABSTRACT The translation of nanomedicines is frequently bottlenecked by trial-and-error optimization. Integrating artificial intelligence (AI) transforms this process into a closed-loop, experimentally grounded discovery ecosystem. This Review provides a roadmap for this paradigm, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":29},{"title":"Lattice‐Level Negative Thermal Expansion Enables Thermomechanical Self‐Compensation in High‐Rate Lithium Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79327?af=R","doi":"10.1002/adfm.79327","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-26","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Yuhan Feng","Yaohui Dai","Chaozhong Liu","Lizhi Li","Zhenzhu Wang","Wenqiang Lu","Xingji Li","Bo Song"],"authorMore":false,"abstract":"A negative thermal expansion Cu 2 P 2 O 7 phase is coupled to a PVDF-HFP separator through a polydopamine interface, converting lattice contraction into macroscopic thermal shrinkage resistance. The composite membrane preserves ion pathways under thermal stress, stabilizes lithium deposition, and supports high rate Ni-rich lithium metal cells, highlighting an active thermomechanical design strategy for safer power systems. ABSTRACT Localized Joule heating in high-rate lithium metal batteries often induces severe thermomechanical failure of polymer separators and accelerates thermal runaway in cells with Ni-rich NCM cathode. Here we report a multiscale separator design strategy that …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":30},{"title":"From Artificial to Embodied and Physical Intelligence in Smart Manufacturing","url":"https://doi.org/10.1002/advs.78384","doi":"10.1002/advs.78384","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"multistable","matchWhere":"摘要：multistable","score":3,"authors":["Kang Wang","Xinyu Lu","Tong Liu","Jinjie Fang","Xin Li","Siqian Wu"],"authorMore":false,"abstract":"ABSTRACT Manufacturing is evolving from automation‐centered production toward systems capable of sensing, adaptation, and autonomous response across digital, mechanical, and material domains. Although recent progress has been largely driven by artificial intelligence, current manufacturing intelligence often remains external to physical systems and suffers from limited robustness, interpretability, and transferability in complex industrial environments. Here, we present a unified perspective on smart manufacturing through the framework of artificial intelligence (AI), embodied intelligence (EI), and physical intelligence (PI). AI provides abstraction, prediction, and generative capability; …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":31},{"title":"Fatigue‐Resistant Biaxially Stretchable Micro‐Origami Structured Electrodes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79271?af=R","doi":"10.1002/adfm.79271","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-24","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensor","matchWhere":"摘要：pressure sensor","score":3,"authors":["Yifei Huang","Yujun Deng","Peiyun Yi","Linfa Peng"],"authorMore":false,"abstract":"This work presents a micro-origami structured electrode which introduces biaxially foldable micro-origami structures onto the surface of a bilayer thin-film electrode composed of a metal film and a polymer substrate. The electrode exhibits biaxial stretchability (\u003e80%) while maintaining high conductivity and excellent fatigue resistance (ABSTRACT Stretchable electrodes are essential for next generation wearable electronics, but simultaneously achieving high conductivity, large stretchability, and long-term reliability remains challenging. This work proposes a micro-origami structured electrode (MOSE) that mitigates the conflicts between stretchability, conductivity and fatigue resistance. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":32},{"title":"Striated Core‐Sheath Fibers for Constructing Breathable Intelligent Fabrics With Multiple X‐Ray Shielding and Strain‐Pressure Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78385?af=R","doi":"10.1002/adfm.78385","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive","score":3,"authors":[],"authorMore":false,"abstract":"Striated core-sheath fibers fabricated via coaxial wet-spinning are woven into multilayer breathable textiles, integrating high-efficiency X-ray shielding, sensitive mechanical sensing and Morse-code transmission for wearable radiation-protection. ABSTRACT The extensive use of medical X-rays increases chronic radiation exposure risks for medical staff and patients. Traditional lead-based materials present low shielding efficiency at 20–100 keV, along with high weight, stiffness, poor flexibility, toxicity, and single functionality, limiting their wearable applications. Herein, hierarchical striated Bi 2 O₃ /WC/TPU@MXene/TPU (BWMT) core-sheath fibers are fabricated via coaxial wet-spinning. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":33},{"title":"Gradient‐Oxidized Bacterial Cellulose for Self‐Sustained Soil Moisture Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78511?af=R","doi":"10.1002/advs.78511","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-27","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"摘要：deep learning","score":2,"authors":["Nan Zhou","Jing Li","Xiang Xu","Senyuan Ye","Bin Chen","Shuang Wu","Duo Xu","Keshuai Liu","Chong Gao","Weilin Xu","Can Ge"],"authorMore":false,"abstract":"An asymmetric encapsulated bacterial cellulose device integrates a gradient-oxidized BC framework with a LiCl-doped Ecoflex hygroscopic layer, enabling self-powered soil moisture monitoring through directional ion transport. The device sustains stable hydrovoltaic output, supports deep-learning humidity classification, and fully biodegrades in soil. ABSTRACT Soil moisture monitoring is pivotal to precision agricultural irrigation. Conventional soil moisture sensors rely on external power supplies and suffer from poor environmental compatibility. The facile fabrication of hydrovoltaic devices with asymmetric film structures remains challenging, and related designs tailored for soil scenarios …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":34},{"title":"Activation‐Free and Strain‐Resilient Island‐Bridge Liquid Metal Inks for Machine‐Learning‐Enabled Epidermal Electromyography","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75526?af=R","doi":"10.1002/adma.75526","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-26","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Yidong Peng","Yanqing Gu","Haoxuan Zhu","Lingqi Liu","Haoran Liu","Haitao Huang","Biao Zhou","Jiancheng Dong","Yunpeng Huang"],"authorMore":false,"abstract":"A CuCNTs/LMPs island-bridge architecture enables intrinsically conductive, activation-free liquid-metal inks with high-resolution printability and strong electromechanical resilience. The printed conductors retain a sheet resistance of 1.3 × 10 −1 Ω sq −1 at 300% strain and integrate into breathable 12-channel HD-sEMG arrays, enabling machine-learning-assisted load classification and continuous monitoring of fatigue-associated exercise states during dynamic exercise. ABSTRACT Liquid metal particle-based inks offer a scalable route toward stretchable electronics, yet their practical implementation is hindered by activation-dependent conductivity and poor electrical stability under …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":35},{"title":"An Integrated Framework Coupling Hierarchical Hyperspectral i‐trait Screening, Gene Identification, and Functional Validation for Genetic Dissection of Salt Tolerance in Cotton","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78504?af=R","doi":"10.1002/advs.78504","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Bowei Xu","Le Liu","Mengli Yu","Yuling Guo","Junli Ye","Jun Zhang"],"authorMore":true,"abstract":"An integrated phenomics–genomics framework captures dynamic salt-stress responses in laboratory-grown cotton seedlings through time-series hyperspectral imaging and non-destructive i-trait extraction. Hierarchical screening identifies biologically relevant, heritable, and non-redundant traits for high-resolution GWAS, identifying GhST7. Subsequent functional analyses show that promoter haplotypes regulate GhST7 expression, antioxidant capacity, and cotton salt tolerance. ABSTRACT Cotton is an economically pivotal fiber crop worldwide, but its growth and yield are critically limited by soil salinity. Salt tolerance is a complex quantitative trait, and conventional destructive phenotyping …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":36},{"title":"Steric‐Pressure‐Driven Topological Reconstruction for High‐Performance Zintl Phase Thermoelectrics with Machine‐Learning Validation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78519?af=R","doi":"10.1002/advs.78519","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Siyeon Kim","Aziz Ahmed","Juwon Lee","Jihyun Lee","Ji Hee Pi","Kyu Hyoung Lee","Kang Min Ok","Tae‐Soo You"],"authorMore":false,"abstract":"Synergistic Sr and Ag co-doping drives steric-pressure-induced reconstruction from a 2D layered structure to a cross-linked 3D framework in the Ca 9- x Sr x Zn 4+ y - z Ag z Sb 9 system, enhancing carrier mobility while maintaining a large Seebeck coefficient and doubling ZT to 0.73 at 873 K, with hybrid transfer machine learning further capturing the compositional trends and high-performance region. ABSTRACT The Zintl phase A 9 M 4+ x Pn 9 (A = Ca, Sr, Eu, Yb; M = transition metal; Pn = pnictogen) family is a promising class of thermoelectric (TE) materials, but conventional optimization has relied on interstitial site tuning rather than structural reconstruction. In this work, we achieve …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":37},{"title":"An Explainable Multimodal Deep‐Learning Model Using Histopathological Image and Clinical Information for Prognosis Prediction in Colorectal Cancer: A Multi‐Center Cohort Study","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78417?af=R","doi":"10.1002/advs.78417","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep-learning","matchWhere":"摘要：deep-learning","score":2,"authors":["Zhihan Jiang","Xiangchao Shi","Chenghan Su","Yao Ma","Rui Li","Menglei Chen"],"authorMore":true,"abstract":"This study develops a multimodal deep-learning model that integrates clinical variables and histopathological images to predict survival outcomes in colorectal cancer. The multimodal model effectively stratifies patients into low- and high-risk groups, demonstrating superior accuracy and generalizability across multiple independent cohorts. Further multi-omic analyses delineate distinct molecular features across risk groups, enhancing the biological interpretability. ABSTRACT Accurate prognostication is crucial for the individualized management of patients with colorectal cancer (CRC), while the accuracy and interpretability of current models still need to be improved. This study aims to … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":38},{"title":"Lignin Eutectogel Smart Skins for Integrated Fast Communication, Cervical Posture Monitoring and Warning","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79156?af=R","doi":"10.1002/adfm.79156","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-25","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Mengzhu Cao","Jianhong Lu","Xueqing Qiu","Wenjing Lin","Xuliang Lin","Jiakai Feng","Duoqu Chen","Yanlin Qin"],"authorMore":false,"abstract":"Based on the multifunctional LS/PAM/DES eutectogel, an all-in-one smart skin sensing system has been rational designed for closed-loop management of posture-deviation “monitoring-result assessment-threshold warning” and fast communication. ABSTRACT Conductive hydrogels underpin multifunctional electronic skins, yet unifying sustainable processing, long-term interfacial adhesion, and robust performance across extreme temperatures remains a central materials challenge for wearable sensing applications. This study presents a long-term storable lignin eutectogel (LS/PAM/DES) synthesized via a facile one pot method. The eutectogel demonstrates remarkable stretchability, relatively high ionic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":39},{"title":"Harnessing Synergistic Photophysical Processes in Phosphorescent Carbon Dots for Multifunctional Neuromorphic Vision","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79270?af=R","doi":"10.1002/adfm.79270","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-24","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Zihan Ying","Yi Zhang","Jiahao Fan","Mengqi Li","Siqi Liu","Jun Zhang"],"authorMore":false,"abstract":"Carbon dots–epoxy composites form interfacial exciplexes, yielding long-lived green room-temperature phosphorescence. Leveraging exciplex kinetics, the composite implements all-optical neuromorphic vision functions including optical learning, noise suppression, digit recognition, and motion trajectory recording, integrating sensing, memory, and computation. ABSTRACT Room-temperature phosphorescence (RTP) materials hold immense potential for neuromorphic vision, yet achieving system-level cognitive capabilities within a single material remains challenging. Here, we design a carbon dots (CDs)–epoxy composite wherein hydrogen-bond-mediated interfacial assembly between electron-donating CDs …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":40},{"title":"Constructing Stretchable Superhydrophobic Perovskite Quantum Dot Films via Dual‐Phase Synergistic Engineering","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75486?af=R","doi":"10.1002/adma.75486","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-24","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Jianqiang Xiao","Kai Yin","Lingxiao Wang","Hao Song","Bin Zhou","Jun He"],"authorMore":true,"abstract":"By integrating dual-phase synergistic engineering with femtosecond laser micro/nano fabrication technology, a stretchable superhydrophobic perovskite QDs film is successfully constructed. Its outstanding performance originates from the synergistic design of the phase-separated organic matrix and the biomimetic surface structure, enabling the film to achieve superelasticity while simultaneously realizing the construction of a biomimetic superhydrophobic surface and the controllable precipitation of QDs. ABSTRACT Perovskite quantum dots (PQDs) films intended for flexible optical applications are required not only to exhibit excellent luminescence performance, but also to simultaneously …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":41},{"title":"Machine‐Learning‐Potential‐Driven Volcano Relationship in Grain Boundary Amorphicity and Ionic Transport of Antiperovskite Solid Electrolytes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75492?af=R","doi":"10.1002/adma.75492","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Abdullah Bin Faheem","Haobo Li"],"authorMore":false,"abstract":"Machine-learning-potential-driven molecular dynamics (MD) simulations reveal a volcano relationship between grain boundary amorphicity and ionic transport in oxyhalide antiperovskite solid electrolytes. Intermediate Cl − /Br − compositions create moderately amorphous grain boundaries that maximize Li-ion transport, establishing controlled anion segregation as a strategy for engineering interfacial disorder and reducing transport resistance in solid-state materials. ABSTRACT Ionic transport in solid-state electrolytes is governed by interfacial disorder and local chemical environments, yet their microscopic design principles remain challenging because large-scale interfacial kinetics are … ✅ … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":42},{"title":"Grain‐Boundary‐Facilitated Palladium Hydride Formation Enables Humidity‐Tolerant Catalytic Hydrogen Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75476?af=R","doi":"10.1002/adma.75476","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":["Bingxin Yang","Sampreeti Bhattacharya","Heng Liu","Michael A. Pence","K. A. U. Madhushani","Bobby G. Duersch"],"authorMore":true,"abstract":"Grain-boundary-rich palladium enables catalytic hydrogen sensing under extreme humidity by accelerating PdHx formation, weakening water adsorption, and sustaining H 2 –O₂ reactivity. The resulting sensor operates without external heating across 22°C–80°C and up to 90% relative humidity while maintaining high sensitivity, selectivity, stability, and robust quantitative performance under dynamically varying environmental conditions. ABSTRACT Reliable hydrogen sensing under high absolute humidity remains a significant challenge owing to the competitive adsorption of water molecules on the sensing material surface. Here, we report a humidity-tolerant catalytic H 2 sensor based on a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-25","tkey":"other","id":43},{"title":"Computational and Data‐Driven Strategies for Lignocellulosic Biomass Valorization: From Multiscale Modeling to Digitalized Biorefinery Design","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78026?af=R","doi":"10.1002/advs.78026","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":[],"authorMore":false,"abstract":"This Review critically connects structural recalcitrance, molecular modeling, solvent and catalyst design, pyrolysis, machine learning, reactor simulation, and FAIR digital infrastructure. Emphasis is placed on experimentally validated information transfer across scales, uncertainty and applicability domains, and the recycle, durability, techno-economic, and life-cycle constraints required to move computational insights toward predictive lignocellulosic biorefinery design. ABSTRACT Lignocellulosic biomass is a major renewable carbon resource for sustainable production of fuels, chemicals, and functional materials. Yet its valorization remains constrained by structural recalcitrance, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-25","tkey":"other","id":44},{"title":"Unveiling Mechanisms of SEI Formation and Sodium Loss in Sodium Batteries via Interface Reactor Sampling","url":"https://advanced.onlinelibrary.wiley.com <script>
(function(){
  var D = JSON.parse(document.getElementById('DATA').textContent);
  var A = D.articles;
  var TOPICS = D.topics;

  /* Inline SVG rather than emoji: emoji depend on a colour-emoji font being
     installed, and the missing-glyph box is worse than no icon at all. */
  var P = {
    all:   '<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
    air:   '<path d="M3 7.5h9.6a2.6 2.6 0 1 0-2.6-2.6"/><path d="M3 12h13.2a2.6 2.6 0 1 1-2.6 2.6"/><path d="M3 16.5h6.8"/>',
    rs:    '<circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="3.7" ry="8.6"/><path d="M3.4 12h17.2"/>',
    chem:  '<path d="M9.5 2.8h5"/><path d="M10.6 2.8v5.8L6.3 16.9a2 2 0 0 0 1.8 3h7.8a2 2 0 0 0 1.8-3L15.4 8.6V2.8"/><path d="M7.9 13.6h8.2"/>',
    bgc:   '<path d="M20.6 3.4C20.6 12 15.7 16.1 9.5 16.1H4.1C4.1 7.5 9 3.4 15.2 3.4h5.4z"/><path d="M4.1 20.6c2.2-5.8 6.1-9.1 11.3-10.5"/>',
    ghg:   '<path d="M4.6 20v-6.2"/><path d="M2.2 15.6 4.6 13.2l2.4 2.4"/><path d="M12 20V9.4"/><path d="M9.6 11.8 12 9.4l2.4 2.4"/><path d="M19.4 20v-3.4"/><path d="M17 18.4l2.4-2.4 2.4 2.4"/>',
    wx:    '<path d="M13.2 2.6 4.4 13.8h6.2l-1 7.6 8.8-11.2h-6.2l1-7.6z"/>',
    gis:   '<path d="M9 3.4 3.5 5.8v14.8L9 18.2l6 2.4 5.5-2.4V3.4L15 5.8 9 3.4z"/><path d="M9 3.4v14.8"/><path d="M15 5.8v14.8"/>',
    other: '<path d="M14 3H7.6A2 2 0 0 0 5.6 5v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V7.6L14 3z"/><path d="M14 3v4.6h4.6"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M20.2 20.2l-4.3-4.3"/>'
  };
  function svg(k, cls){
    return '<svg class="'+(cls||'ic')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
         + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[k]||P.other)+'</svg>';
  }

  var state = { topic:'all', tier:'all', sort:'score', q:'' };

  /* An article can hit several keyword groups at once. a.topics holds every
     match (used for filtering); a.topic is the primary one (used for the cover
     chip and the section grouping, so nothing is listed twice). */
  var THEME = D.topicTheme || {};
  function topicsOf(a){ return a.topics && a.topics.length ? a.topics : [a.topic]; }

  var tabs = document.getElementById('tabs');
  var C = {all:A.length};
  TOPICS.forEach(function(t){ C[t]=0; });
  A.forEach(function(a){
    topicsOf(a).forEach(function(t){ if(C[t]!==undefined) C[t]++; });
  });

  var tabDefs = [{k:'all',label:'全部',icon:'all'}].concat(
    TOPICS.map(function(t){ return {k:t,label:t,icon:THEME[t]||'other'}; })
  );
  tabDefs.forEach(function(d){
    var b = document.createElement('button');
    b.className = 'tab' + (d.k==='all'?' on':'');
    b.type = 'button';
    var n = d.k==='all' ? C.all : (C[d.k]||0);
    b.innerHTML = svg(d.icon) + '<span>'+d.label+'</span><span class="n">'+n+'</span>';
    b.onclick = function(){
      state.topic = d.k;
      [].forEach.call(tabs.children, function(x){ x.classList.toggle('on', x===b); });
      render();
    };
    tabs.appendChild(b);
  });

  document.getElementById('seg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.tier = b.dataset.t;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  document.getElementById('sortseg').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    state.sort = b.dataset.s;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    render();
  };
  var qt;
  document.getElementById('q').oninput = function(e){
    clearTimeout(qt);
    var v = e.target.value.trim().toLowerCase();
    qt = setTimeout(function(){ state.q = v; render(); }, 130);
  };

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function trunc(s,n){ s=s||''; return s.length>n ? s.slice(0,n)+'…' : s; }
  function initial(name){
    if(!name) return '?';
    var m = /[A-Za-z]/.exec(name);
    return m ? m[0].toUpperCase() : name.slice(0,1);
  }
  function isFuture(d){ return (d||'').indexOf('（在线预发表）') >= 0; }
  function dateOf(a){ return (a.pubdate||a.reportDate||'').replace('（在线预发表）','').slice(0,10); }
  document.getElementById('kpi-days').textContent = D.reports.length;

  function select(){
    var q = state.q;
    var out = A.filter(function(a){
      if(state.topic!=='all' && topicsOf(a).indexOf(state.topic)<0) return false;
      if(state.tier!=='all' && a.tier!==state.tier) return false;
      if(q){
        var hay = (a.title+' '+a.abstract+' '+a.authors.join(' ')+' '+a.journal+' '+a.doi).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    if(state.sort==='date'){
      out.sort(function(x,y){ return dateOf(y).localeCompare(dateOf(x)) || ((y.score||0)-(x.score||0)); });
    } else if(state.sort==='journal'){
      out.sort(function(x,y){ return x.journal.localeCompare(y.journal) || ((y.score||0)-(x.score||0)); });
    } else {
      out.sort(function(x,y){ return ((y.score||0)-(x.score||0)) || dateOf(y).localeCompare(dateOf(x)); });
    }
    return out;
  }

  function cardHTML(a){
    var tags = '<span class="tag '+a.tier+'">'+esc(a.tierLabel)+'</span>'
             + '<span class="tag">'+esc(a.jabbr)+'</span>';
    if(a.score!=null) tags += '<span class="tag">得分 '+a.score+'</span>';
    if(a.matchTerm) tags += '<span class="tag match" title="命中位置：'+esc(a.matchWhere)+'">命中 '+esc(a.matchTerm)+'</span>';
    topicsOf(a).filter(function(t){ return t!==a.topic; }).slice(0,2).forEach(function(t){
      tags += '<span class="tag cross">也属 '+esc(t)+'</span>';
    });

    var ab = a.abstract
      ? '<p class="excerpt">'+esc(trunc(a.abstract,200))+'</p>'
      : '<p class="excerpt none">日报未收录摘要'+(a.matchTerm?'（命中词 '+esc(a.matchTerm)+'）':'')+' · 点击看原文</p>';

    var au = esc(a.authors[0] || '佚名') + (a.authors.length>1 ? ' 等 '+(a.authors.length-1)+' 位' : '');

    return '<article class="card t-'+a.tkey+'" data-id="'+a.id+'" tabindex="0">'
      + '<div class="cover">'
      +   '<div class="tp">'+esc(a.topic)+'</div>'
      +   (a.score!=null ? '<div class="sc">★ '+a.score+'</div>' : '')
      +   '<div class="icon">'+svg(a.tkey)+'</div>'
      +   '<div class="jr">'+esc(a.jabbr)+'</div>'
      +   '<div class="tier '+a.tier+'"></div>'
      + '</div>'
      + '<div class="body">'
      +   '<h3 class="title">'+esc(a.title)+'</h3>'
      +   ab
      +   '<div class="tagrow">'+tags+'</div>'
      + '</div>'
      + '<div class="foot">'
      +   '<div class="av">'+esc(initial(a.authors[0]))+'</div>'
      +   '<div class="au">'+au+'</div>'
      +   '<div class="dt">'+esc(dateOf(a))+(isFuture(a.pubdate)?' · 预发表':'')+'</div>'
      + '</div>'
      + '</article>';
  }

  var wrap = document.getElementById('wall-wrap');
  var countEl = document.getElementById('count');
  var TIER_NAME = {must_read:'必读', worth_reading:'值得一读', other:'其他相关'};

  function render(){
    var list = select();
    var scope = (state.topic==='all' ? '全部学科' : state.topic)
              + (state.tier==='all' ? '' : ' · '+TIER_NAME[state.tier]);
    countEl.textContent = scope + ' ｜ ' + list.length + ' / ' + A.length + ' 篇';

    if(!list.length){
      wrap.innerHTML = '<div class="empty">'+svg('search')+'没有匹配的文献，换个关键词或学科试试</div>';
      return;
    }

    var html = '';
    if(state.topic==='all' && state.tier==='all' && !state.q && state.sort==='score'){
      TOPICS.forEach(function(t){
        var g = list.filter(function(a){ return a.topic===t; });
        if(!g.length) return;
        var key = THEME[t] || 'other';
        var related = list.filter(function(a){ return topicsOf(a).indexOf(t)>=0; }).length - g.length;
        html += '<div class="grouphead'+(key!=='other'?' g-'+key:'')+'"><h2>'+svg(key)+t+'</h2>'
              + '<span class="gn">'+g.length+' 篇'
              + (related>0 ? ' · 另有 '+related+' 篇跨学科命中' : '')+'</span><div class="bar"></div></div>'
              + '<div class="wall">'+g.map(cardHTML).join('')+'</div>';
      });
      var rest = list.filter(function(a){ return TOPICS.indexOf(a.topic)<0; });
      if(rest.length){
        html += '<div class="grouphead"><h2>'+svg('other')+'其他</h2>'
              + '<span class="gn">'+rest.length+' 篇</span><div class="bar"></div></div>'
              + '<div class="wall">'+rest.map(cardHTML).join('')+'</div>';
      }
    } else {
      html = '<div class="wall">'+list.map(cardHTML).join('')+'</div>';
    }
    wrap.innerHTML = html;
  }

  var mask = document.getElementById('mask'), modal = document.getElementById('modal');
  function openModal(id){
    var a = A[id]; if(!a) return;
    var authors = a.authors.length ? a.authors.join('、') + (a.authorMore?' 等':'') : '未收录作者信息';
    modal.innerHTML =
      '<div class="mhead" style="background:linear-gradient(135deg,var(--'+a.tkey+'-a),var(--'+a.tkey+'-b))">'
      + '<button class="mclose" id="mclose" type="button">✕</button>'
      + '<div class="mj">'+esc(topicsOf(a).join(' / '))+' · '+esc(a.journal)+'</div>'
      + '<h3>'+esc(a.title)+'</h3>'
      + '<div class="mmeta">'
      +   '<span>'+esc(a.tierLabel)+'</span>'
      +   (a.score!=null?'<span>得分 '+a.score+'</span>':'')
      +   (a.pubdate?'<span>'+esc(a.pubdate)+'</span>':'')
      +   '<span>日报 '+esc(a.reportDate)+'</span>'
      + '</div></div>'
      + '<div class="mbody">'
      +   '<div class="sec-t">摘要</div>'
      +   (a.abstract
            ? '<p class="abs">'+esc(a.abstract)+'</p>'
            : '<p class="abs" style="color:#9d9da8">该条日报未收录摘要。</p>')
      +   '<div class="sec-t">作者</div><p class="authors">'+esc(authors)+'</p>'
      +   (a.doi ? '<div class="kv">DOI：<code>'+esc(a.doi)+'</code></div>' : '')
      +   (a.matchWhere ? '<div class="kv">关键词命中：'+esc(a.matchWhere)+'</div>' : '')
      +   '<div class="linkrow">'
      +     '<a class="btn pri" href="'+esc(a.url)+'" target="_blank" rel="noopener">打开原文 ↗</a>'
      +     (a.doi?'<a class="btn" href="https://doi.org/'+esc(a.doi)+'" target="_blank" rel="noopener">DOI 链接</a>':'')
      +     '<button class="btn" id="mcopy" type="button">复制 DOI</button>'
      +   '</div>'
      + '</div>';
    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    var cb = document.getElementById('mclose'); if(cb) cb.onclick = closeModal;
    var cp = document.getElementById('mcopy');
    if(cp) cp.onclick = function(){
      var txt = a.doi || a.url;
      var done = function(){ cp.textContent='已复制 ✓'; setTimeout(function(){ cp.textContent='复制 DOI'; },1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done, function(){ cp.textContent = txt; });
      } else { cp.textContent = txt; }
    };
  }
  function closeModal(){ mask.classList.remove('on'); document.body.style.overflow=''; }
  mask.onclick = closeModal;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  wrap.addEventListener('click', function(e){
    var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id);
  });
  wrap.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ var c = e.target.closest('.card'); if(c) openModal(+c.dataset.id); }
  });

  render();
})();
</script>
