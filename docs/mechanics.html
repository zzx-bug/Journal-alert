material types, boundary conditions, and irregular geometries","url":"https://doi.org/10.1016/j.ijsolstr.2026.114376","doi":"10.1016/j.ijsolstr.2026.114376","journal":"International Journal of Solids and Structures","jabbr":"International Journal of Solids and Structures","pubdate":"2027-01-01（在线预发表）","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"标题：neural network","score":6,"authors":["Zhaoyang Hu","Rui Li"],"authorMore":false,"abstract":"✅ 数据源：12 本刊、24 条通道全部正常。","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":103},{"title":"Defect‐Conditioned Machine Learning for Molecular Passivator Design in Stable Perovskite Solar Cells","url":"https://doi.org/10.1002/adfm.79647","doi":"10.1002/adfm.79647","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-13","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Chengzhi Ruan","Haotian Luo","Zhengpei Cai","Lingchuang Liu","Abuzar Abduhappar","Wenya Yang"],"authorMore":false,"abstract":"ABSTRACT Dynamic defects, mobile ions, and evolving interfaces remain major obstacles to efficient and stable perovskite photovoltaics. Molecular passivation can mitigate these losses, but its efficacy is a conditional response rather than an intrinsic molecular property. It depends on defect identity and charge state, molecular conformation, adsorption geometry, interfacial composition, processing history, and operating conditions. This review therefore defines a defect‐molecule‐interface configuration as the learning object for machine‐learning‐assisted passivator design. We show how molecular, defect, interface, process, and device variables can be encoded without conflating passivation …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-14","tkey":"other","id":104},{"title":"Interpretable Machine Learning Reveals Design Rules for Thermal‐Mechanical Decoupling in Covalent Organic Frameworks","url":"https://doi.org/10.1002/adfm.79649","doi":"10.1002/adfm.79649","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-13","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Jian Luo","Yinglong Hu","Xinran Zhang","Kan Tao","Chenxuan Liu","Yanguang Zhou"],"authorMore":false,"abstract":"ABSTRACT Thermal management materials face a persistent challenge: high thermal conductivity (κ) and low Young's modulus (E) are often mutually exclusive. Stiff materials typically conduct heat well while compliant materials tend to thermally insulate. Covalent organic frameworks (COFs) offer exceptional structural tunability that breaks this trade‐off, yet a systematic understanding of κ ‐E decoupling remains elusive. Here we establish an interpretable machine learning framework integrating molecular simulations, six benchmarked models, and SHAP‐based feature analysis to screen over 52 000 topologically valid three‐dimensional COFs. Using random forest as the optimal model, we identify …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-14","tkey":"other","id":105},{"title":"Machine Learning of Temperature‐Dependent Chemical Kinetics Using Parallel Droplet Microreactors","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77040?af=R","doi":"10.1002/advs.77040","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Mamoru Saita","Yutaka Hori"],"authorMore":false,"abstract":"An integrated droplet microfluidics and machine learning framework enables high-throughput characterization of temperature-dependent reaction kinetics. Time-resolved measurements from thousands of droplets train Neural ODE models that accurately predict nonlinear reaction dynamics across diverse thermal environments, bridging large-scale experimentation with data-driven kinetic modeling. ABSTRACT Temperature is a fundamental regulator of chemical and biochemical kinetics, yet capturing nonlinear thermal effects directly from experimental data remains a major challenge due to limited throughput and model flexibility. Recent advances in machine learning have enabled flexible modeling beyond …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-14","tkey":"other","id":106},{"title":"Advanced Mechano‐Electrical Coupling Biomaterials for Orthopedics: From Fundamental Mechanisms to Clinical Translation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74982?af=R","doi":"10.1002/adma.74982","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"智能传感","topics":["智能传感","压电材料"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric、摘要：piezoelectric","score":6,"authors":["Guang Yang","Wenqing Xie","Yusheng Li","Da Zhong","Zhou Li"],"authorMore":false,"abstract":"Mechano-electrical coupling biomaterials convert physiological motion or externally applied mechanical forces into localized bioelectrical signals. Through diverse material systems and transduction mechanisms, these signals regulate cellular behavior, promote tissue regeneration, modulate inflammation, and provide antibacterial or antitumor effects, supporting their broad application in orthopedic repair and disease treatment. ABSTRACT Musculoskeletal tissues are continuously subjected to mechanical stimulation during physiological activity, accompanied by the generation of endogenous bioelectrical signals. Such mechano-electrical coupling plays a pivotal role in tissue development, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-13","tkey":"other","id":107},{"title":"Active Learning For Tractable and Reproducible Pulsed Laser Deposition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78266?af=R","doi":"10.1002/adfm.78266","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"机器学习","topics":["机器学习"],"matchTerm":"active learning","matchWhere":"标题：active learning","score":6,"authors":[],"authorMore":false,"abstract":"Gaining control over complex functional materials for fundamental studies and future applications requires understanding the rich processing space for epitaxial growth. By coupling materials optimization with physical insight, a data-driven machine learning framework identifies conditions that improve quality and reproducibility while revealing competing mechanisms that shape material properties. This general strategy will enable targeted control of materials with new functionalities. ABSTRACT This paper shows how data-driven machine learning approaches can improve growth control, reproducibility, and physical insight in the pulsed laser deposition (PLD) growth of correlated oxides. Despite …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-12","tkey":"other","id":108},{"title":"Device–System Co‐Design of a Memristor‐Based 3D Convolutional Spiking Neural Network for Dynamic Vision Processing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78728?af=R","doi":"10.1002/adfm.78728","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"标题：neural network","score":6,"authors":["Qinkai Zou","Le Zhang","Shuaibin Hua","Puli Gan","Ruhui Zheng","Tian Jin"],"authorMore":true,"abstract":"A device–system co-designed memristor-based 3D convolutional spiking neural network enables efficient dynamic vision processing. Volatile NbO x memristors provide tunable spike encoding, while nonvolatile TaO x memristors perform spatiotemporal convolution. The digital–analog hybrid architecture achieves 97% accuracy in gesture recognition, offering a compact and energy-efficient platform for neuromorphic vision. ABSTRACT Dynamic image processing is a vital component of artificial intelligence and Internet of Things (IoT) applications. However, conventional image processing systems often suffer from high computational complexity and substantial power consumption. Memristors, as emerging …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-12","tkey":"other","id":109},{"title":"Chip‐Level Voltage Controlled Magnetic p‐Bits Array with Variation Compensation for Stochastic Neural Network Computation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78604?af=R","doi":"10.1002/advs.78604","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-10","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"标题：neural network","score":6,"authors":["Jiachen Bao","Songsong Li","Ruizhi Ren","Zheng Zhu","Di Wu","Jiayong Wang"],"authorMore":false,"abstract":"A chip-level VCMA-MTJ array is demonstrated for stochastic neural-network computing. Combined with a tail-truncation strategy to compensate for device-to-device variations, it establishes a hardware–software co-design approach for scalable probabilistic computing. ABSTRACT The increasing computational and energy-efficiency demands of artificial intelligence are driving the development of new computing paradigms based on emerging memory devices. Probabilistic bits (p-bits) based on magnetic tunnel junctions (MTJs), benefiting from energy efficiency, CMOS compatibility, and fast sampling, show broad potential in stochastic neural networks. However, unavoidable device-to-device variations in …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-12","tkey":"other","id":110},{"title":"EZpred: Improving Deep Learning‐Based Enzyme Function Prediction Using Unlabeled Sequence Homologs","url":"https://doi.org/10.1002/advs.78703","doi":"10.1002/advs.78703","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-10","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Chengxin Zhang","Quancheng Liu","Lydia Freddolino"],"authorMore":false,"abstract":"ABSTRACT Features extracted from sequence homologs significantly enhance the accuracy of deep learning‐based protein structure prediction. Indeed, homolog‐aware models such as AlphaFold generally produce more accurate protein structures compared to single sequence‐based methods like ESMfold. In contrast, features from sequence homologs are seldom employed for deep learning‐based prediction of the biological functions of a protein, such as Gene Ontology terms or Enzyme Commission (EC) numbers. Although a small number of models also incorporate function labels from sequence homologs, they cannot utilize features extracted from homologs that lack function labels. To address this gap, we …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-11","tkey":"other","id":111},{"title":"Deep Learning‐Driven Discovery and Engineering of an Efficient PETase for Depolymerization and Detoxification of PET Microplastics Under Physiological Conditions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77163?af=R","doi":"10.1002/advs.77163","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":[],"authorMore":false,"abstract":"A deep learning–driven pipeline mining 246 million protein sequences uncovers AhPETase, an evolutionarily distinct PET hydrolase. Engineered variant AhPETase M1 degrades post-consumer PET microplastics under physiological conditions and reverses microplasticinduced cytotoxicity in human lung and colon cells, establishing enzymatic microplastic detoxification as a viable concept. ABSTRACT Microplastics (MPs) accumulation in ecosystem and human organs poses urgent environmental and health risks, yet few enzymes efficiently degrade polyethylene terephthalate (PET) under physiological conditions. We leveraged deep learning to mine unexplored sequence space across 246 million proteins, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-11","tkey":"other","id":112},{"title":"Elastic‐Invisibility‐Enabled Metastructure With Mechanically Programmed Nonlinear Resonators for Vibration Attenuation and Energy Harvesting","url":"https://doi.org/10.1002/adfm.79413","doi":"10.1002/adfm.79413","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-07","topic":"力学超材料","topics":["力学超材料","压电材料"],"matchTerm":"bistable","matchWhere":"摘要：bistable、摘要：piezoelectric","score":6,"authors":["João Pedro Norenberg","Americo Cunha","Diego Misseroni"],"authorMore":false,"abstract":"ABSTRACT Mechanical programming provides a simple way to tune embedded nonlinear resonators without redesigning the host structure. Here, seven magneto‐elastic piezoelectric resonators are integrated into elastically reconstructed openings of a host beam. The removed stiffness, mass, and inertia are restored. The dynamics of the intact beam are therefore recovered over the investigated frequency range. Programming is performed by changing only the spacing between repulsive magnets. Each resonator can be set independently. This creates uniform, nonuniform, and graded combinations of monostable and bistable states. Experiments and simulations show marked changes in both vibration attenuation …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":113},{"title":"Lattice Distortion‐Triggered Cu─O─Ce Synergistic Sites Coupled With Machine Learning for Intelligent Multi‐Pesticide Recognition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78690?af=R","doi":"10.1002/adfm.78690","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":[],"authorMore":false,"abstract":"Cu-doping-driven lattice distortion in CeO₂ triggers abundant oxygen vacancies and engineered Cu–O–Ce dual-functional sites for the simultaneous electrocatalytic recognition of distinct pesticides. The optimized Cu-CeO₂ /CC sensor achieves extremely wide linear ranges for Chlorantraniliprole and Carbendazim. Integrated with embedded machine learning algorithms and a portable smartphone platform, the system delivers high-accuracy multiplexed classification and robust real-time quantitative screening. ABSTRACT Non-enzymatic electrochemical sensors have emerged as highly promising platforms for pesticide monitoring, favored for their rapid response, cost-effectiveness, and robust …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-07","tkey":"other","id":114},{"title":"Deep Learning for AD Risk Screening and Progression Prediction","url":"https://doi.org/10.1002/advs.78537","doi":"10.1002/advs.78537","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-05","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Bin Lu","Yan‐Rong Chen","Rui‐Xian Li","Ming‐Kai Zhang","Shao‐Zhen Yan","Guan‐Qun Chen"],"authorMore":false,"abstract":"ABSTRACT The rise of Alzheimer's disease (AD) immunotherapies underscores the need for accessible, time‐efficient biomarkers for early diagnosis. MRI‐based deep learning shows promise in this regard, yet few models have undergone comprehensive clinical validation. Using the SILCODE cohort (722 Chinese participants, 1,105 scans), we test the transportability of our classifier (pretrained on Western samples) to an independent Chinese cohort without retraining. The associations between risk scores and disease progression, cognitive performance, and plasma biomarkers are examined. In addition, an interpretable framework is developed to generate individualized brain risk maps and identify …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-06","tkey":"other","id":115},{"title":"Accelerating High‐Fidelity Airfoil Design via Physics‐Informed Video Diffusion Model","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78532?af=R","doi":"10.1002/advs.78532","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"深度学习","topics":["深度学习"],"matchTerm":"diffusion model","matchWhere":"标题：diffusion model","score":6,"authors":["Yifeng Ai","Yijia Guo","Hongfu Zhang","Lei Zhou","Tiejun Huang","Weiqiu Chen"],"authorMore":true,"abstract":"Physics-informed video diffusion enables rapid inverse aerodynamic design by mapping target lift-to-drag response to airfoil geometries and full-field flow distributions. Trained on 53 400 DNS samples, the model achieves over 90% fidelity with ∼30 s inference, while experimentally realized propeller designs demonstrate a practical pathway from aerodynamic targets to manufacturable structures. ABSTRACT Airfoil design remains a challenging multi-objective optimization problem requiring precise geometric control for optimal aerodynamic performance. Data-driven inverse design methods mitigate this complexity but often yield non-physical results when physical constraints are not explicitly …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"other","id":116},{"title":"BraMARS: An Interpretable Histopathology‐Driven Deep Learning Model for Brain Metastasis Risk Stratification in Surgically Resected Limited‐Stage SCLC","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77075?af=R","doi":"10.1002/advs.77075","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":[],"authorMore":false,"abstract":"This study presents BraMARS, an explainable deep learning model that estimates future brain metastasis risk in surgically resected limited-stage small-cell lung cancer using routine H\u0026E-stained whole-slide images. By linking model-attributed spatial histopathology with clinical outcomes and proteomic programs, BraMARS provides a biologically interpretable framework for individualized intracranial risk assessment, with potential to inform prophylactic cranial irradiation discussions, MRI surveillance strategies, and future brain metastasis prevention studies. ABSTRACT Brain metastasis (BM) is a major cause of mortality in limited-stage small-cell lung cancer (LS-SCLC). Prophylactic cranial …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"other","id":117},{"title":"Laminar Boundary Layer Mass Transport‐Guided Machine Learning for Precision Density Regulation of Horizontal Carbon Nanotube Arrays","url":"https://doi.org/10.1002/adfm.79421","doi":"10.1002/adfm.79421","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-03","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Jin Gao","Yuming Wang","Shanbin Zhang","Jiacheng Song","Xiaoling Tong","Ran Du"],"authorMore":false,"abstract":"ABSTRACT Horizontally aligned carbon nanotube (HACNT) arrays are essential building blocks for next‐generation carbon electronics. However, precise control over the density of HACNT remains a formidable bottleneck due to the complex, nonlinear coupling of multi‐physical parameters. To address this challenge, we propose a machine learning (ML) workflow that incorporates boundary layer fluid dynamics (BLFD). Conventional high‐dimensional growth parameters are condensed into a concise feature space dominated by two physics‐informed descriptors: mass transfer coefficient (K m) and residence time (t). This kinetics‐informed feature set significantly improves HACNT density prediction, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":118},{"title":"Attribution Fingerprinting by Interpretable Machine Learning Reveals Category‐Specific Additive Design Rules for Zinc Anodes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75609?af=R","doi":"10.1002/adma.75609","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Guolang Zhou","Minmeng Tang","Xinwang Xu","Xin Tang","Tianshi Wang","Chong Zhao"],"authorMore":false,"abstract":"Molecule-specific SHAP attribution profiles serve as attribution fingerprints that resolve zinc-electrolyte additives into three attribution-based categories. Category I screening identifies 2-fluoropyridine-5-carbaldehyde, whose predicted cycle life of 3218 h is confirmed experimentally within 6.5% (3010 h). Structural controls trace the improvement to the aldehyde group, and Zn//MnO₂ full cells retain 96% capacity over 4000 cycles. ABSTRACT Electrolyte additives are one of the most direct remedy for interfacial instability in aqueous zinc-ion batteries, yet their development remains empirical. Existing machine-learning (ML) screening strategies presume a single global structure-property …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":119},{"title":"Deep Learning‐Powered Plasmonic Platform for Decoding Dynamic Protein Aggregation Landscapes in Parkinson's Disease Progression","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74985?af=R","doi":"10.1002/adma.74985","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":[],"authorMore":false,"abstract":"α-Syn protein aggregates of varying supramolecular sizes are present in the serum of individuals with unknown status. These aggregates are translated into distinct scattering signatures via immunoaffinity induced immunogold clustering in the PANDA system. The resulting data are processed by a deep learning network to classify individuals into healthy ones, mild PD, or moderate PD with superior accuracy. ABSTRACT In-depth characterization of pathological protein aggregate with its subcomponents is pivotal for early diagnosis and staging of neurodegenerative disorders. Here, we introduce the Protein Aggregate NanoDynamics Analyzer (PANDA), a plasmonic nanotechnology-powered system that …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":120},{"title":"Machine Learning‐Assisted Soft Sensors: From Material Design to Motion Recognition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78483?af=R","doi":"10.1002/adfm.78483","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Hongbiao Sun","Shengkang Fu","Yanfeng Hou","Jiawei Liu","Yan Yang","Chengliang Tao"],"authorMore":true,"abstract":"This review establishes a unified framework linking soft-sensor working principles, material and structural design, signal quality, and machine-learning strategy selection. By relating sensing fidelity, separability, temporal stability, and cross-session consistency to suitable algorithms, it clarifies how reliable motion recognition can be achieved in healthcare, soft robotics, and human–machine interaction. ABSTRACT The development of soft electronics provides reliable performance under deformation, excellent adaptability to irregular surfaces, and superior comfort for wear. Their deployments offer solutions to address the challenges of harsh signal acquisition conditions, poor wearing …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-03","tkey":"other","id":121},{"title":"Field‐Driven Proton Transport in Water Revealed by Machine Learning Molecular Dynamics","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78513?af=R","doi":"10.1002/advs.78513","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-29","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Alicia van Hees","Zhan‐Yun Zhang","Linnéa Andersson","Chao Zhang"],"authorMore":false,"abstract":"Using a reactive and polarizable machine-learning molecular dynamics (MLMD) framework, the authors show that excess-proton drift remains nearly linear with applied electric field up to 0.15 V/Å. It is also found that the protonic defect mitigates the field-induced structural changes observed in neat water, revealing a distinct high-field response of protonated water. ABSTRACT Excess-proton transport in water arises from the coupling of proton transfer (PT), hydrogen-bond rearrangement, and solvent polarization. While equilibrium Grotthuss diffusion has been widely studied, its response under strong electric fields remains difficult to resolve because simulations must capture both chemical …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-30","tkey":"other","id":122},{"title":"ReLink: Reliable Deep Learning for Microscopic Motion Tracking","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78541?af=R","doi":"10.1002/advs.78541","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Yuan Jiang","Xiaochen Feng","Hongda Wei","Hao Sha","Hongpeng Wang","Min Zhang","Sanyang Han","Yongbing Zhang"],"authorMore":false,"abstract":"ReLink enables reliable trajectory linking in single-particle tracking by integrating physics-informed motion statistics with confidence-based adaptive filtering. Across diverse simulated and experimental conditions, ReLink robustly reconstructs trajectories and preserves the fidelity of downstream analyses, enabling accurate characterization of microscopic dynamics from physically verifiable free diffusion to complex intracellular anomalous diffusion. ABSTRACT Single-particle tracking (SPT) serves as a fundamental technique for deciphering complex microscopic dynamics in biological and physical systems by resolving trajectories of individual particles. However, linking localizations into …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":123},{"title":"Robust Stitching Interface and Deep Learning Empowered Hydrogel Human‐Machine Interface","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77052?af=R","doi":"10.1002/advs.77052","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":[],"authorMore":false,"abstract":"A molecular design strategy is presented that exploits synergistic carboxylate anion–quaternary ammonium interactions to simultaneously strengthen the hydrogel–PET interface and the bulk hydrogel network. Integrated with deep learning signal processing, the stable hydrogel–PET interface enables consistent signal acquisition and reliable human-machine interaction under prolonged dynamic operation. ABSTRACT Mechanical mismatch and weak interfacial adhesion between hydrogels and encapsulation layers, particularly polyethylene terephthalate (PET), remain the primary cause of signal distortion in dynamic sensing applications. We address this through a molecular design strategy that exploits …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":124},{"title":"Sustained Self‐Powered Real‐Time Vibration Monitoring Through Integrated Nonlinear Harvesting and Energy‐Aware Wireless Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76967?af=R","doi":"10.1002/advs.76967","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"智能传感","topics":["智能传感","压电材料"],"matchTerm":"self-powered sensing","matchWhere":"摘要：self-powered sensing、摘要：piezoelectric","score":6,"authors":[],"authorMore":false,"abstract":"A self-powered vibration sensing platform integrates a quasi-zero-stiffness piezoelectric harvester, synchronized electric charge extraction, energy management, and wireless ADC acquisition. Ambient vibration is simultaneously harvested as energy and digitized as information, enabling sustained real-time waveform monitoring without external power. The system bridges nonlinear energy harvesting and energy-aware electronics to transform irregular mechanical inputs into continuous sensing. ABSTRACT Continuous high-frequency data acquisition is critical for advanced structural monitoring and data-driven systems, yet remains limited by the insufficient energy budget of self-powered sensing. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":125},{"title":"Active Learning for Data‐Efficient Optimization of Entangled Granular Metamaterials (Adv. Funct. Mater. 86/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78669?af=R","doi":"10.1002/adfm.78669","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"active learning","matchWhere":"标题：active learning","score":6,"authors":["Peng Wang","Gaoyan Shi","Xin Bian","Yu Guo"],"authorMore":false,"abstract":"AI-Empowered Design of Granular Metamaterials An active learning scheme combining a Supervised Graph Wasserstein Autoencoder with Langevin-based stochastic optimization is developed to identify optimal shapes of elongated, non-convex particles that self-assemble into strong, free-standing structures with maximized yield stress. This work establishes a data-efficient paradigm for optimizing granular metamaterials. More details can be found in the Research Article by Xin Bian, Yu Guo, and co-workers (DOI: 10.1002/adfm.77723).","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":126},{"title":"Discovery of Multicomponent Invar Materials With Low Thermal Expansion, High Curie Temperature, and Superior Phase Stability Assisted by Active Learning","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74942?af=R","doi":"10.1002/adma.74942","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"active learning","matchWhere":"标题：active learning","score":6,"authors":[],"authorMore":false,"abstract":"An interpretable active-learning framework navigates a multicomponent Fe─Co─Ni─Cr─Mn space to identify and experimentally refine a productive low-thermal-expansion basin. The resulting FCC Invar alloy combines near-zero expansion over a broad temperature range with a Curie temperature of about 580 K and good ductility, demonstrating a property-first route to accelerated alloy discovery. ABSTRACT Zero thermal expansion (ZTE) materials provide exceptional dimensional stability under temperature fluctuations, making them indispensable for high-precision instrumentation and extreme environments. However, their natural scarcity, combined with the vast compositional space in multicomponent …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":127},{"title":"Distributed Haptic Chips With Materials’ Multifunctionalities for Dual‐Way Tactile Communication Enabled Terrain Recognition and Reconstruction in Robotic Teleoperation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78287?af=R","doi":"10.1002/adfm.78287","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-24","topic":"智能传感","topics":["智能传感","压电材料"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive、摘要：piezoelectric","score":6,"authors":["Minglu Zhu","Junyi Chen","Xinyu Wang","Ke Chen","Kuihan Chen","Chang Li"],"authorMore":true,"abstract":"A haptic chip utilizes the multifunctionality of laser induced graphene and silicone materials for multi-modal tactile sensing, and haptic feedback is present for the application of teleoperating robots with terrain recognition and reconstruction functions. The modular and distributed design of the haptic chip system ensures compatibilities in different tasks. ABSTRACT Current robotic teleoperations rely on vision-based detection and feedback of the operation environment. Establishing dual-way tactile sensing and feedback remains challenging for improving comprehensive status awareness. Here, with the aid of laser induced graphene and silicone materials, we present a haptic chip capable of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":128},{"title":"Interpretable Deep Learning of Molecule‐Solvent Interactions Using a Solvatochromic Subgroup Contribution Framework","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77347?af=R","doi":"10.1002/advs.77347","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Jinyong Park","Minhi Han","Kiwoong Lee","Seokwoo Kim","Sungnam Park"],"authorMore":false,"abstract":"Chemistry-informed deep learning (DL) models based on the solvatochromic subgroup contribution (SSC) framework predict and interpret solvent-dependent spectral shifts, revealing physically meaningful subgroup-solvent interactions. ABSTRACT Solvent effects critically influence the photophysical and optical properties of molecules in solution, yet a quantitative and interpretable description of solvent effects remains a long-standing challenge. In this study, to quantitatively understand and chemically interpret solvatochromism, deep learning (DL) models based on the solvatochromic subgroup contribution (SSC) framework were introduced, which describes solvatochromic shifts through localized …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":129},{"title":"A Bioinspired, Multimodal Soft Tactile Skin with Task‐Adaptive Perception for Intelligent Robotic Manipulation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77230?af=R","doi":"10.1002/advs.77230","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"random forest","matchWhere":"摘要：random forest、摘要：tactile sensors","score":5,"authors":["Yu‐Jin Lee","Hyeonung Kang","Ju Yeon Woo","Daekyum Kim","Chang‐Soo Han"],"authorMore":false,"abstract":"Perception in robotic manipulation improves through the cooperative and complementary operation of biologically inspired multimodal tactile sensors. Receptor-specific contribution analysis identifies which sensing modalities are required for specific tactile tasks. The results demonstrate that artificial mechanoreceptor pathways operate in a task-adaptive manner, enabling rational sensor selection and adaptive slip control. ABSTRACT Achieving human-like tactile perception is essential for robotic systems to perform fine manipulation and adapt to dynamic environments. However, most tactile sensors have deviated from the physiological encoding based on human mechanoreceptors. Here, we present …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":130},{"title":"Triple‐Phase Synergistic Bulk‐Surface Engineering Enables High‐Rate and Long‐Cycling P2/O3‐Based Cathode for Na‐Ion Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74956?af=R","doi":"10.1002/adma.74956","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocking","matchWhere":"摘要：interlocking","score":5,"authors":["Peicai Li","Xubin Wang","Bowen Wang","Han Tang","Ting Lin","Han Hu","Qinghua Zhang","Xiaohui Rong","Yong‐Sheng Hu","Zhongtao Li"],"authorMore":false,"abstract":"A triple-phase synergistic bulk-surface engineering strategy is developed for high-voltage Na-ion battery cathodes. Bulk multielement modulation constructs a P2/O3 biphasic structure with an interlocking effect to suppress strain. Surface reconstruction forms a protective disordered phase, preventing side reactions and microcracks. The resulting cathode achieves exceptional cycling stability and rate capability. ABSTRACT Layered oxide cathodes hold great promise for Na-ion batteries (NIBs) but suffer from rapid performance degradation under high voltage, primarily arising from severe lattice strain, transition metal migration, and detrimental surface degradation. Here, we report a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":131},{"title":"High‐Sensitivity Self‐Sensing Hydrogels With Reconfigurable Island–Bridge Networks for Human–Machine Interaction and Intelligent Bioinspired Recognition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78602?af=R","doi":"10.1002/adfm.78602","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning、摘要：self-sensing","score":5,"authors":[],"authorMore":false,"abstract":"A micro-/nanoscale collaborative island–bridge conductive network of liquid metal and carbon nanotubes is embedded within a thermal-responsive hydrogel, enabling highly sensitive strain sensing and precise actuation self-sensing through reversible modulation of conductive pathways. The resulting hydrogel integrates sensing and actuation within a single material platform, enabling intelligent human–machine interaction and bioinspired tactile recognition. ABSTRACT Intelligent hydrogel actuators with self-sensing capabilities have shown broad prospects in flexible electronics, bioinspired robotics, and human–machine interaction. However, most reported self-sensing hydrogel actuators still …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":132},{"title":"Cross‐Scale Decoupling of Mechanics and Kinematics in Chiral Tensegrity Metamaterials","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75656?af=R","doi":"10.1002/adma.75656","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-05","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocking","matchWhere":"摘要：interlocking","score":5,"authors":["Qi Wen","Meiling Zhang","Zhenyu Wang","Zhihui Zhang","Chaozong Liu","Songyu Zhang"],"authorMore":false,"abstract":"A chiral three-rod tensegrity cell (CTTC) establishes a cross-scale dual-decoupling strategy for compression-torsion metamaterials. Mechanical decoupling enables 97° torsion with robust cyclic durability, while kinematic decoupling preserves internal rotation under constrained boundaries. Integrated prestress programmability further expands functional versatility, offering a pathway toward adaptive metamaterial systems operating under constrained environments. ABSTRACT Compression-torsion metamaterials (CTMs) that break spatial inversion symmetry face persistent trade-offs among large deformation capacity, intrinsic stiffness, and fatigue durability. Crucially, boundary rotation induced by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":133},{"title":"Amorphous–Nanocrystalline Silicate–Superalloy Heterointerfaces Combining High‐Temperature Electrical Insulation with Large‐Strain Tolerance","url":"https://doi.org/10.1002/adfm.79412","doi":"10.1002/adfm.79412","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-30","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":["Lida Xu","Shilong Jia","Yuelong Li","Ning Wang","Rui Liang","Qinnan Chen"],"authorMore":true,"abstract":"ABSTRACT The key bottleneck in in situ monitoring of nickel‐based superalloy hot‐section components is the lack of a reliable insulating interface for oxidative and thermomechanical extremes. Conventional ceramic insulating layers and multilayer architectures remain constrained by complex processing, interfacial mismatch, limited strain tolerance, and brittle failure. Here, we report a directly printable amorphous–nanocrystalline silicate coating that enables a robust multifunctional interface on nickel‐based superalloys without additional bonding or transition layers. During annealing, the printed silicate layer densifies, locally crystallizes, and wets the superalloy surface, producing an …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":134},{"title":"Robust, Highly Extensible, and Conformally Self‐Adhesive Ionogels Enabled by Spiderweb‐Inspired Supramolecular Topology","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78449?af=R","doi":"10.1002/adfm.78449","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocking","matchWhere":"摘要：interlocking","score":5,"authors":["Chengyu Wang","You Lu","Weicheng Zhao","Jin Zhang","Yebang Tan"],"authorMore":false,"abstract":"Addressing the trade-off between robustness and both conformality and extensibility of ionogels, this work proposes a spiderweb-inspired supramolecular topology strategy. Host-guest interactions assisted radial 8-arm topology structures enhance the toughness and extensibility without increasing the skin-conformal modulus, and P(DMAA- co -HVIm)/[HMIm]Br spiral chains enable recyclable topological ionogels for conformally self-adhesive applications, even under dynamic and mechanically demanding conditions. ABSTRACT Ionogels have attracted significant interest in bioelectronics and soft robotics owing to their eco-friendly stability and adhesion. However, conventional ionogels face an inherent …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":135},{"title":"Broadband Convolutional Processing Perception‐Memory‐Computation InSe Neuromorphic Vision Device for High‐Accuracy Recognition of Color Images","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78335?af=R","doi":"10.1002/adfm.78335","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"深度学习","topics":["深度学习","压电材料"],"matchTerm":"neural network","matchWhere":"摘要：neural network、摘要：PZT","score":5,"authors":[],"authorMore":false,"abstract":"Under positive and negative biases, the InSe ferroelectric transistor exhibits symmetric positive and negative photoconductances, which can be utilized for the high-accuracy recognition of color images. ABSTRACT Broadband convolution processing is critical for accurate color image recognition. However, current broadband convolution processing involves a photoresponse matrix based on continuous-voltage modulation devices, resulting in high energy consumption. Here, we demonstrate an InSe neuromorphic device that integrates broadband convolutional processing with perception, memory, and computation functions to realize high-accuracy recognition of color images with the potential for low …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":136},{"title":"Vectorial Slip‐Touch Perception Enabled by Sliding‐Gated Charge Carrier Dynamics","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78455?af=R","doi":"10.1002/adfm.78455","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：triboelectric","score":5,"authors":["Chongxiang Pan","Hongxiang Xue","Hao Sun","Zi Hao Guo","Jing Wang","Yutong Song","Fuchun Sun","Zhong Lin Wang","Xiong Pu"],"authorMore":false,"abstract":"Enabled by sliding-gated charge carrier dynamics, a monolithic, array-free robotic skin intrinsically decouples multidimensional tactile stimuli to achieve high-fidelity slip-touch perception. Bypassing traditional dense sensor arrays and complex inverse computations, this hardware-minimalist, in-sensor encoding strategy facilitates real-time robotic manipulation via computationally lightweight algorithms, providing a scalable physical foundation for next-generation embodied intelligence. ABSTRACT High-dimensional tactile perception is essential for dexterous robotic manipulation, but is severely constrained by the hardware-stacking of pixelated arrays or the computational latency of …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":137},{"title":"Deformation‐Robust Multimodal Electronic Skin Enabled by Conformal Surface Plasmons for Cross‐Medium Robotic Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79263?af=R","doi":"10.1002/adfm.79263","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：piezoresistive","score":5,"authors":["Yongze Li","He Gao","Lang Yuan","Ting Cui","Minglu Zhu","Jian He"],"authorMore":true,"abstract":"An ultrathin deformation-robust e-skin unifies a five-channel piezoresistive network and a conformal surface plasmon waveguide within one flexible interdigitated-electrode architecture. It maps grasp pressure, perceives approaching targets before contact, and interrogates concealed substances through dielectric barriers. Frequency-resolved microwave fingerprints, interpreted by machine learning, reveal cross-medium material identity during dexterous robotic manipulation. ABSTRACT Electronic skins (e-skins) generally transduce contact mechanics but cannot interrogate materials concealed by packaging, limiting robotic perception to accessible surfaces. A multimodal cross-medium e-skin is …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":138},{"title":"Mechanical Programming of PEGDA‐β‐CD Polyrotaxane‐Based Hydrogels via Host–Guest Molecular Recognition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77853?af=R","doi":"10.1002/adfm.77853","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":[],"authorMore":false,"abstract":"A mechanically programmable hydrogel for tissue engineering is developed by modulating the molecular threading density of poly(ethylene glycol) diacrylate- β -cyclodextrin (PEGDA- β -CD) polyrotaxane and combining it with β -CD-modified gelatin. The polyrotaxane-guided transition from disordered pores to laminar microstructures enables precise tuning between high elasticity and high damping. Hydrogels ideally accelerate wound healing in vivo due to their biocompatibility and proper mechanical properties. ABSTRACT Polyrotaxane-based hydrogels with mechanically interlocked structures offer unique opportunities for designing biomaterials with tunable mechanical properties in tissue …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":139},{"title":"Decoupled Temperature‐Pressure Sensing via Hierarchical Porous Sponge for Thermo‐Tactile Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78367?af=R","doi":"10.1002/adfm.78367","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：piezoresistive","score":5,"authors":["Jiachen Dong","Bo Xu","Hongyu Mi","Xin Zhao","Yuqing Zhai","Yongqi Zhu"],"authorMore":true,"abstract":"A hierarchically porous PDMS/CNT sponge sensor was fabricated via a template method. It converts pressure and temperature into independent resistance and voltage signals via piezoresistive and thermoelectric effects, physically avoiding crosstalk. Benefiting from excellent compressibility, thermal insulation, and conductivity, it achieves high sensitivity, fast response, and outstanding durability for electronic skin and motion detection even under complex mechanical stimuli. ABSTRACT Precise and crosstalk-free discrimination of pressure and temperature remains a fundamental challenge in artificial sensory systems due to the intrinsic coupling of mechanical and thermal transduction. Herein, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":140},{"title":"Embedded Direct Ink Writing of Thermoset and Elastomeric Polymers via Frontal Polymerization","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78142?af=R","doi":"10.1002/adfm.78142","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":[],"authorMore":false,"abstract":"Embedded frontal polymerization direct ink writing (FP-DIW) combines frontal ring-opening metathesis polymerization with embedded 3D printing to decouple deposition from curing. A yield-stress support bath stabilizes low-viscosity inks, while on-demand thermal initiation enables controlled front propagation. This approach expands the accessible feature size, geometry, and material range beyond conventional FP-DIW in air. ABSTRACT Direct ink writing (DIW) using frontal ring-opening metathesis polymerization (FROMP) enables rapid, energy-efficient fabrication of thermoset and elastomeric architectures through a self-propagating exothermic curing reaction. However, FP-DIW is constrained by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":141},{"title":"Patient‐Derived Glioblastoma Organoids for AI‐Guided Prediction of Therapeutic Response","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78202?af=R","doi":"10.1002/advs.78202","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：neural networks","score":4,"authors":["Sandbhor Puja","Arun Bhavyadharshini","John Geofrey","Mudliyar Siddharth","Ghanekar Shubham","Moyiadi Aliasgar"],"authorMore":false,"abstract":"Patient-derived glioblastoma organoids provide clinically relevant models that preserve tumor heterogeneity and enable integrated AI-driven analysis of imaging, molecular, and treatment-response data. Their convergence with advanced analytics supports predictive, personalized therapeutic strategies and may accelerate translation from patient-specific models to precision treatment decisions. ABSTRACT Glioblastoma (GBM) remains one of the most treatment-refractory brain tumors, with poor survival driven by intratumoral heterogeneity, adaptive therapy resistance, and an immunosuppressive microenvironment that conventional preclinical models have failed to capture. Although these systems offer …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":142},{"title":"Flexible High‐Speed Low‐Noise Organic Photodiode Arrays for Dynamic Near‐Infrared Imaging","url":"https://doi.org/10.1002/adma.75605","doi":"10.1002/adma.75605","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-03","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：neural network","score":4,"authors":["Tingting Guo","Yu Zhu","Zhe Zhang","Ruiman Han","Hanzhe Shi","Haoyu Li"],"authorMore":false,"abstract":"ABSTRACT Organic photodiodes (OPDs) hold significant promise for next‐generation IoT optical sensing and low‐power imaging applications. However, widespread application of OPD in flexible and dynamic imaging has been constrained by high dark current, poor stability, and the lack of a cost‐effective imaging system. In this work, we present an integrated solution through tailoring pseudo‐planar heterojunction (PPHJ) OPD arrays and a customized, rapidly accessible imaging system, the dynamic organic photonics imaging system (DOIS). The resulting PPHJ OPD exhibited a high responsivity (0.6 A W −1 at 868 nm), low dark current (1.5 × 10 −8 A cm −2 at −1 V) and fast response time (480 ns), …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":143},{"title":"Artificial Intelligence Meets Micro/Nanorobotics","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74721?af=R","doi":"10.1002/adma.74721","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：deep learning","score":4,"authors":[],"authorMore":false,"abstract":"Artificial intelligence is transforming micro- and nanorobots from externally controlled, task-specific machines into adaptive, autonomous systems. Machine learning, multimodal perception, digital twins, AI-guided materials and geometry design enhance propulsion, localization, decision-making, whichaccelerates clinical and environmental applications including targeted delivery, diagnostics, biosensing, remediation, and pollutant capture. ABSTRACT Microrobots and nanorobots are a developing technology, which evolved from simple “motoric” motion-capable micro/nanomachines to physical machine intelligence capable of communicating with each other using chemical or physical signals. Meanwhile, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":144},{"title":"An Integrated Artificial Intelligence Framework for Nanomedicine Engineering","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78125?af=R","doi":"10.1002/advs.78125","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：neural networks","score":4,"authors":["Meichen Dong","Qin Luo","Xinyi Ding","Chaoqi Lu","Ru Zhang","Qingqing Tan"],"authorMore":true,"abstract":"This review outlines a closed-loop AI ecosystem for nanomedicine engineering. By synergizing multimodal data harmonization, objective-driven AI architectures, and automated high-throughput validation, this “Design-Make-Test-Analyze” (DMTA) workflow transforms traditional heuristic formulation into a predictive, self-optimizing paradigm, accelerating the translation of next-generation nanotherapeutics. ABSTRACT The translation of nanomedicines is frequently bottlenecked by trial-and-error optimization. Integrating artificial intelligence (AI) transforms this process into a closed-loop, experimentally grounded discovery ecosystem. This Review provides a roadmap for this paradigm, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":145},{"title":"Decoding Tumor Metabolic Dysregulation Through Single‐Cell Analysis Informs the Inverse Design of Therapeutic Nanozymes","url":"https://doi.org/10.1002/adma.75692","doi":"10.1002/adma.75692","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-13","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Yimeng Wang","Hanchao Lin","Weiwei Gao","Yonghui Gao","Hongyu Lin","Linzi Zeng"],"authorMore":true,"abstract":"ABSTRACT Single‐node interventions often fail against tumor metabolic networks due to dynamic compensation and pathway redundancy, necessitating synergistic, multi‐node strategies. However, translating high‐dimensional single‐cell omics into physicochemical parameters for materials design remains a major challenge. Herein, a cross‐scale inverse design paradigm for therapeutic nanozymes is proposed that maps single‐cell metabolic demands onto quantum‐chemical descriptors. Using hepatocellular carcinoma (HCC) as a model, integrated single‐cell transcriptomic and metabolic flux analyses revealed a triple vulnerability network involving lactate accumulation, focal hypoxia, and oxidative stress …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":146},{"title":"Inverse Design of Pre‐Strain via a Predictive Electromechanical Model for Enhanced Strain Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77146?af=R","doi":"10.1002/advs.77146","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive","score":3,"authors":[],"authorMore":false,"abstract":"An analytical electromechanical model rooted in microcrack evolution mechanics is globally calibrated from only eight pre-strain datasets, enabling prediction of the complete sensing response at untested pre-strain values within the calibrated design space (R 2 \u003e 0.99). Coupled with uncertainty-penalized multi-objective optimization, the framework inversely identifies the optimal pre-strain for smart-tire sensors, validated across 91 operating conditions. ABSTRACT Pre-strain engineering is widely employed to enhance the sensitivity of flexible piezoresistive sensors, yet empirical pre-straining inevitably triggers severe trade-offs among sensitivity, linearity, hysteresis, and effective …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":147},{"title":"Freestanding Hierarchical‐Porous BCZT Thin Films Enable Efficient Ultrasonic Energy Harvesting in Soft Tissue","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77409?af=R","doi":"10.1002/advs.77409","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":[],"authorMore":false,"abstract":"Freestanding hierarchical-porous BCZT thin films integrate a compliant porous surface with a dense piezoceramic backbone to balance mechanical reliability, voltage sensitivity, and acoustic coupling. The films enable stable wearable pulse-wave monitoring and enhanced tissue-coupled ultrasonic energy harvesting, offering a promising route toward soft biointegrated sensors and ultrasound-powered implantable electronics. ABSTRACT Excellent electromechanical properties of piezoceramic thin films facilitate ultrasonic energy harvesting in bioelectronic systems. However, most piezoceramic thin films are fragile and cannot maintain mechanical integrity under deformation, hindering their …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":148},{"title":"Spontaneous Interfacial Redox Enables Spatiotemporally Registered Visual‐Tactile Interfaces","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78819?af=R","doi":"10.1002/adfm.78819","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive","score":3,"authors":[],"authorMore":false,"abstract":"This paper proposes a strategy based on thermodynamically driven spontaneous redox kinetics. It accelerates the electrochromic response to 460 ms by leveraging the built-in galvanic cell potential, resolving the kinetic mismatch challenge in tactile-visual interfaces. The electromagnetically quiescent mechanism enables interference-free vertical integration with high-density piezoresistive arrays. Through multimodal feature fusion, it significantly enhances recognition security in human-machine interaction systems. ABSTRACT Visual-tactile interfaces that provide simultaneous optical feedback and pressure mapping are hindered by mismatched ion-electron transport timescales and electrical …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":149},{"title":"Light‐Assisted Sub‐Coercive Ferroelectric Programming for Reconfigurable In‐Sensor Logic","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78856?af=R","doi":"10.1002/adfm.78856","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"压电材料","topics":["压电材料"],"matchTerm":"PZT","matchWhere":"摘要：PZT","score":3,"authors":[],"authorMore":false,"abstract":"A single two-terminal ferroelectric device uses ultraviolet light to assist low-voltage polarization programming, enabling non-volatile, bidirectional control of photocurrent. By combining optical and electrical inputs, the device realizes wavelength-encoded AND, OR, and NOT logic functions, integrating sensing, memory, and processing. ABSTRACT Reconfigurable optoelectronic logic devices are attractive for in-sensor computing, yet their practical deployment is often hindered either by structurally complex heterostructures or by the limited reconfigurability of simple single-material platforms. Here, we report light-assisted sub-coercive programming in ferroelectric Pb(Zr, Ti)O₃ (PZT) thin …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":150},{"title":"Multifunctional Photochromic Piezoionic Eutectogels Through Interfacial Nanoparticle Engineering","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79591?af=R","doi":"10.1002/adfm.79591","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-powered sensing","matchWhere":"摘要：self-powered sensing","score":3,"authors":["Saúl Carrasco‐Saavedra","Alister Urain","Nerea Casado","Ilaria Abdel Aziz","Naroa Lopez‐Larrea","Domingo Rangel‐Miranda"],"authorMore":false,"abstract":"Photochromic WO₃ nanoparticles enable photoresponsive piezoionics in deep eutectic solvent-based eutectogels by coupling photoinduced electronic processes with pressure-driven ionic transport. Interfacial nanoparticle engineering enhances ionic mobility and electromechanical output, while reversible photoactivation modulates the electrical response. The resulting soft materials combine solar modulation, antifreeze stability, 3D printability, and self-powered sensing. ABSTRACT Integrating emergent optical, ionic, mechanical, and electronic functionalities within soft materials enables autonomous electronics, intelligent robotics, and adaptive human–machine interfaces. Here, we introduce …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":151},{"title":"Epitaxially Integrated Electro‐Optic KNbO3 Thin Films on Silicon","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75067?af=R","doi":"10.1002/adma.75067","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":[],"authorMore":false,"abstract":"We demonstrate the first epitaxial integration of electro-optic KNbO₃ thin films on silicon using suboxide molecular-beam epitaxy. Combining adsorption-controlled molecular-beam epitaxy, advanced characterization, and phase-field modeling, we demonstrate phase-pure crystalline films mirroring bulk crystals with robust Pockels response, enabling future silicon-integrated electro-optic, nonlinear photonic, and piezo-optomechanical technologies. ABSTRACT The absence of a native electro-optic effect in silicon remains a fundamental limitation for integrated photonics, motivating the integration of ferroelectric oxides as active materials. Here, we report the first epitaxial integration of KNbO …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":152},{"title":"Moisture‑Triggered Electricity Generation via Radiative Cooling Fiber‑Based Dressings for Accelerated Wound Healing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75140?af=R","doi":"10.1002/adma.75140","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Junyi Lu","Jiayi Mao","Hongyi Tu","Tao Liu","Zehao Wang","Yatu Cui"],"authorMore":true,"abstract":"Mechanism of the CE band-aid: The device operates by generating moisture-induced electricity through free ions from hydrolysis, the piezoelectric effect, and asymmetric dielectric constant design, while simultaneously providing cooling and moisture retention via solar reflection and mid-infrared thermal emission. It promotes wound healing through functions such as anti-inflammation, angiogenesis, and activation of the PI3K pathway. ABSTRACT Moisture-driven power generation from wound exudate provides a promising route toward in situ self-powered wound therapy. However, its performance is limited by environmental factors, especially elevated external temperatures, which impairs water …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":153},{"title":"Active Soft Hydrogels Reveal Cumulative Molecular Force Dosing in Stem Cell Fate Programming","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75184?af=R","doi":"10.1002/adma.75184","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"bistable","matchWhere":"摘要：bistable","score":3,"authors":[],"authorMore":false,"abstract":"A chemically functionalized hyaluronic acid hydrogel grafted with light-responsive CD–PNIPAM–RGD molecular actuators delivers discrete piconewton forces directly to integrins. Active molecular pulling promotes actin turnover and nuclear actin polymerization independent of substrate stiffness. Repeated force dosing is cumulatively integrated over time, driving stable and irreversible osteogenic commitment through a bistable threshold mechanism. ABSTRACT Decoupling molecular-scale mechanical signaling from bulk substrate stiffness remains a fundamental challenge in biomaterial design. Here, we develop a soft-yet-active hyaluronic acid hydrogel (∼3 kPa) grafted with near-infrared-driven …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":154},{"title":"Microenvironment Responsive Self‐Powered Hydrogel for Electro‐Inspired Regeneration of Infectious Diabetic Bone Defects","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75222?af=R","doi":"10.1002/adma.75222","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Shuyao Liu","Meihua Zhang","Yicheng Liu","Ming Lu","Xiaoqin Hu","Mengmeng Ming"],"authorMore":true,"abstract":"A self-powered MXene-based electroactive hydrogel consumes glucose and ROS in the diabetic microenvironment to generate sustained endogenous electrical signals. This autonomous system simultaneously remodels the pathological milieu, promotes osteogenic differentiation via Ca 2+ /CaMKII/PKC pathways, and disrupts bacterial metabolism, achieving potent antibacterial and bone-regenerative effects without external energy input. ABSTRACT Hyperglycemia, excessive reactive oxygen species (ROS), and bacterial infection considerably hinder the regeneration of infected diabetic bone defects. Conventional tissue-engineering strategies often lack spatiotemporal responsiveness to the pathological …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":155},{"title":"Nonvolatile Ferroelectric Control of Diffusive Spin Transport at Room Temperature in Graphene/CuInP2S6 Heterostructures","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75224?af=R","doi":"10.1002/adma.75224","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"bistable","matchWhere":"摘要：bistable","score":3,"authors":["Hao Liu","Chunxiao Wu","Fèlix Casanova","Chao Yang","Yue Zhang","Weisheng Zhao"],"authorMore":true,"abstract":"Ferroelectric polarization writes retained spin-transport states into graphene at room temperature. In a CuInP 2 S 6 -gated lateral spin valve, two programmed states produce distinct nonlocal spin signals at the same read bias, distinguishing retained-state control from ordinary electrostatic gating. Contrasting Hanle responses reveal different effective spin lifetimes and establish nonvolatile control of diffusive spin transport. ABSTRACT Nonvolatile electric control of spin transport is important for low-power spintronic applications, but remains challenging to realize. While prior work has highlighted the significance of ferroelectric control in spintronics—primarily through …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":156},{"title":"Active and Remote Visual‐Tactile Human‐Machine Interface Based on Self‐Recoverable NIR Mechanoluminescence","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75229?af=R","doi":"10.1002/adma.75229","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectricity","matchWhere":"摘要：piezoelectricity","score":3,"authors":[],"authorMore":false,"abstract":"This work presents an active and remote visual-tactile human-machine interface utilizing a self-recoverable near-infrared mechanoluminescent material, Ca 5 Ga 6 O 14 :Nd 3+. Driven by piezoelectricity, this self-powered system directly converts mechanical stimuli into intense near-infrared optical signals without requiring external power or pre-irradiation. The system demonstrates centimeter-scale deep-tissue penetration and successfully translates biomechanical stimuli into real-time, multi-directional commands for assistive vehicle driving. ABSTRACT Visual-tactile sensing offers a powerful strategy for high-resolution force detection in human-machine interfaces (HMIs), yet its deployment …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":157},{"title":"Gradient‐Conductivity Architecture Enables Synchronous Enhancement of Sensitivity and Detection Range in Multifunctional All‐Paper Sensors (Adv. Funct. Mater. 90/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79231?af=R","doi":"10.1002/adfm.79231","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensors","matchWhere":"摘要：pressure sensors","score":3,"authors":["Ao Li","Jun Xu","Dezhong Xu","Zhaohui Zhang","Jiyi Li","Daxian Cao"],"authorMore":true,"abstract":"Pressure Sensors A three-layer all-paper sensor lights up layer by layer under pressure. A stepwise conductivity gradient of MXene and in situ silver nanoparticles turns abrupt fibre contact into a cascade of conductive pathways, decoupling sensitivity from detection range without sacrificing EMI shielding. More details can be found in the Research Article by Houyong Yu and co-workers (DOI: 10.1002/adfm.77836).","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-12","tkey":"other","id":158},{"title":"Gradient‐Conductivity Architecture Enables Synchronous Enhancement of Sensitivity and Detection Range in Multifunctional All‐Paper Sensors","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77836?af=R","doi":"10.1002/adfm.77836","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive","score":3,"authors":["Ao Li","Jun Xu","Dezhong Xu","Zhaohui Zhang","Jiyi Li","Daxian Cao"],"authorMore":true,"abstract":"A gradient-engineered all-paper sensor is fabricated by integrating MXene and in situ grown AgNPs within hierarchical cellulose networks. The device breaks the sensitivity–detection range trade-off through cascaded conductive pathways, enabling ultrahigh pressure sensitivity, humidity–pressure decoupled dual-mode sensing, and outstanding EMI shielding, offering a sustainable platform for next-generation wearable electronics. ABSTRACT Paper-based sensors offer a sustainable platform for wearable electronics, yet their performance is fundamentally constrained by the intrinsic “contact-jumping” behavior of hierarchical cellulose fibers, which causes abrupt conduction transitions, early current …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-12","tkey":"other","id":159},{"title":"Localized‐Casting Enabled Humidity Sensors with Ultrahigh Sensitivity for Long‐Range Non‐Contact Respiratory Monitoring","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78705?af=R","doi":"10.1002/adfm.78705","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"压电材料","topics":["压电材料"],"matchTerm":"P(VDF-TrFE)","matchWhere":"摘要：P(VDF-TrFE)","score":3,"authors":["Zhefeng Liu","Tianhao Chen","Rui Wang","Hancong Zheng","Sha Sha","Haoyu Qi"],"authorMore":true,"abstract":"A novel localized-casting method has been demonstrated to fabricate porous PVP/LiCl/P(VDF-TrFE) humidity sensors with ultrahigh sensitivity and extended detection distance, originating from the smooth diffusion of water molecules and reversible phase separation. The proximity-controlled LED switch and the sleeping pod for apnea alerting exhibit capacities of the PLP devices in long-range respiratory monitoring and non-contact sensing. ABSTRACT Non-contact respiratory monitoring based on capacitive humidity sensors is highly desirable due to its superior comfort, but it faces challenges including attenuated signals and limited working distance. Herein, we present a high-performance humidity …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-12","tkey":"other","id":160},{"title":"Bioinspired Ultralow‐Power Flexible Electro‐Optically Configurable Synaptic Transistors: An Integrated Perception‐Processing‐Tracking Visual Chain","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78732?af=R","doi":"10.1002/adfm.78732","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Yumin Ren","Kai Zhang","Xianqiang Xie","Wenlin Shen","Guanghao Lu","Shihe Yang"],"authorMore":true,"abstract":"Inspired by the Nile tilapia visual system, a cascade perception-processing-tracking “three-in-one” visual chain architecture based on flexibly electro-optically configurable synaptic transistors is first proposed. Phenylphosphonic dichloride (PhPOCl 2) is used to facilitate favorable surface reconstruction of CsPbCl 3 QDs. The energy consumption per synaptic event is as low as 0.011 fJ. This device is promising for perceptual modules in future all-day autonomous driving. ABSTRACT Biological visual tracking closely parallels the autonomous navigation that requires motion recognition, typically progressing through a cascade of optical perception, adaptive attention, and real-time tracking. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-12","tkey":"other","id":161},{"title":"Organic‐Nanometallic Versatile Printable Multifunctional Inks","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78787?af=R","doi":"10.1002/adf
