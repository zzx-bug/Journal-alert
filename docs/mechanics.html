ng artificial skins with adaptation and sensory memory is essential for intelligent tactile perception. However, conventional transistor-based neuromorphic systems rely on energy-intensive, decoupled architectures that fundamentally constrain their …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-12","tkey":"other","id":163},{"title":"Thermoelastic Wave‐Based Logic for Mechanically Cognitive Materials","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79391?af=R","doi":"10.1002/adfm.79391","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-10","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"snap-through","matchWhere":"摘要：snap-through","score":3,"authors":["Ethan Fort","Mohamed Mousa","Mostafa Nouh"],"authorMore":false,"abstract":"A wave-based mechanical logic framework is presented that leverages thermally tunable metamaterials and integrated sensing to process vibrational loading into discrete binary states. Numerical demonstrations extend from individual gates to a full adder and mechanical clock, while experiments validate AND/OR operations, highlighting a pathway toward modular, adaptive mechanical computing. ABSTRACT Recent advances in metamaterials and fabrication techniques have revived interest in mechanical computing. Contrary to techniques relying on static deformations of buckling beams or origami-based lattices, the integration of wave scattering and mechanical memory presents a promising path toward …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":164},{"title":"Low‐Intensity Focused Ultrasound Enables Temporal Modulation of Human Midbrain Organoid Differentiation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.202600019?af=R","doi":"10.1002/advs.202600019","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":[],"authorMore":false,"abstract":"In this study, we demonstrate that low-intensity ultrasound stimulation enables temporal modulation of midbrain organoid differentiation using a modular multi-well stimulation platform. In particular, we show that ultrasound promotes the proliferation of dopaminergic progenitor cells. These findings suggest that ultrasound can serve as a supplementary mechanical cue to regulate midbrain organoid development. ABSTRACT Controlling the precise timing of biosignaling cues in complex 3D models such as organoids is critical for guiding cellular differentiation and functional maturation. Ultrasound stimulation, a next-generation neuromodulation modality, offers unique advantages due to its target …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":165},{"title":"A Dispersant‐Driven Carbon‐Binder Domains Homogeneity in High‐Energy‐Density Electrodes for Lithium‐Ion Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77293?af=R","doi":"10.1002/advs.77293","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":[],"authorMore":false,"abstract":"A polar dispersant, aromatic-functionalized polyacrylate (AFPA), enables the formation of a uniform CBD network by enhancing miscibility with PVDF and suppressing phase separation. This leads to α -phase crystallization of PVDF and aligned CNT networks within the CBD, resulting in well-connected structures that improve cohesion, electron/ion transport, and overall electrode performance in high-energy cathode. ABSTRACT Achieving high energy density in lithium-ion batteries (LIBs) requires electrodes with a high fraction of active materials. An extreme reduction of inactive components such as conductive additives and binders can limit electron transport and undermine electrode integrity, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":166},{"title":"Dual‐Responsive Hydrogels Integrate Bioelectrical Stimulation and Piezo‐Photocatalysis for Regenerative Treatment of Infected Wounds","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77132?af=R","doi":"10.1002/advs.77132","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-09","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":[],"authorMore":false,"abstract":"A wireless, dual-responsive hydrogel (PVA/(PVDF-TrFE)/BiOClBr@PDA) is developed to promote efficient regeneration of infected wounds by integrating piezoelectric stimulation with piezo-photocatalytic pathways. Under simultaneous light and ultrasonic stimulation, the hydrogel generates therapeutic electrical cues and reactive oxygen species, disrupting bacterial biofilms, attenuating inflammatory responses, promoting re-epithelialization and collagen deposition, and ultimately leading to rapid and nearly complete wound closure. ABSTRACT Infected wounds represent a formidable clinical challenge, as persistent bacterial colonization and disrupted bio-signaling collectively hinder effective …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-11","tkey":"other","id":167},{"title":"Ultrasound‐Triggered Tendon–Bone Comb With Axially Graded Electrical Gradients for Tendon–Bone Interface Integration","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75049?af=R","doi":"10.1002/adma.75049","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Xu He","Fan Wang","Si Tian","Peng Zou","Wang Han","Xinhe Li","Zijie Wang","Jindong Tan","Juan Wang","Dingqun Bai","Xiaoyu Han"],"authorMore":false,"abstract":"An ultrasound-triggered gradient microneedle (GMN) with axially graded electrical channels was developed for tendon–bone interface repair. By combining tissue-penetrating structural guidance with position-dependent piezoelectric stimulation, GMN promotes spatially ordered cartilage-to-bone regeneration, interface integration, and functional recovery. ABSTRACT Loss of electrophysiological guidance from endogenous fibrous-channeled electrical conduction critically impairs repair of the injured tendon–bone interface (TBI). Clinical analysis indicates that the inconsistent efficacy of conventional electrostimulation (ES) therapy arises from the limited penetration depth and insufficient …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":168},{"title":"Programmable Doping‐Enabled Engineering of Hydrogel Iontronics for Tailored Soft Ionic Devices","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75133?af=R","doi":"10.1002/adma.75133","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-06","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"摘要：iontronic","score":3,"authors":["Ye Rao","Yanbing Li","Shuihong Zhu","Lianfei Huang","Senxuan Tang","Jia Yi","Tianqi Fu","Zhehao Han","Youhui Lin","Huanghao Yang"],"authorMore":false,"abstract":"Meticulous fabrication of soft ionic conductors has been achieved through programmable doping, drawing inspiration from the well-established doping technologies within the semiconductor industry. By precisely fine-tuning the composition of polyelectrolytes and strategically integrating dopants, the semiconducting characteristics of hydrogel heterojunctions have been systematically investigated, aimed at creating tailored iontronic devices. ABSTRACT Soft ionic conductors with tunable mechanical properties and biological signal compatibility are essential for facilitating seamless abiotic-biotic interfaces. However, the lack of precise, scalable control over the intrinsic transport …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":169},{"title":"Defect‐Engineered N‐Doped ZnO as a Dual‐Functional Platform for PENG‐Driven Memristive Sensory Memory","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78640?af=R","doi":"10.1002/adfm.78640","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Dong‐Eun Kim","Aaron Voon‐Yew Thean","Minjae Kim","Hong‐Sub Lee","Hyung‐Ho Park","Chaeseon Hong"],"authorMore":false,"abstract":"In situ N-doped ZnO (NZO) serves as a dual-functional platform that simultaneously modulates electronic and elastic properties, integrating an interface-type memristor with a piezoelectric nanogenerator. The rectified PENG output directly programs multilevel resistance states without an external bias, enabling self-powered tactile-memory operation, Morse-code and pressure-encoded information storage, and array-level pattern recognition for energy-autonomous neuromorphic systems. ABSTRACT Energy-efficient computing is a critical challenge for artificial intelligence and edge applications. Although self-powered memory systems that integrate sensing, energy harvesting, and storage are …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":170},{"title":"A Tribo‐Chemoelectric Coupled Nanogenerator for Dual‐Modal Sensing of Salt Solutions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78643?af=R","doi":"10.1002/adfm.78643","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Chengmin Bao","Shengjie Yin","Xin Su","Suwen Xu","Ziying Liu","Chris R. Bowen"],"authorMore":false,"abstract":"The tribo-chemoelectric coupled nanogenerator (TCNG) enables highly sensitive and wide range concentration detection (0–3500 mmol·L − 1) with a sensitivity of −500.76 µA·(mol·L − 1) − 1 below 0.5 mol·L −1, while achieving 92.5% accuracy in multi-ion recognition. This work provides a feasible strategy for self-powered electrochemical sensing and offers a promising route for high-performance, on-site salt analysis within industrial and environmental settings. ABSTRACT The accurate detection of salt concentration and ionic composition is vital for chemical manufacturing and environmental monitoring. However, existing portable detectors are typically reliant on an external power supply and …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":171},{"title":"Dual‐Functional PDA/CMC‐Li Supramolecular Bridging Networks Unlock Trans‐Phase Li+ Conduction in Composite Solid Electrolytes for High‐Performance Lithium Metal Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78716?af=R","doi":"10.1002/adfm.78716","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":[],"authorMore":false,"abstract":"Dual-functional PDA/CMC-Li supramolecular bridges organize LLZAO fillers within a PVDF-HFP electrolyte, suppressing agglomeration and creating a homogeneous composite structure. Cooperative cation coordination and TFSI − anion trapping regulate the polymer/ceramic interface, reduce SCL-related polarization, and facilitate Li + transfer into the LLZAO phase. The resulting cross-phase transport network enables stable lithium plating/stripping and durable solid-state battery operation. ABSTRACT Composite solid electrolytes (CSEs) hold immense promise for high-energy-density solid-state lithium metal batteries, yet their practical application remains severely hampered by filler agglomeration …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":172},{"title":"Pillar‐Controlled Electronic Energy Barrier Reduction in Metal–Organic Frameworks for Self‐Powered Antibiotic Degradation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78721?af=R","doi":"10.1002/adfm.78721","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Long Li","Zhichao Shao","Weibing Liu","Xinyu Zhao","Xueyou Wang","Hongwei Hou"],"authorMore":false,"abstract":"Integrating highly conjugated and π-expanded structures into MOFs-based triboelectric nanogenerator, which enables a self-powered catalytic degradation system to efficiently decompose emerging organic pollutants, including antibiotics. This work thus represents a rationally designed, crystal-engineering-driven strategy that bridges high-performance energy harvesting and advanced environmental remediation. ABSTRACT Metal–organic framework materials have emerged as one of the most promising friction dielectric materials due to their highly tunable electronic structure. In this study, by regulating the intrinsic work function and polarization of the ZUT-11s framework material, electronic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-07","tkey":"other","id":173},{"title":"Snake‐Scale‐Inspired Serrated Structures With Frictional Anisotropy for Tunable Bidirectional Shear‐Force Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79497?af=R","doi":"10.1002/adfm.79497","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"智能传感","topics":["智能传感"],"matchTerm":"tactile sensor","matchWhere":"摘要：tactile sensor","score":3,"authors":["Qinggang Guo","Yumin Li","Long Zheng","Luquan Ren"],"authorMore":false,"abstract":"A bioinspired piezoresistive flexible sensor simultaneously detects normal pressure and tangential forces while distinguishing shear direction. Its serrated anisotropic architecture enables direction-dependent mechanical responses and allows the sensing sensitivity and working range to be tuned through structural design, offering a versatile platform for multidirectional tactile perception in flexible sensing and robotic interfaces. ABSTRACT Flexible tactile sensors are essential components of intelligent robotics, wearable healthcare systems, and human-machine interfaces. However, most existing tactile sensors have limited capability to discriminate the direction of tangential forces, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":174},{"title":"Mechanically‐Gated Stochastic Resonance for All‐Optical Acoustic Sensing in Noisy Environments","url":"https://doi.org/10.1002/advs.78634","doi":"10.1002/advs.78634","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-05","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"bistable","matchWhere":"摘要：bistable","score":3,"authors":["Xuyu Zhang","Minzheng Sun","Cunzheng Fan","Shuolong Zhu","Qilin Hong","Pan Xu"],"authorMore":false,"abstract":"ABSTRACT Weak signal detection in harsh and noisy environments remains a critical challenge across diverse fields. Stochastic resonance (SR) offers a counterintuitive strategy by exploiting noise to enhance, rather than suppress, weak signals, yet its practical deployment is severely limited by poor frequency selectivity, inadequate adaptability to fluctuating noise levels, and reliance on offline post‐processing. Here we report the discovery and experimental demonstration of mechanically‐gated stochastic resonance (MGSR), a novel physical mechanism that couples stochastic resonance with intrinsic mechanical resonance. By using mechanical resonance to actively modulate the bistable …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":175},{"title":"Wearable E‐Textiles for Cardiovascular Monitoring: Materials, Devices, and Integrated Systems","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77999?af=R","doi":"10.1002/advs.77999","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-04","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-powered sensing","matchWhere":"摘要：self-powered sensing","score":3,"authors":["Bangul Khan","Mahmoud Tavakoli","Norbert Radacsi","Bee Luan KHOO"],"authorMore":false,"abstract":"The graphical abstract highlights the role of conductive materials and textile fabrication techniques in enabling smart textiles for cardiovascular applications. It showcases textile-based ECG monitoring, pulse sensing, hemodynamic monitoring, and cardiovascular tissue engineering, while emphasizing the challenges and design considerations that govern device performance, wearability, and clinical translation toward personalized healthcare. ABSTRACT Cardiovascular diseases remain the leading cause of morbidity and mortality worldwide, highlighting the need for continuous, non-invasive, and reliable physiological monitoring beyond conventional clinical assessments. Smart textiles have emerged …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":176},{"title":"Bio‐Inspired Rigid‐Flexible Synergistic Nanofibrous Textiles for Mechanically Robust Radiative Cooling","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78652?af=R","doi":"10.1002/adfm.78652","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-03","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Xirui Han","Junyu Sun","Jun Tang","Shuxin Bai","Fengqi Liu","Hongbo Xu"],"authorMore":true,"abstract":"A spider silk-inspired, filler-free TPU@PVDF-HFP core-sheath film is fabricated via coaxial electrospinning, wherein dynamic hydrogen bonding mediates rigid-flexible synergy. The resulting membrane achieves high solar reflectivity (96.2%) and infrared emissivity (92.5%), delivering a maximum temperature reduction of 25.4°C, while retaining exceptional mechanical and spectral stability over 1000 stretch-release cycles. ABSTRACT Passive daytime radiative cooling (PDRC) textiles offer an efficient pathway for personal thermal management. However, the inherent conflict between optical performance and mechanical robustness remains a formidable challenge. Although elastomer-based electrospun …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":177},{"title":"Orientation‐Engineered Insulator‐Metal Transition in Vanadium Dioxide","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77134?af=R","doi":"10.1002/advs.77134","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"摘要：iontronic","score":3,"authors":["Xuanchi Zhou","Xiaohui Yao","Wentian Lu","Chunwei Yao","Xiaomei Qiao"],"authorMore":false,"abstract":"Crystallographic orientation engineering in VO₂ /TiO₂ heterostructures enables tunable insulator-metal transitions. The high-Miller-index (102) orientation breaks in-plane mirror symmetry, inducing anisotropic transport, while its inclined oxygen channels accelerate protonation kinetics. This work establishes orientation design as a powerful knob for accessing exotic correlated electronic states and advancing high-speed iontronic devices. ABSTRACT The artificial design of material microstructure in correlated oxides offers an emerging pathway for unlocking exotic electronic states through adjusting coupled order parameters. Here, we showcase the robust capability of a crystallographic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":178},{"title":"High‐Power Hybrid Nanogenerator With Multi‐Degree‐of‐Freedom Mechanical Coupling for Harvesting Water Wave Energy","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77154?af=R","doi":"10.1002/advs.77154","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":[],"authorMore":false,"abstract":"A high-power hybrid nanogenerator (HP-HNG) with multi-degree-of-freedom mechanical coupling is reported, integrating multi-directional wave energy for output to achieve 1 + 1 \u003e 2 energy harvesting. The HP-HNG achieves a peak output power of 0.764 W, corresponding to a peak power density of 127.303 W m − 3. At a wave frequency of 1 Hz, the HP-HNG delivers 111.06 mJ of energy within 5 s under pendulum + heave motion. This work demonstrates the HP-HNG's capability to simultaneously harvest multi-degree-of-freedom wave energy, providing sustainable power for future submarine cable monitoring and distributed sensing systems in the marine Internet of Things. ABSTRACT Wave energy is an important …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":179},{"title":"Lignin‐Based Supramolecular Dynamic Networks: A General Platform for Energy Harvesting and Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75521?af=R","doi":"10.1002/adma.75521","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-03","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Zhimin Kou","Meiting Liu","Fuchun Huang","Caiying Bo","Puyou Jia","Yonghong Zhou"],"authorMore":false,"abstract":"A rigid–flexible supramolecular design transforms lignin from a passive rigid filler into an active dynamic building block. The resulting ionogel synergistically integrates high stretchability, underwater adhesion, self-healing, strain sensing, and mechanical energy harvesting, overcoming the persistent trade-off between robustness and multifunctionality for sustainable flexible electronics. ABSTRACT Lignin- based ionogels are promising sustainable materials for flexible electronics, yet their development is limited by a persistent tradeoff between mechanical robustness and dynamic multifunctionality. Here, we report a rigid flexible supramolecular design strategy that transforms lignin …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":180},{"title":"Anchored Fluoro‐Shielded Solvation for Lithium Metal Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75606?af=R","doi":"10.1002/adma.75606","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Kaihua Wen","Tengsheng Chi","Junyao You","Lei Mao","Xinxin Zhu","Yan‐Bing He"],"authorMore":true,"abstract":"Anchored fluoro-shielded solvation reconstructs PVDF-based polymer electrolytes by coupling polyanionic Li + -solvate sites with fluorinated shielding segments. This design organizes anion-rich solvation networks, strengthens selective Li + transport, and generates LiF-rich solid electrolyte interphase, enabling high conductivity, wide oxidative tolerance, stable Li metal cycling, and long-term LiNi 0.8 Co 0.1 Mn 0.1 O₂ ||Li battery operation under demanding high-voltage and high-rate conditions. ABSTRACT Polyvinylidene fluoride (PVDF)-based polymer electrolytes are promising candidates for solid-state lithium metal batteries owing to their favorable overall electrochemical properties. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":181},{"title":"All‐Amyloid Functional Coacervates (Adv. Mater. 61/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75423?af=R","doi":"10.1002/adma.75423","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"摘要：iontronic","score":3,"authors":["Seyyed Alireza Hashemi","Mohammad Peydayesh","Laura Baraldi","Mohammad Arjmand","Raffaele Mezzenga"],"authorMore":false,"abstract":"All-Amyloid Functional Coacervates Interfacial complex coacervation enables artificial bioscaffolds that mimic life chemistry. In their Research Article (DOI: 10.1002/adma.74737), Seyyed Alireza Hashemi, Mohammad Peydayesh, Laura Baraldi, Mohammad Arjmand, and Raffaele Mezzenga harness oppositely charged food-derived amyloid nanofibrils to induce liquid-liquid phase separation, creating structurally tunable proteinaceous vein-like tubules, capsules, and films with functionalities spanning bioscaffolds, iontronic/electronic circuits, soft electromagnetic shielding, bio-optics, and beyond.","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":182},{"title":"TESCLA: A Fully Soft Electromagnetic Linear Actuator With Continuous Bending Enabled by Liquid‐Metal Solenoids","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74642?af=R","doi":"10.1002/adma.74642","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-sensing","matchWhere":"摘要：self-sensing","score":3,"authors":["Yeongjin Choi","Jeongnam Kim","Seongjun Koh","Yong‐Lae Park"],"authorMore":false,"abstract":"TESCLA (tubular electromagnetic soft conformal linear actuator) combines liquid-metal solenoids and compliant magnetic composites to achieve large-stroke bidirectional actuation with continuous bending. Integrated inductance-based self-sensing enables proprioceptive position estimation without external sensors, providing a versatile platform for soft robotics, biomimetic systems, and wearable haptic devices. ABSTRACT Linear actuators are widely employed in robots and wearable devices due to their capability of directly generating linear motion. Although soft actuators and flexible linear actuators have been developed to enable effective operation in various configurations, they are still …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":183},{"title":"All‐Amyloid Functional Coacervates","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74737?af=R","doi":"10.1002/adma.74737","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"摘要：iontronic","score":3,"authors":["Seyyed Alireza Hashemi","Mohammad Peydayesh","Laura Baraldi","Mohammad Arjmand","Raffaele Mezzenga"],"authorMore":false,"abstract":"This study introduces an all-amyloid interfacial complex coacervate technique that employs charge-mediated or functionalization-assisted complexation of oppositely charged food protein-derived amyloid nanofibrils to engineer functional soft constructs across multiple length scales. This versatile strategy enables the fabrication of proteinaceous vein-like tubules, bioelectronic and iontronic circuits, soft electromagnetic shields, viscoelastically tunable constructs, and bio-optical systems. ABSTRACT Electrostatic complex coacervates offer a robust pathway to convert homogeneous oppositely charged polyelectrolyte solutions into condensed structured liquids via liquid–liquid phase separation …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":184},{"title":"A Defect‐Engineered Sono‐Piezocatalytic In Situ Hydrogel for Preventing Hepatocellular Carcinoma Recurrence After Incomplete Radiofrequency Ablation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75010?af=R","doi":"10.1002/adma.75010","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Jianji Ke","Feiqi Liu","Changzheng Li","Ying Yan","Xiuan Li","Mingda Han"],"authorMore":true,"abstract":"An injectable sono-piezocatalytic hydrogel is designed to suppress hepatocellular carcinoma recurrence after incomplete radiofrequency ablation. Oxygen vacancies in a CD44-targeted Mn–Ti framework enhance ultrasound-driven generation of reactive oxygen species, which kill residual tumor cells and release the co-loaded STING agonist and anti-PD-1 antibody. The resulting cGAS-STING activation reshapes the immune microenvironment and establishes durable antitumor memory. ABSTRACT Residual tumor cells and the immunosuppressive microenvironment caused by incomplete radiofrequency ablation (iRFA) lead to hepatocellular carcinoma (HCC) recurrence. In this study, HA-V-MTO/LMP@Gel, an injectable …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":185},{"title":"Closed‐Loop Wearable Energy Management: From Biomechanical Energy Harvesting to Full‐Cycle Battery Charging","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75016?af=R","doi":"10.1002/adma.75016","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Yingjin Luo","Yingfan Chang","Andeng Liu","Yixin Dong","Guoxu Wu","Meidan Ye"],"authorMore":true,"abstract":"This work presents a closed-loop wearable energy system that impedance-matches the output of a biomechanical triboelectric nanogenerator to fiber lithium-ion batteries controlled using a constant-current–constant-voltage protocol, enabling complete electrochemical charging through human walking and autonomous operation of a GPS under intermittent real-world motion. ABSTRACT Biomechanical energy is abundant but irregular and low-grade, posing a significant challenge for wearable electronics, where existing energy-harvesting solutions are mainly limited to charging capacitors via physical storage, falling short of achieving a full chemical-charging cycle for practical batteries. To bridge …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":186},{"title":"Data‐Driven Discovery of MOF–Polymer Synergies Enabling High‐Performance Solid‐State Sodium Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75031?af=R","doi":"10.1002/adma.75031","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Si Zhao","Yiwei Lv","Lituo Zheng","Luzhuo Chen","Bing Lin","Mingdeng Wei"],"authorMore":true,"abstract":"This study demonstrate a data-driven strategy to screen a broad library of M-MOF-74 structures and identify Zn-MOF-74 as an optimal filler for PVDF-based solid electrolytes. Such electrolyte displays a high ionic conductivity of 1.02 × 10 −3 S cm −1 and transference number of 0.84, enbling stable and high-energy-density solid-state sodium batteries by coupling with layered oxide or Na 3 V 2 (PO 4) 3 cathodes. ABSTRACT Solid-state batteries (SSBs) are widely regarded as a promising next-generation energy storage technology owing to their intrinsic safety and high energy density. Solid polymer electrolytes (SPEs) have been esteemed as a cost-effective route to realize commercial SSBs, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":187},{"title":"Contact‐Electrification Induced Electromagnetic Radiation and Charge Polarization Drive Spontaneous Microdroplet Interfacial Reactions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75039?af=R","doi":"10.1002/adma.75039","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Zhenyu Wang","Erming Su","Yu Huang","Andy Berbille","Xianjin Shi","Junji Cao"],"authorMore":true,"abstract":"Triboelectric-assisted microdroplet atomization enables real-time detection of triboelectric discharge-associated electromagnetic emissions, revealing spontaneous interfacial polarization and charge-transfer dynamics. The contact-electrification field drives electron transfer and redistribution, promoting water polarization, radical generation, and subsequent heterogeneous reactions, thereby providing a new strategy for enhancing interfacial microdroplet reactivity. ABSTRACT Spontaneous chemical reactions occurring at microdroplet interfaces are fascinating and significant, yet uncovering the underlying charge interaction mechanisms remain major challenges. In this study, we integrated …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":188},{"title":"Bottom‐Stack Shear Transfer in Thin‐Film Flexoelectric Measurements","url":"https://doi.org/10.1002/adfm.79435","doi":"10.1002/adfm.79435","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Renhong Liang","Yiyao Fang","Haoyang Ding","Zhenggang Rao","Zhiguo Wang","Zhibin Wen"],"authorMore":true,"abstract":"ABSTRACT Bending‐based measurements are widely used to probe flexoelectricity in ferroelectric thin films, but the measured response is often shaped by mechanical boundary conditions beyond the intrinsic flexoelectric coefficient. Here we show that the conducting bottom stack acts as a hidden electromechanical boundary condition in mica‐supported BaTiO₃ (BTO) capacitors. Dynamic bending measurements reveal opposite bottom‐layer‐thickness dependences for two‐dimensional and oxide electrodes, while a BTO(001)/LSMO(001)/MoS 2 /mica hybrid exhibits an intermediate response at the same nominal BTO orientation as the MoS 2 ‐supported films. Interface‐resolved first‐principles calculations show …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":189},{"title":"Multiscale Structural Engineering of a Wearable Gas Sensor for Simulated Breath Ammonia Monitoring Under High‐Humidity Conditions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78613?af=R","doi":"10.1002/adfm.78613","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":[],"authorMore":false,"abstract":"Through a multiscale structural design integrating a self-supporting YSZ nanofiber network, nanoscale heterojunctions, molecular-level acidic sites, and a macroscale hydrophobic layer, a flexible and wearable gas sensor with high breathability and moisture resistance is developed. The device enables highly sensitive and selective detection of low-concentration NH₃ under high humidity and demonstrates simulated exhaled ammonia monitoring via wireless integration. ABSTRACT Wearable gas sensors capable of monitoring volatile biomarkers in exhaled breath offer a promising approach for non-invasive health monitoring. However, existing wearable sensors are hindered by insufficient sensitivity, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":190},{"title":"Robust Ferroelectricity in Chalcogenides Down to 2 nm Particles","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78631?af=R","doi":"10.1002/adfm.78631","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Zhiguo Li","Qiang Li","Hongwei Wang","Jochi Tseng","Han Wu","Kun Lin"],"authorMore":true,"abstract":"Here, we report that nano-ferroelectric SnSe has been induced by the local structure, with the polar AA stacking order triggering robust ferroelectricity down to 2 nm particles. To date, it is the smallest size of ferroelectric material among previously reported nanoparticles. This work first breaks the critical size limit in nanoparticles and provides a structural manipulation strategy to discover ferroelectrics. ABSTRACT Nano-ferroelectric materials are essential for advancing miniaturized energy converters, optoelectronics, and nonvolatile memory devices. However, the depolarizing fields of size-reduced nanoparticles will weaken or even eliminate the ferroelectric spontaneous …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":191},{"title":"Tribo‐Ionovoltaic Coupling Effect of Perovskite Schottky Junction Enables Hybrid Energy Harvesting and Multimodal Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78681?af=R","doi":"10.1002/adfm.78681","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":[],"authorMore":false,"abstract":"In this work, an ionovoltaic-triboelectric coupling strategy is proposed for the first time to enable performance modulation of perovskite-based ionovoltaic devices. The dynamic coupling of these two mechanisms confers upon the devices not only distinctive hybrid energy harvesting capability and performance enhancement, but also superior multimodal sensing functionality, positioning them as promising candidates for wearable energy and self-powered sensing applications. ABSTRACT The ionovoltaic effect in halide perovskites enables moisture-induced electricity generation, opening a new avenue for sustainable energy harvesting. However, mediocre performance and the absence of reliable …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-03","tkey":"other","id":192},{"title":"Intrinsic‐Decoupled Biomimetic Two‐Dimensional Sensing Enabled by Positive‐Negative Dielectric Heterostructures for Pressure Visualization","url":"https://doi.org/10.1002/adfm.79319","doi":"10.1002/adfm.79319","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-31","topic":"智能传感","topics":["智能传感"],"matchTerm":"tactile sensors","matchWhere":"摘要：tactile sensors","score":3,"authors":["Jingjing Li","Peng Li","Yuanhang Xu","Fujing Xie","Kaiqi Guo","Feihong Ran"],"authorMore":true,"abstract":"ABSTRACT Flexible tactile sensors capable of simultaneously emulating the multidirectional perception of human skin and realizing intrinsic force decoupling remain a critical challenge for advanced robotics and intelligent human‐machine interfaces. Inspired by the hierarchical architecture of epidermal cells, we present a two‐dimensional force sensor (TDFS) featuring a biomimetic heterostructure that enables structural separation of normal and tangential force components. Force discrimination is enabled by engineering a negative‐permittivity composite with a gradient‐modulus architecture that mechanically reduces the overlap between deformation fields induced by normal and tangential …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-31","tkey":"other","id":193},{"title":"Waveguided, Self‐Sensing Sheath–Core Liquid Crystal Elastomer Fiber Actuators","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75597?af=R","doi":"10.1002/adma.75597","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-30","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-sensing","matchWhere":"摘要：self-sensing","score":3,"authors":["Hailong Wei","Cheng Zhou","Zhoutao Li","Zhixin Wang","Futing Gao","Yuwei Tian"],"authorMore":true,"abstract":"Soft robotic systems demand fiber-form actuators merging actuation, sensing, and localized control for constrained environments. A waveguided sheath-core fiber actuator coupling a liquid crystal elastomer core with a carbon composite conductive sheath was developed. Light-induced reversible contraction up to 38% and 320-fold weight-bearing capacity enable optically addressable programmable gripping, with concurrent real-time actuation stroke readout from the resistance change of the conductive sheath. ABSTRACT Soft actuators capable of operating in confined and hard-to-access environments, while providing integrated self-sensing capabilities, are highly desired for next-generation robotic … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-31","tkey":"other","id":194},{"title":"A Superelastic Xylan‐Stabilized Liquid Metal Aerogel for Wearable Energy Harvesting and Personal Thermal Management","url":"https://doi.org/10.1002/adfm.79410","doi":"10.1002/adfm.79410","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-29","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Qiang Liu","Yin Yan","Mingguo Ma","Mingfei Li","Feng Peng","Jing Bian"],"authorMore":false,"abstract":"ABSTRACT The rapid development of wearable electronics places higher demands on materials with mechanical flexibility, sustainable energy supply, and thermal management. However, incorporating conductive fillers such as liquid metal (LM) into soft porous materials may introduce additional heat‐transfer pathways and complicate thermal management. Here, a molecular and structural engineering strategy is reported to integrate triboelectric energy harvesting with thermal insulation in a superelastic aerogel. Industrial xylan is converted into carboxymethyl xylan (CMX) through ball‐milling pretreatment and etherification, enabling stable dispersion of LM micro/nanodroplets. Subsequently, by … ✅ …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":195},{"title":"Fundamental Inhibition of Polyiodide Formation by a Site‐Separated Binder for Highly Stable Aqueous Zinc–Iodine Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75534?af=R","doi":"10.1002/adma.75534","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-29","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Guoli Zhang","Haoren Zheng","Xinkai Liang","Ping Lu","Xiao‐Xia Liu","Xiaoqi Sun"],"authorMore":false,"abstract":"A site-separated polymer binder is presented to address the polyiodide issues with iodine cathodes by fundamentally blocking their generation paths. The binder provides strong and selective binding of I 2 and I − on separated side chains and regulates their thermodynamic features, which disrupts their chemical coupling and promotes direct electrochemical conversion. Highly stable Zn-I 2 batteries are realized even with high loadings. ABSTRACT Aqueous Zn–I 2 batteries are promising for sustainable energy storage systems, yet their practical performance is severely limited by the formation and shuttling of polyiodide intermediates. Here, we report a site separation strategy to block the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":196},{"title":"Breaking the Limits of Piezo‐Photocatalysis: Pd‐O d‐p Orbital Hybridization Mediated Charge Reconstruction and Polarization Enhancement","url":"https://doi.org/10.1002/adfm.79377","doi":"10.1002/adfm.79377","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-29","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Meng Dai","Yi Ren","Shumeng Qin","Hongsheng Li","Ziye Zheng","Lihui Xiao"],"authorMore":true,"abstract":"ABSTRACT Piezo‐photocatalysis has emerged as a promising strategy to suppress charge recombination in conventional photocatalysis for the removal of refractory organic pollutants and green hydrogen peroxide (H₂O₂) production. Nevertheless, sulfide‐based piezo‐photocatalysts still suffer from weak piezoelectric response and ambiguous coupling mechanisms between atomic orbitals and polarization. Herein, we designed Pd‐doped and lattice oxygen‐modified Zn 3 In 2 S 6 piezo‐photocatalyst (Zn 3 In 2 S 6 ‐Pd‐350) by regulating d‐p orbital hybridization at Pd sites to achieve efficient piezo‐photocatalytic performance. Lattice oxygen occupies sulfur vacancies and converts Pd–S into Pd–O …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":197},{"title":"An Adaptive Dual‐Network Binder With Multiple‐Hydrogen‐Bond for Durable Aqueous Zn‐Ion Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78495?af=R","doi":"10.1002/adfm.78495","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Hongxu Zhang","Meijia Qiu","Yumeng Lu","Yanan Wang","Wanglin Li","Han Huang","Yuxuan Liang","Peng Sun","Wenjie Mai"],"authorMore":false,"abstract":"Inspired by the extracellular matrix, an adaptive dual-network binder with multiple hydrogen bonding enables balanced wettability, fast Zn 2 + transport, and suppressed cathode dissolution for durable aqueous Zn-ion batteries. ABSTRACT The practical application of aqueous Zn-ion batteries is limited by unstable cathode interfaces, sluggish Zn 2+ transport, and water-induced structural degradation. Here we report a biomimetic adaptive dual-network binder (DNB) with multiple-hydrogen-bond that simultaneously reinforces electrode mechanics, regulates interfacial wettability, and suppresses parasitic reactions. This binder integrates a hydrophobic polyvinylidene fluoride (PVDF) skeleton with a …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":198},{"title":"Electric Eel‐Inspired Janus Nanofiber Membrane With Structure‐Charge Dual Asymmetry for Efficient Moisture‐to‐Electric Conversion and Self‐Powered Intelligent Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78525?af=R","doi":"10.1002/adfm.78525","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-powered sensing","matchWhere":"摘要：self-powered sensing","score":3,"authors":["Jin Fang","Zhiwei Zhao","Yifan Zu","Qingqing Ni","Zhenzhen Xu"],"authorMore":false,"abstract":"An electric-eel-inspired structure-charge dual-asymmetric architecture establishes directional ion transport, enhancing moisture-enabled electricity generation and self-powered sensing. The coupled asymmetry provides a bioinspired route toward efficient moisture-to-electric energy conversion and intelligent perception. ABSTRACT Moisture-electric generators (MEGs) harvest the chemical potential of ambient water vapor as electricity. The central limitation is not ion generation alone, but the failure to coordinate ionic release, directional flux, and interfacial separation, allowing diffusion and back migration to dissipate the available potential. Inspired by electric eel electrocytes, we …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":199},{"title":"Single‐Sensor Vibration Sensing in Anisotropic Composites Enabled by Disordered Metasurfaces","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76951?af=R","doi":"10.1002/advs.76951","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"智能传感","topics":["智能传感"],"matchTerm":"structural health monitoring","matchWhere":"摘要：structural health monitoring","score":3,"authors":["Jianjie Zhang","Lanhe Xu","Zhongzheng Zhang","Yongbo Li","Eric Li","Asoke K. Nandi","Bing Li"],"authorMore":false,"abstract":"This work develops a single-sensor vibration sensing (SSVS) framework that integrates disordered metasurfaces with compressive sensing. Comprehensive numerical and experimental validations demonstrate that, by manipulating anisotropic guided wave propagation through metasurfaces, the proposed SSVS framework enables high-fidelity multi-source vibration localization and signal identification with a single sensor across diverse anisotropic lay-ups, complex vibration conditions, and curved structures with different curvatures. ABSTRACT Efficient vibration sensing in composite structures is often hindered by the anisotropic nature of wave propagation, which traditionally necessitates dense …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":200},{"title":"One‐Pot Direct Recycling of Spent LiCoO2 via Synergistic Binder Defluorination and Phase Reconstruction","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76961?af=R","doi":"10.1002/advs.76961","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":[],"authorMore":false,"abstract":"A Li + -DES system enables targeted defluorination and synergistic repair of spent LiCoO₂ cathodes in a single medium. The regenerated material recovers a well-ordered layered structure with a high capacity of 157.4 mAh g −1 and 83.1% capacity retention after 300 cycles, demonstrating a sustainable and efficient closed-loop recycling strategy for lithium-ion batteries. ABSTRACT Direct recycling of spent lithium-ion battery cathodes is hindered by two interdependent challenges: persistent polyvinylidene fluoride (PVDF) binder residues that block particle surfaces and incomplete structural repair of degraded layered phases. Here, we report a one-pot regeneration strategy based on a Li + …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":201},{"title":"Latent Diffusion Process With Mechanistic Guidance For Designing Functionally Graded Metamaterials With Perfect Connectivity","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76914?af=R","doi":"10.1002/advs.76914","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"mechanical metamaterials","matchWhere":"摘要：mechanical metamaterials","score":3,"authors":["Jongbin Yu","Dosung Lee","Namjung Kim"],"authorMore":false,"abstract":"A latent diffusion-based framework is proposed for designing functionally graded metamaterials with perfect connectivity. By integrating vector-quantized latent representations with mechanistic guidance, the framework enables accurate inverse design toward target elastic properties. A hybrid interpolation strategy combining latent interpolation and diffusion-based guidance achieves smooth mechanical transitions while preserving complete connectivity, as demonstrated through a biomedical femoral implant application. ABSTRACT Recent advancements in artificial intelligence (AI)–based design strategies have expanded the ability to generate complex mechanical metamaterials across multiple length …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":202},{"title":"Giant Electrobending with Superior Thermal Stability in (K,Na)NbO3 Based Lead‐Free Piezoceramics: Insights from Polarization Configuration","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79325?af=R","doi":"10.1002/adfm.79325","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Tongxin Wei","Jinzhu Zou","Zhongna Yan","Miao Song","Xuefan Zhou","Kechou Zhou","Dou Zhang","Shujun Zhang"],"authorMore":false,"abstract":"The intrinsic coupling between polarization configuration and giant electrobending is uncovered in (K,Na)NbO₃ based lead-free piezoceramics. Multiscale flexible polarization engineering yields ultrahigh electrobending with exceptional thermal stability across −40°C–160 °C, paired with excellent small-signal piezoelectric performance promising for high-precision actuator applications. ABSTRACT Electrobending in lead-free piezoceramics has recently achieved remarkable attention, but the intrinsic coupling between "智能传感"],"matchTerm":"pressure sensor","matchWhere":"摘要：pressure sensor","score":3,"authors":[],"authorMore":false,"abstract":"A 3D-printable and fully biodegradable ink platform is presented to enable fully integrated bioelectronic systems, including conductors, semiconductors, and dielectrics. Demonstrated applications include a wireless pressure sensor and a wireless nerve stimulator, highlighting the potential for streamlined, monolithic fabrication of customizable, transient medical devices for diagnostics and therapy without requiring surgical retrieval. ABSTRACT 3D printing of bioelectronics offers a versatile platform for fabricating personalized and structurally integrated electronic systems within biological scaffolds. Biodegradable electronics, which naturally dissolve after their functional lifetime, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":205},{"title":"Lattice‐Level Negative Thermal Expansion Enables Thermomechanical Self‐Compensation in High‐Rate Lithium Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79327?af=R","doi":"10.1002/adfm.79327","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-26","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Yuhan Feng","Yaohui Dai","Chaozhong Liu","Lizhi Li","Zhenzhu Wang","Wenqiang Lu","Xingji Li","Bo Song"],"authorMore":false,"abstract":"A negative thermal expansion Cu 2 P 2 O 7 phase is coupled to a PVDF-HFP separator through a polydopamine interface, converting lattice contraction into macroscopic thermal shrinkage resistance. The composite membrane preserves ion pathways under thermal stress, stabilizes lithium deposition, and supports high rate Ni-rich lithium metal cells, highlighting an active thermomechanical design strategy for safer power systems. ABSTRACT Localized Joule heating in high-rate lithium metal batteries often induces severe thermomechanical failure of polymer separators and accelerates thermal runaway in cells with Ni-rich NCM cathode. Here we report a multiscale separator design strategy that …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":206},{"title":"From Artificial to Embodied and Physical Intelligence in Smart Manufacturing","url":"https://doi.org/10.1002/advs.78384","doi":"10.1002/advs.78384","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"multistable","matchWhere":"摘要：multistable","score":3,"authors":["Kang Wang","Xinyu Lu","Tong Liu","Jinjie Fang","Xin Li","Siqian Wu"],"authorMore":false,"abstract":"ABSTRACT Manufacturing is evolving from automation‐centered production toward systems capable of sensing, adaptation, and autonomous response across digital, mechanical, and material domains. Although recent progress has been largely driven by artificial intelligence, current manufacturing intelligence often remains external to physical systems and suffers from limited robustness, interpretability, and transferability in complex industrial environments. Here, we present a unified perspective on smart manufacturing through the framework of artificial intelligence (AI), embodied intelligence (EI), and physical intelligence (PI). AI provides abstraction, prediction, and generative capability; …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":207},{"title":"Fatigue‐Resistant Biaxially Stretchable Micro‐Origami Structured Electrodes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79271?af=R","doi":"10.1002/adfm.79271","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-24","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensor","matchWhere":"摘要：pressure sensor","score":3,"authors":["Yifei Huang","Yujun Deng","Peiyun Yi","Linfa Peng"],"authorMore":false,"abstract":"This work presents a micro-origami structured electrode which introduces biaxially foldable micro-origami structures onto the surface of a bilayer thin-film electrode composed of a metal film and a polymer substrate. The electrode exhibits biaxial stretchability (\u003e80%) while maintaining high conductivity and excellent fatigue resistance (ABSTRACT Stretchable electrodes are essential for next generation wearable electronics, but simultaneously achieving high conductivity, large stretchability, and long-term reliability remains challenging. This work proposes a micro-origami structured electrode (MOSE) that mitigates the conflicts between stretchability, conductivity and fatigue resistance. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":208},{"title":"Striated Core‐Sheath Fibers for Constructing Breathable Intelligent Fabrics With Multiple X‐Ray Shielding and Strain‐Pressure Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78385?af=R","doi":"10.1002/adfm.78385","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive","score":3,"authors":[],"authorMore":false,"abstract":"Striated core-sheath fibers fabricated via coaxial wet-spinning are woven into multilayer breathable textiles, integrating high-efficiency X-ray shielding, sensitive mechanical sensing and Morse-code transmission for wearable radiation-protection. ABSTRACT The extensive use of medical X-rays increases chronic radiation exposure risks for medical staff and patients. Traditional lead-based materials present low shielding efficiency at 20–100 keV, along with high weight, stiffness, poor flexibility, toxicity, and single functionality, limiting their wearable applications. Herein, hierarchical striated Bi 2 O₃ /WC/TPU@MXene/TPU (BWMT) core-sheath fibers are fabricated via coaxial wet-spinning. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":209},{"title":"High‐Throughput DNA Sequence Space Exploration for Carbon Nanotube Biosensor Design","url":"https://doi.org/10.1002/adfm.79592","doi":"10.1002/adfm.79592","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-13","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Magdalena Theresia Kuom","Phillip Galonska","Sayantani Chakraborty","Simon van Impel","Lela Vukovic","Sebastian Kruss"],"authorMore":false,"abstract":"ABSTRACT Fluorescent single‐walled carbon nanotubes (SWCNTs) can be non‐covalently functionalized with biopolymers such as DNA to create biosensors. Noncovalent functionalization promises a vast design space, but synthesis is limited by low‐throughput dispersion steps. Here, we present a high‐throughput SWCNT‐based platform that utilizes covalent DNA‐anchor chemistry to recruit single‐stranded DNA (ssDNA) recognition motifs via hybridization. The approach circumvents low‐throughput processing steps such as sonication or centrifugation. By integrating automated liquid handling and spectroscopy, we bypass traditional fabrication bottlenecks and synthesize 180 unique sensors and test 540 …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":210},{"title":"Wafer‐Scale 3D Integration for High‐Density Multi‐Valued Neuromorphic Logic","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77437?af=R","doi":"10.1002/advs.77437","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural networks","matchWhere":"摘要：neural networks","score":2,"authors":["Chang‐Hyeon Kim","Min Seok Kim","Joong Bum Rhim","Tae In Kim","Hyuck‐In Kwon","Ick‐Joon Park"],"authorMore":false,"abstract":"Wafer-scale 3D vertically integrated multi-valued logic (MVL) circuits are realized by monolithically integrating a Te/IGZO heterojunction FET with an engineered Te pull-up FET. Heterointerface-mediated transport and optimized current matching enable stable ternary operation, while vertical stacking reduces circuit footprint and interconnect complexity, providing a scalable platform for high-density multi-valued information processing and ternary-weight neuromorphic computing. ABSTRACT As conventional transistor scaling approaches fundamental limits, multi-valued logic (MVL) has emerged as a promising strategy to enhance information density and reduce circuit complexity beyond binary …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":211},{"title":"Early Retinal UCHL1 Dysregulation Coupled With Synaptic Loss Reflects Alzheimer's Disease Severity","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.202600020?af=R","doi":"10.1002/advs.202600020","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":[],"authorMore":false,"abstract":"This study identifies synapse-enriched deubiquitinase UCHL1 as an early Aβ-responsive regulator of retinal synaptopathy in Alzheimer's disease. Retinal UCHL1 loss accompanies excitatory synapse degeneration, p75NTR activation, and neuroinflammation, and predicts Braak stage and cognitive decline. Aβ 42 fibrils trigger synaptic and UCHL1 depletion before overt neurodegeneration, positioning UCHL1 as a mechanistic mediator and promising retinal biomarker for AD. ABSTRACT Synaptic dysfunction is a major driver of cognitive decline in Alzheimer's disease (AD), yet its extent and molecular basis in the retina remain poorly defined. We integrated postmortem retinal and matched brain …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":212},{"title":"Neuromorphic Optical Tracking and Imaging of Randomly Moving Targets Through Dynamic Dense Scattering Media","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77082?af=R","doi":"10.1002/advs.77082","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Ning Zhang","Arto Nurmikko"],"authorMore":false,"abstract":"Vision begins not with images but with change: the retina fires only when something moves, handing the brain a stream of spikes. A neuromorphic imaging system adopts the same strategy—an event sensor that sees like the retina, a spiking network that thinks like the brain—to track and reconstruct fully randomly moving targets through tissue (phantom), turbid water, and dynamic fog. ABSTRACT Imaging and tracking objects moving along random, unpredictable trajectories through dense scattering media remains an open challenge with direct applications in autonomous navigation, underwater robotics, and biomedical sensing. Here we present, to our knowledge, the first end-to-end brain-inspired …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":213},{"title":"NICE: A Two‐Step Non‐Invasive Framework for Embryo cfDNA Read Enrichment and Quality Assessment","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77327?af=R","doi":"10.1002/advs.77327","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Xueya Zhou","Shu Ding","Zhenyi Zhang","Qiaoling Shangguan","Jie Qiao","Peijie Zhou"],"authorMore":true,"abstract":"The non-invasive NICE framework, built on an ensemble stacking machine learning model, prioritizes embryos by analyzing cell-free DNA from spent culture medium. By integrating multimodal signals, including genomic and epigenetic profiles, this automated approach standardizes morphological assessment without human bias, paving the way for more precise and objective embryo selection. ABSTRACT Non-invasive preimplantation genetic testing (niPGT) using cell-free DNA (cfDNA) extracted from spent embryo culture medium (SECM) has shown great potential, providing economic and practical advantages for embryo ploidy testing and quality assessment, while minimizing the risk of embryo damage. However, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":214},{"title":"AI‐Assisted Tumor Boundary Delineation via Targeted Ultrasmall Iron Oxide Nanoprobe for High‐Contrast HER2‐Positive Tumor Imaging","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77355?af=R","doi":"10.1002/advs.77355","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"摘要：deep learning","score":2,"authors":["Jiaying Zheng","Yi Zhu","Xinrui Li","Sunxian Dai","Xiangyuan Ma","Hongwei Lu"],"authorMore":true,"abstract":"A novel targeted and pH-responsive MRI contrast agent was integrated with a 3D nnU-Net deep learning framework to enable accurate delineation of tumor boundary morphology in HER2-positive breast cancer imaging. ABSTRACT Breast cancer continues to be a leading cause of cancer-related mortality in women globally, where precise diagnosis and clear tumor demarcation are critical for effective treatment. Herein, we developed a strategic platform that combines a novel ultrasensitive magnetic resonance (MR) contrast agent with deep learning to significantly enhance the tumor-to-normal ratio (TNR). We designed ultrasmall iron oxide nanoparticles (USIO NPs) conjugated with trastuzumab (Tmab) for …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":215},{"title":"A Reconfigurable Memristive Spiking Neuron Enabling Advanced Neuromorphic Computing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77375?af=R","doi":"10.1002/advs.77375","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Pek Jun Tiw","Yuqi Li","Zhongyuan Li","Qihang Ding","Yuzhe Wang","Jiarong Wang"],"authorMore":true,"abstract":"Pek Jun Tiw and co-workers develop a reconfigurable memristive neuron that can exhibit four spiking behaviors with freely tunable spike train parameters. The neuron supports multiplexed spike encoding of multiple pieces of information. It also supports advanced neural network strategies, such as neural heterogeneity and dynamic mode switching, achieving temporal task accuracy improvements of up to 8.0% and 13.7%, respectively. ABSTRACT Biological neurons exhibit internal complexity that enables a variety of spiking behaviors, complex encoding strategies, and the possibility of advanced networks that underpin cognitive brain functions. Neuromorphic computing, especially using memristors with …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":216},{"title":"Quantum‐Trained AI Enables Inverse Design of Organic Frontier Orbitals at Billion‐Scale","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77414?af=R","doi":"10.1002/advs.77414","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-12","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"摘要：deep learning","score":2,"authors":["Yeongnam Ko","Se Jin Kim","Ki Chul Kim"],"authorMore":false,"abstract":"Quantum-trained AI links molecular substructures to frontier-orbital energetics and enables interpretable screening across nearly one billion GDB-13 molecules. By combining fragment- and ring-level insights with donor–acceptor energy alignment against ITIC, the framework narrows an immense chemical space to a small set of promising candidates and reveals diamino-triketone scaffolds as privileged donor building units. ABSTRACT Frontier orbital energies govern charge transfer, energy-level alignment, and optoelectronic performance in organic molecules, yet their prediction across vast chemical spaces remains challenging because they arise from coupled effects of functionality, conjugation, … ✅ 数据源：12 本刊、24 条通道全部正常。","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-14","tkey":"other","id":217},{"title":"Dynamic Phase Evolution of Fe‐Based Catalysts During CO2 Hydrogenation: Implications for Data–Driven Design","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77430?af=R","doi":"10.1002/adfm.77430","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":["Hyeonji Yeom","Yongseok Kim","Kyungsu Na"],"authorMore":false,"abstract":"This review diagnoses the dynamic phase evolution of Fe-based catalytic materials during CO₂ hydrogenation. By employing operando and in situ characterization techniques, the study proposes dynamic function descriptors that accurately represent the working state of the catalysts. This prospective workflow can overcome the limitations of conventional methods that rely on static descriptors in data-driven catalyst design, thereby exactly predicting target performance. ABSTRACT The thermocatalytic hydrogenation of carbon dioxide into value-added hydrocarbons represents a crucial strategy for sustainable carbon utilization. Iron (Fe)-based catalysts are key candidates for this process. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":218},{"title":"A Zero‐Dimensional Hybrid Tin Halide with Efficient Near‐Infrared Luminescence for Intelligent Defect Inspection","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78761?af=R","doi":"10.1002/adfm.78761","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep-learning","matchWhere":"摘要：deep-learning","score":2,"authors":[],"authorMore":false,"abstract":"This work reports a 0D, Sn halide (MBI) 2 SnCl 6 (MBI = 2-methylbenzimidazole), with organic MBI + cations and isolated [SnCl 6] 2− octahedra. The Sb substitution yields broadband NIR emission. Based on a U-Net convolutional neural network, it enables rapid and automated defect identification, allowing accurate discrimination between qualified and defective wafers as well as subclassification of defective samples. ABSTRACT Near-infrared (NIR) luminescent materials have attracted considerable attention for biomedical imaging and industrial inspection because of their deep penetration capability and strong technical adaptability. Coupling NIR luminescence with deep-learning algorithms …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":219},{"title":"Role of Structural Disorder on Phonon Transport and Thermal Conductivity in Li6PS5Br","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78852?af=R","doi":"10.1002/adfm.78852","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-11","topic":"深度学习","topics":["深度学习"],"matchTerm":"neural network","matchWhere":"摘要：neural network","score":2,"authors":["Lukas Ketter","Ryoma Sasaki","Kyra Strotmann","Wolfgang G. Zeier","Yoshitaka Tateyama"],"authorMore":false,"abstract":"Solid electrolytes are fast ion and slow heat conductors. Although both transport properties are governed by lattice dynamics and atomic structure, their interplay remains poorly understood. Here, we study this interrelation in anion-ordered and disordered Li 6 PS 5 Br. We show that these structural changes strongly influence the liquid-like ion dynamics, while the glass-like thermal transport and its kinetic contribution remain largely unaffected. ABSTRACT Sulfidic solid electrolytes pose a promising material class for enabling solid-state batteries. While their defect chemistry and ion transport have been studied extensively, thermal transport and its interplay with ion dynamics remain …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":220},{"title":"Photon–Phonon–Electron Synergy Enables Efficient Photothermoelectric Conversion for Intelligent Fire Warning","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75105?af=R","doi":"10.1002/adma.75105","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning","score":2,"authors":[],"authorMore":false,"abstract":"Photothermoelectric detectors are limited by coupled photon–phonon–electron dynamics. We present vertically aligned Ag 2 Se/Ag-SPs nanocomposite films via oriented growth and confined phase separation. Anisotropic phonon scattering, energy filtering, and plasmonic waveguiding synergistically boost broadband absorption and thermoelectric conversion, achieving a responsivity of 126 V W −1 at 1550 nm. Integrated with machine learning, the device enables 100% sensitive sub-second flame recognition for intelligent fire warning. ABSTRACT Photothermoelectric (PTE) detectors offer broad-spectrum response and high sensitivity, but their performance and applications are fundamentally limited by the …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-13","tkey":"other","id":221},{"title":"Hierarchical Confinement and Oxygen‐Vacancy Catalysis for Highly Reversible Room‐Temperature Sodium‐Sulfur Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75129?af=R","doi":"10.1002/adma.75129","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-11","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine-learning","matchWhere":"摘要：machine-learning","score":2,"authors":[],"authorMore":false,"abstract":
