n piezoelectric materials. Their tendency towards chiral nature, polar molecular structure, asymmetric crystal packing, and designability enable efficient linear voltage generation under mechanical stress, yet their technological translation is at formative stages. Amino acid‐based multicomponent crystals (MCC s) are an emerging class of sustainable piezoelectrics, which …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-06","tkey":"other","id":29},{"title":"Bioinspired Microcone‐Array‐Based Eutectogel Triboelectric Nanogenerator for Self‐Powered Dual‐Modal Sensing and Human‐Machine Interfaces","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79491?af=R","doi":"10.1002/adfm.79491","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-04","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":["Binyao Zhang","Shenghao Di","Zijin Yan","Guang Chen","Yi Ding","Weizhong Yuan"],"authorMore":false,"abstract":"Boinspired M-TENG is constructed utilizing the NAP eutectogel as the back electrode. The eutectogel monitors human movements and electrophysiological signals, while the M-TENG enables self-powered, dual-modal motion monitoring. Additionally, a flexible touch panel is integrated to form a secure human-machine interface, facilitating the password-authenticated remote control of a hexapod robot, demonstrating its potential for complex unmanned search-and-rescue operations. ABSTRACT Flexible wearable sensors currently face challenges in terms of self-powering and human-machine interaction (HMI) capabilities. In order to cope with these challenges, through the utilization of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-06","tkey":"other","id":30},{"title":"Detection of Degraded Formulated BaTiO3 Induced by Oxygen Vacancy Migration Using Ultrasonic Attenuation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77083?af=R","doi":"10.1002/advs.77083","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Haley N. Jones","Clive A. Randall","Andrea P. Argüelles","Susan Trolier‐McKinstry"],"authorMore":false,"abstract":"Oxygen vacancy migration is a key degradation mechanism for the majority of MLCCs. There are limitations with spatially identifying regions of a capacitor that have degraded due to oxygen vacancy migration. This work showcases ultrasonic attenuation as a non-electrical and nondestructive technique of identifying oxygen vacancy degraded regions of an MLCC. ABSTRACT Insulation resistance degradation caused by electromigration of oxygen vacancies under DC bias is a common mechanism that limits lifetime in multilayer ceramic capacitors (MLCCs). This work explores the use of high frequency ultrasound (100 MHz) as a non-electrical, nondestructive characterization tool to spatially identify …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"other","id":31},{"title":"Piezoelectric Field‐Derived Mechano–Electrochemical Regulation for Durable SiO Anode","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74988?af=R","doi":"10.1002/adma.74988","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Qian Zhang","Chuang Sun","Kaiwen Yu","Tianpin Wu","Mengting Zheng","Junxiu Wu"],"authorMore":true,"abstract":"Piezoelectric LiTaO₃ converts the intrinsic expansion stress of SiO into localized electric fields, dynamically regulating Li + transport and homogenizing interfacial reactions. Coupled with a mechanically robust CNT framework, this mechano–electrochemical strategy stabilizes the electrode structure and interphase, enabling durable SiO anodes and providing a stress-responsive paradigm for high-energy lithium-ion batteries. ABSTRACT Silicon monoxide (SiO) has emerged as a promising high-capacity anode material for next-generation lithium-ion batteries. Nevertheless, the practical application of SiO anodes remains hindered by sluggish Li + ion transport kinetics and persistent mechanical …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":32},{"title":"Dielectrophoretic Assembly of BaTiO3 Radiative Cooling Textiles for Proactive Urban Cooling","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75018?af=R","doi":"10.1002/adma.75018","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Maoquan Zhang","Xuwang Tian","Chenhao Ding","Jiawei Wu","Zheng Yang","Weiyan Zhu"],"authorMore":true,"abstract":"A dielectrophoretic assembly strategy creates a BaTiO₃ surface-mineralized fibrous textile with semi-exposed nanoparticle architecture for enhanced Mie scattering and mechanical flexibility. This scalable and flexible textile achieves 96.78% solar reflectance, 110.1 W/m 2 net cooling power, and ∼20°C surface temperature reduction. Weather Research and Forecasting (WRF) simulations further indicate its potential to reverse urban heat island (UHI) circulation under large-scale deployment. ABSTRACT The urban heat island (UHI) effect threatens sustainable urban development. Passive daytime radiative cooling textiles are promising but face a trade-off between optical performance and …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":33},{"title":"Efficient Dynamic Piezo‐Photocatalysis of Freestanding Single‐Crystal BaTiO3 Membranes by Strain Gradient","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75029?af=R","doi":"10.1002/adma.75029","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Qian Yang","Guohua Dong","Na Dong","Guannan Yang","Zhengwei Tao","Zeqiong Wang"],"authorMore":true,"abstract":"Freestanding single-crystal BaTiO₃ membranes convert cavitation-induced flexural deformation into dynamic strain gradients and enhanced piezoelectric polarization. The resulting electric field promotes photogenerated-carrier separation and interfacial redox reactions. The (110)-oriented membrane exhibits 1.88 times the ultrasonic degradation activity of its substrate-clamped counterpart and removes 90.25% of tetracycline under combined ultrasound and ultraviolet irradiation. ABSTRACT Piezocatalysis, capable of direct mechanical-to-chemical energy conversion, emerges as a promising strategy to address the global challenge of antibiotic pollution. Herein, freestanding single-crystal BaTiO₃ …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":34},{"title":"Photon–Phonon Co‐Driven Ammonia Synthesis Over Ru/BaTiO3 Under Very Mild Conditions","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75041?af=R","doi":"10.1002/adma.75041","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Linlin Hou","Ying Liu","Hongjie Cui","Ziying Qin","Muyao Liu","Lunqiao Xiong"],"authorMore":true,"abstract":"Photon-generated electrons dynamically enrich Ru sites on BaTiO₃, suppressing excessive hydrogen coverage while promoting N 2 adsorption and dissociation. Coupled photon and phonon enables efficient ammonia synthesis under mild conditions, delivering 746.6 mmol g Ru −1 h −1 at 350 °C under ambient pressure and 2269 mmol g Ru −1 h −1 under 2 MPa. ABSTRACT Ammonia, as an emerging energy carrier, holds significant strategic importance in the transition of future energy systems. Although the Haber-Bosch process remains the dominant industrial route for ammonia synthesis, its high energy demand and substantial carbon emissions underscore the urgent need for sustainable alternatives. Herein, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":35},{"title":"Hierarchically Aligned Core–Shell Yarn‐Shaped Triboelectric Yarns With Coupled High‐Density Charge Trapping and Efficient Transport","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78604?af=R","doi":"10.1002/adfm.78604","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":[],"authorMore":false,"abstract":"An aligned side-by-side triboelectric yarn is developed via one-step conjugate electrospinning. Its unique hierarchical structure creates a fivefold increase in deep trap density, effectively suppressing charge leakage and significantly boosting surface potential. This design delivers an exceptional output for energy harvesting and self-powered sensing, offering a transformative paradigm for wearable electronics. ABSTRACT Yarn-shaped triboelectric materials (Y-TENGs) hold great promise for high-performance wearable electronics, but conventional designs suffer from low charge density due to limited internal macro- and microscale structures. Here, an aligned side-by-side triboelectric yarn …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-03","tkey":"other","id":36},{"title":"Application of integrated epoxy electrically insulated piezoresistive carbon fiber sensors in strain sensing of CFRP structures","url":"https://doi.org/10.1016/j.compstruct.2026.121032","doi":"10.1016/j.compstruct.2026.121032","journal":"Composite Structures","jabbr":"Composite Structures","pubdate":"2026-11-01","topic":"智能传感","topics":["智能传感"],"matchTerm":"piezoresistive","matchWhere":"标题：piezoresistive","score":9,"authors":["Maximilian Korff","Tobias Dickhut"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-01","tkey":"other","id":37},{"title":"Hybrid microstructured sensing layer-enabled flexible piezoresistive pressure sensor for human–machine interaction","url":"https://doi.org/10.1016/j.compstruct.2026.121047","doi":"10.1016/j.compstruct.2026.121047","journal":"Composite Structures","jabbr":"Composite Structures","pubdate":"2026-11-01（在线预发表）","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensor","matchWhere":"标题：pressure sensor","score":9,"authors":["Mingchao Du","Jiarui Zhang","Liangsong Huang","Peng Zhang","Yuxia Li","Changzhi Zhao"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":38},{"title":"Optimization of embedded piezoelectric layers in CFRP composite vibration energy harvesters to improve power output","url":"https://doi.org/10.1016/j.compstruct.2026.120892","doi":"10.1016/j.compstruct.2026.120892","journal":"Composite Structures","jabbr":"Composite Structures","pubdate":"2026-11-01（在线预发表）","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Radhika Choudhary","Imen Rzig","Edith Roland Fotsing","Annie Ross","Guilhem Michon"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":39},{"title":"Unraveling the Effects of Depolarization in Ultrathin Barium Titanate","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78103?af=R","doi":"10.1002/advs.78103","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-31","topic":"压电材料","topics":["压电材料"],"matchTerm":"barium titanate","matchWhere":"标题：barium titanate","score":9,"authors":["Thomas Lee","Prabhat Kumar","Christoph Klewe","Pravin Kavle","Padraic Shafer","Zhi (Jackie) Yao","Lane W. Martin"],"authorMore":false,"abstract":"This article employs synchrotron-based spectroscopy, time-resolved electrical measurements, and phase-field simulations to establish reverse-domain formation as the mechanism of polarization loss in ultrathin BaTiO3${\\rm BaTiO}_3$ films as a critical obstacle to low-voltage ferroelectric devices. The work develops a system-level framework in which electrode screening and interfacial capacitance are found to drive depolarization and explores interfacial design and defect engineering as potential routes to tune polarization stability. ABSTRACT Depolarization fields pose a critical obstacle to realizing ultrathin ferroelectric devices with low-voltage operation. Although the phenomenology of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-01","tkey":"other","id":40},{"title":"Ultrasensitive and Wide‐Range Ionic Pressure Sensors Toward Intelligent Assessment of Traditional Chinese Medicine Pulse and Oral Occlusal Health","url":"https://doi.org/10.1002/adfm.79323","doi":"10.1002/adfm.79323","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-29","topic":"智能传感","topics":["智能传感"],"matchTerm":"pressure sensors","matchWhere":"标题：pressure sensors","score":9,"authors":["Hongliang Ma","Zhe Zhang","Shulin Guo","Tengfei Ma","Kai Hu","Ruibing Yao"],"authorMore":true,"abstract":"ABSTRACT Pulse monitoring and tooth occlusion detection are two key scenarios for non‐invasive monitoring of cardiovascular and oral health. Traditional pressure sensors suffer from a trade‐off between sensitivity and measurement range. Their rigid structure and poor surface fit hinder the accurate acquisition of weak pulse signals and the detection of wide‐range occlusal pressure. Here, a high‐performance capacitive ionic pressure sensor was realized based on the electric double‐layer (EDL) effect, featuring both ultra‐high sensitivity (73224 kPa − 1) and a wide detection range (0.01–1100 kPa). Compared with most reported ionic pressure sensors, our sensor achieves competitive ultra‐high …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":41},{"title":"Harmonizing the Mechanical‐Electrical Property Trade‐Off in Aramid Triboelectric Fiber Enabled by In Situ Tessellation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78509?af=R","doi":"10.1002/adfm.78509","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":[],"authorMore":false,"abstract":"This study proposes an in situ molecular inlay strategy to simultaneously enhance the strength and electrical conductivity of aramid triboelectric fibers. These triboelectric fibers can support a load exceeding 166 667 times their own weight. Their excellent electrical conductivity (1632 S/m) enables outstanding Joule heating performance, causing the temperature of the aramid triboelectric fibers to rise to 74°C within 65 s. ABSTRACT Polymeric electronic fibers are essential for the seamless integration of intelligent wearable systems. However, it remains challenging to simultaneously enhance the load capacity and conductivity of electronic fibers at the micrometer scale. Herein, this study …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":42},{"title":"Piezoelectric‐Photocatalytic S‐Scheme Heterojunction in Na─Sm Co‐Doped CaBi2Nb2O9@Mn─Cu─Ni─MOF for Enhanced Hydrogen Generation From Water Splitting","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78469?af=R","doi":"10.1002/adfm.78469","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Qiong Liu","Ziwei Cao","Faqi Zhan","Zezhou Lin","Guoqiang Zou","Hang Luo","Chris R. Bowen","Haitao Huang"],"authorMore":false,"abstract":"Piezo-photocatalytic NSC@MOF heterojunction nanohybrid suppresses photocarrier recombination via the piezoelectric built-in electric field. Together with the constructed Mn─O─Sm covalent bridge that reduces interfacial barriers and forms an S-scheme heterojunction, these effects jointly boost mechano-driven photocatalytic H 2 evolution for sustainable water-splitting energy conversion. ABSTRACT Suppressing the recombination of photogenerated electrons and holes to achieve highly efficient energy conversion in an environmentally benign manner represents a pivotal challenge in green chemistry. In this work, we report on a novel composite that combines 2D piezoelectric Na─Sm co-doped CaBi 2 Nb …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":43},{"title":"Double‐Pendulum Bearing‐Joint Triboelectric Nanogenerator for Efficient Low‐Frequency Ocean Wave Energy Harvesting","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78314?af=R","doi":"10.1002/adfm.78314","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"标题：triboelectric","score":9,"authors":["Zihua Wang","Shiyuan Chang","Boyuan Yao","Zhanqi Liu","Qinghe Wu","Weihua Han","Zhanyong Hong","Zhong Lin Wang"],"authorMore":false,"abstract":"Inspired by bearings, a new type of Triboelectric Nanogenerators was used as joints and mounted on double pendulums in this research. By integrating device into the buoy, this device is expected to provide power for monitoring nodes of the Marine Internet of Things, which will provide a reference for the realization of self-powered systems. ABSTRACT Marine Internet of Things (IoT) systems require reliable self-powered sensor nodes for long-term ocean monitoring. Triboelectric nanogenerators (TENGs) provide a promising solution for harvesting irregular ocean wave energy, but the low frequency, small amplitude, and randomness of ocean waves significantly limit the performance of conventional …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":44},{"title":"Molecularly Engineered Nitrate Double Perovskites with Elevated Ferroelectric Phase Transition Temperature and Large Piezoelectric Response","url":"https://doi.org/10.1002/advs.78404","doi":"10.1002/advs.78404","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Le Ye","Guang‐Yuan Hu","Yarou Duan","Yutong Lin","Ding‐Chong Han","Zi‐Luo Fang"],"authorMore":true,"abstract":"ABSTRACT Conventional ABX 3 perovskites place organic species at A ‐sites or as X ‐site linkers, where the B ‐site is reserved for metals. Molecular double perovskites with a general formula A 2 B I B III X 6 possess higher tunability and distinct B I ‐sites that can accommodate small cations, further regulating lattice connectivity and physical properties. Here, we introduce a new family of B I ‐site‐organic nitrate double perovskites, (RM3HQ) 2 B I Eu(NO₃) 6 (RM3HQ = (R)‐ N ‐methyl‐3‐hydroxyquinuclidinium), forming compounds 1 – 4 with B I = ammonium, methylammonium, formamidinium, and dimethylammonium, respectively. Compounds 1 and 2 adopt mixed corner‐/face‐sharing non‐perovskite …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":45},{"title":"Modulation of Surface‐Associated Transport in (Bi1‐xSbx)2Te3 via Battery‐ Inspired Solid‐State Iontronic Gating","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79295?af=R","doi":"10.1002/adfm.79295","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-25","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"标题：iontronic","score":9,"authors":["Gabriel Vinicius de Oliveira Silva","Reza Asadi","He Ren","Rabiul Islam","Jagadeesh Moodera","Guo‐Xing Miao"],"authorMore":false,"abstract":"Iontronic gating in a battery-inspired device modulates the relative weight of surface-associated and bulk-like transport fingerprints in (Bi 1-x Sb x) 2 Te 3, resulting in phenomenological valve-like transport behavior. The strongest WAL-associated coherent transport signatures emerge near the transport-defined carrier compensation regime at ultra-low gate voltages (ABSTRACT Topological insulators (TIs) possess unique topological surface states (TSS) with strong spin-momentum locking. This leads to a large net surface spin accumulation when a surface charge current flows, thereby efficiently exerting a strong spin-orbit torque (SOT) on an adjacent ferromagnet. However, the effectiveness …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":46},{"title":"Thermally Robust Piezoelectric KNN/Polyimide Separator for Regulating Lithium Deposition in Lithium Metal Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79294?af=R","doi":"10.1002/adfm.79294","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-25","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Shumin Lin","Qiang Zhou","Shuang Luo","Dan Zhong","Bo Peng","Zhouqishuo Cai","Jie Bai","Hao Xue","Hua Bai"],"authorMore":false,"abstract":"An electrospun KNN/polyimide separator introduces oriented piezoelectric polarization into lithium metal batteries. During plating, local pressure from nascent lithium protrusions triggers electrostatic feedback that redirects Li + migration away from hotspots, promotes uniform deposition, and preserves separator integrity under heat, providing a promising strategy for improving the cycling durability and safety of lithium metal batteries without relying on passive blocking alone. ABSTRACT Lithium-metal batteries offer exceptionally high theoretical energy density but are hindered by dendrite-induced short circuits and the limited thermal stability of conventional separators. Here, we …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":47},{"title":"A Biodegradable and Tough Piezoelectric Silk Fibroin Fiber","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77698?af=R","doi":"10.1002/adfm.77698","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":[],"authorMore":false,"abstract":"Dynamic salting-out-assisted microfluidic spinning yields biodegradable silk fibroin fibers with high toughness, molecular orientation, and enhanced piezoelectricity. The resulting fiber-based devices enable stable electromechanical conversion and in vivo monitoring of respiration, muscle activity, and ultrasound-driven energy harvesting, highlighting a promising platform for bioresorbable piezoelectric sensing. ABSTRACT Biodegradable piezoelectric implants are optimal platforms for transient biosensing and therapeutics. However, limited piezoelectric properties and toughness impede the deployment of biodegradable piezoelectric implants in dynamic tissues and organs. In this study, we have …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":48},{"title":"Dynamic Piezoelectric Polarization Directs Reaction Pathways in CO2 Reduction Over Pt/Cu2O@BaTiO3 Dual‐Site Heterostructures","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78402?af=R","doi":"10.1002/adfm.78402","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"标题：piezoelectric","score":9,"authors":["Chunlai Dong","Xiuli Zhang","Yi Wang","Feng Ru Fan"],"authorMore":false,"abstract":"Dynamic piezoelectric polarization is coupled with a Pt/Cu 2 O@BTO dual-site heterostructure to regulate photocatalytic CO₂ reduction. The spatially differentiated Pt and Cu 2 O interfaces promote charge separation and CO₂ /H₂O half-reactions, while stress-induced polarization redirects post-*CO evolution by suppressing deep hydrogenation and favoring CO desorption under coupled light and mechanical stimulation, achieving high CO production and selectivity. ABSTRACT Efficient and selective CO₂ conversion under mild conditions remains challenging because rapid interfacial charge recombination and poorly controlled carbon-conversion pathways often limit both catalytic activity and …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":49},{"title":"Flexoelectric Suppression of Interfacial Carrier Loss in BaTiO3 Thin‐Film Bulk Photovoltaic Systems","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76848?af=R","doi":"10.1002/advs.76848","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"压电材料","topics":["压电材料"],"matchTerm":"BaTiO3","matchWhere":"标题：BaTiO3","score":9,"authors":["Minwoo Jang","Hyunkyu Lim","Sanghoon Yeom","Jaewhan Oh","Yongsoo Yang","Hyungwoo Lee"],"authorMore":false,"abstract":"In single-crystalline BaTiO₃ thin films, flexoelectric strain gradients strongly enhance photocurrent by suppressing interfacial carrier loss. Loading experiments reveal a ∼35-fold photocurrent increase with applied force. Self-consistent electrostatic modeling shows that strain gradients reshape the interfacial potential landscape, strengthen local drift fields, and govern carrier-extraction efficiency, establishing flexoelectric modulation as a route to interfacial-loss engineering in bulk photovoltaic systems. ABSTRACT Bulk photovoltaic (BPV) effects in ferroelectric oxides have attracted significant attention for their potential to circumvent the bandgap-limited open-circuit voltage of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":50},{"title":"Autonomous Discovery of Multi‐Material Metamaterials With Programmable Multimodal Thermal Responses via Reinforcement Learning","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75546?af=R","doi":"10.1002/adma.75546","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-28","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"reinforcement learning","matchWhere":"标题：reinforcement learning、摘要：deep learning","score":8,"authors":["Chenxi Lu","Kewen Pan","Xingran Li","Zhaohui Qiu","Nianyao Chai","Xuehao Gao","Muhammad Aziz","Lin Li","Chao Wei"],"authorMore":false,"abstract":"A physics-guided deep reinforcement learning framework is developed to achieve the autonomous inverse design of multi-material thermal metamaterials. By integrating physical constraints and hybrid iterative optimization, the AI agent efficiently explores vast combinatorial design spaces from sparse data, discovering nonintuitive multi-material architectures with programmable, coupled multimodal thermal expansion and twisting behaviors. ABSTRACT Inverse design deep learning models have significantly accelerated materials discovery through mapping complex structure-property relationships. However, they remain constrained by prohibitive data demands and are limited to in-distribution …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":51},{"title":"Machine Learning‐Driven Design of Electrolytes and Interfaces for Solid‐State Lithium Batteries: Progress and Outlook","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78357?af=R","doi":"10.1002/adfm.78357","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWh design","matchWhere":"摘要：data-driven design、摘要：neural network、摘要：piezoresistive","score":7,"authors":[],"authorMore":false,"abstract":"This work presents self-adhesive, stretchable epidermal electrodes and sensors developed through a data-driven design framework that integrates artificial neural networks with genetic algorithms. By tailoring optimization objectives, either maximizing electrical conductivity and adhesion or enhancing piezoresistive sensitivity, the study enables the rational design of material compositions, yielding high-performance skin electrodes and sensors. ABSTRACT Stretchable and self-adhesive epidermal electrodes and sensors with long-term stability are highly desirable for wearable applications. These electrodes and sensors typically comprise multiple components, each contributing distinct …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":55},{"title":"Deep learning-based prediction on the local deformation and global collapse in cellular metamaterials under impact loading","url":"https://doi.org/10.1016/j.ijimpeng.2026.105949","doi":"10.1016/j.ijimpeng.2026.105949","journal":"International Journal of Impact Engineering","jabbr":"International Journal of Impact Engineering","pubdate":"2027-03-01（在线预发表）","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Xin-chun Zhang","Zheng Xu","Li-jun Xiao","Li-xiang Rao","Zhi-yi Song"],"authorMore":false,"abstract":"","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-30","tkey":"other","id":56},{"title":"Machine learning-driven impact response of discrete patterns of Al0.5CoCrFeNi with additive manufacturing and traditional melting","url":"https://doi.org/10.1016/j.ijimpeng.2026.105947","doi":"10.1016/j.ijimpeng.2026.105947","journal":"International Journal of Impact Engineering","jabbr":"International Journal of Impact Engineering","pubdate":"2027-03-01（在线预发表）","topic":"机器学习","topics":[" ing shows promise in this regard, yet few models have undergone comprehensive clinical validation. Using the SILCODE cohort (722 Chinese participants, 1,105 scans), we test the transportability of our classifier (pretrained on Western samples) to an independent Chinese cohort without retraining. The associations between risk scores and disease progression, cognitive performance, and plasma biomarkers are examined. In addition, an interpretable framework is developed to generate individualized brain risk maps and identify …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-06","tkey":"other","id":66},{"title":"Accelerating High‐Fidelity Airfoil Design via Physics‐Informed Video Diffusion Model","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78532?af=R","doi":"10.1002/advs.78532","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"深度学习","topics":["深度学习"],"matchTerm":"diffusion model","matchWhere":"标题：diffusion model","score":6,"authors":["Yifeng Ai","Yijia Guo","Hongfu Zhang","Lei Zhou","Tiejun Huang","Weiqiu Chen"],"authorMore":true,"abstract":"Physics-informed video diffusion enables rapid inverse aerodynamic design by mapping target lift-to-drag response to airfoil geometries and full-field flow distributions. Trained on 53 400 DNS samples, the model achieves over 90% fidelity with ∼30 s inference, while experimentally realized propeller designs demonstrate a practical pathway from aerodynamic targets to manufacturable structures. ABSTRACT Airfoil design remains a challenging multi-objective optimization problem requiring precise geometric control for optimal aerodynamic performance. Data-driven inverse design methods mitigate this complexity but often yield non-physical results when physical constraints are not explicitly …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"other","id":67},{"title":"BraMARS: An Interpretable Histopathology‐Driven Deep Learning Model for Brain Metastasis Risk Stratification in Surgically Resected Limited‐Stage SCLC","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77075?af=R","doi":"10.1002/advs.77075","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":[],"authorMore":false,"abstract":"This study presents BraMARS, an explainable deep learning model that estimates future brain metastasis risk in surgically resected limited-stage small-cell lung cancer using routine H\u0026E-stained whole-slide images. By linking model-attributed spatial histopathology with clinical outcomes and proteomic programs, BraMARS provides a biologically interpretable framework for individualized intracranial risk assessment, with potential to inform prophylactic cranial irradiation discussions, MRI surveillance strategies, and future brain metastasis prevention studies. ABSTRACT Brain metastasis (BM) is a major cause of mortality in limited-stage small-cell lung cancer (LS-SCLC). Prophylactic cranial …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-05","tkey":"other","id":68},{"title":"Laminar Boundary Layer Mass Transport‐Guided Machine Learning for Precision Density Regulation of Horizontal Carbon Nanotube Arrays","url":"https://doi.org/10.1002/adfm.79421","doi":"10.1002/adfm.79421","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-03","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Jin Gao","Yuming Wang","Shanbin Zhang","Jiacheng Song","Xiaoling Tong","Ran Du"],"authorMore":false,"abstract":"ABSTRACT Horizontally aligned carbon nanotube (HACNT) arrays are essential building blocks for next‐generation carbon electronics. However, precise control over the density of HACNT remains a formidable bottleneck due to the complex, nonlinear coupling of multi‐physical parameters. To address this challenge, we propose a machine learning (ML) workflow that incorporates boundary layer fluid dynamics (BLFD). Conventional high‐dimensional growth parameters are condensed into a concise feature space dominated by two physics‐informed descriptors: mass transfer coefficient (K m) and residence time (t). This kinetics‐informed feature set significantly improves HACNT density prediction, …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":69},{"title":"Attribution Fingerprinting by Interpretable Machine Learning Reveals Category‐Specific Additive Design Rules for Zinc Anodes","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75609?af=R","doi":"10.1002/adma.75609","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Guolang Zhou","Minmeng Tang","Xinwang Xu","Xin Tang","Tianshi Wang","Chong Zhao"],"authorMore":false,"abstract":"Molecule-specific SHAP attribution profiles serve as attribution fingerprints that resolve zinc-electrolyte additives into three attribution-based categories. Category I screening identifies 2-fluoropyridine-5-carbaldehyde, whose predicted cycle life of 3218 h is confirmed experimentally within 6.5% (3010 h). Structural controls trace the improvement to the aldehyde group, and Zn//MnO₂ full cells retain 96% capacity over 4000 cycles. ABSTRACT Electrolyte additives are one of the most direct remedy for interfacial instability in aqueous zinc-ion batteries, yet their development remains empirical. Existing machine-learning (ML) screening strategies presume a single global structure-property …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":70},{"title":"Deep Learning‐Powered Plasmonic Platform for Decoding Dynamic Protein Aggregation Landscapes in Parkinson's Disease Progression","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74985?af=R","doi":"10.1002/adma.74985","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":[],"authorMore":false,"abstract":"α-Syn protein aggregates of varying supramolecular sizes are present in the serum of individuals with unknown status. These aggregates are translated into distinct scattering signatures via immunoaffinity induced immunogold clustering in the PANDA system. The resulting data are processed by a deep learning network to classify individuals into healthy ones, mild PD, or moderate PD with superior accuracy. ABSTRACT In-depth characterization of pathological protein aggregate with its subcomponents is pivotal for early diagnosis and staging of neurodegenerative disorders. Here, we introduce the Protein Aggregate NanoDynamics Analyzer (PANDA), a plasmonic nanotechnology-powered system that …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-04","tkey":"other","id":71},{"title":"Machine Learning‐Assisted Soft Sensors: From Material Design to Motion Recognition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78483?af=R","doi":"10.1002/adfm.78483","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-01","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Hongbiao Sun","Shengkang Fu","Yanfeng Hou","Jiawei Liu","Yan Yang","Chengliang Tao"],"authorMore":true,"abstract":"This review establishes a unified framework linking soft-sensor working principles, material and structural design, signal quality, and machine-learning strategy selection. By relating sensing fidelity, separability, temporal stability, and cross-session consistency to suitable algorithms, it clarifies how reliable motion recognition can be achieved in healthcare, soft robotics, and human–machine interaction. ABSTRACT The development of soft electronics provides reliable performance under deformation, excellent adaptability to irregular surfaces, and superior comfort for wear. Their deployments offer solutions to address the challenges of harsh signal acquisition conditions, poor wearing …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-11-03","tkey":"other","id":72},{"title":"Field‐Driven Proton Transport in Water Revealed by Machine Learning Molecular Dynamics","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78513?af=R","doi":"10.1002/advs.78513","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-29","topic":"机器学习","topics":["机器学习"],"matchTerm":"machine learning","matchWhere":"标题：machine learning","score":6,"authors":["Alicia van Hees","Zhan‐Yun Zhang","Linnéa Andersson","Chao Zhang"],"authorMore":false,"abstract":"Using a reactive and polarizable machine-learning molecular dynamics (MLMD) framework, the authors show that excess-proton drift remains nearly linear with applied electric field up to 0.15 V/Å. It is also found that the protonic defect mitigates the field-induced structural changes observed in neat water, revealing a distinct high-field response of protonated water. ABSTRACT Excess-proton transport in water arises from the coupling of proton transfer (PT), hydrogen-bond rearrangement, and solvent polarization. While equilibrium Grotthuss diffusion has been widely studied, its response under strong electric fields remains difficult to resolve because simulations must capture both chemical …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-30","tkey":"other","id":73},{"title":"ReLink: Reliable Deep Learning for Microscopic Motion Tracking","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78541?af=R","doi":"10.1002/advs.78541","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Yuan Jiang","Xiaochen Feng","Hongda Wei","Hao Sha","Hongpeng Wang","Min Zhang","Sanyang Han","Yongbing Zhang"],"authorMore":false,"abstract":"ReLink enables reliable trajectory linking in single-particle tracking by integrating physics-informed motion statistics with confidence-based adaptive filtering. Across diverse simulated and experimental conditions, ReLink robustly reconstructs trajectories and preserves the fidelity of downstream analyses, enabling accurate characterization of microscopic dynamics from physically verifiable free diffusion to complex intracellular anomalous diffusion. ABSTRACT Single-particle tracking (SPT) serves as a fundamental technique for deciphering complex microscopic dynamics in biological and physical systems by resolving trajectories of individual particles. However, linking localizations into …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":74},{"title":"Robust Stitching Interface and Deep Learning Empowered Hydrogel Human‐Machine Interface","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77052?af=R","doi":"10.1002/advs.77052","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":[],"authorMore":false,"abstract":"A molecular design strategy is presented that exploits synergistic carboxylate anion–quaternary ammonium interactions to simultaneously strengthen the hydrogel–PET interface and the bulk hydrogel network. Integrated with deep learning signal processing, the stable hydrogel–PET interface enables consistent signal acquisition and reliable human-machine interaction under prolonged dynamic operation. ABSTRACT Mechanical mismatch and weak interfacial adhesion between hydrogels and encapsulation layers, particularly polyethylene terephthalate (PET), remain the primary cause of signal distortion in dynamic sensing applications. We address this through a molecular design strategy that exploits …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":75},{"title":"Sustained Self‐Powered Real‐Time Vibration Monitoring Through Integrated Nonlinear Harvesting and Energy‐Aware Wireless Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.76967?af=R","doi":"10.1002/advs.76967","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-28","topic":"智能传感","topics":["智能传感","压电材料"],"matchTerm":"self-powered sensing","matchWhere":"摘要：self-powered sensing、摘要：piezoelectric","score":6,"authors":[],"authorMore":false,"abstract":"A self-powered vibration sensing platform integrates a quasi-zero-stiffness piezoelectric harvester, synchronized electric charge extraction, energy management, and wireless ADC acquisition. Ambient vibration is simultaneously harvested as energy and digitized as information, enabling sustained real-time waveform monitoring without external power. The system bridges nonlinear energy harvesting and energy-aware electronics to transform irregular mechanical inputs into continuous sensing. ABSTRACT Continuous high-frequency data acquisition is critical for advanced structural monitoring and data-driven systems, yet remains limited by the insufficient energy budget of self-powered sensing. …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-29","tkey":"other","id":76},{"title":"Active Learning for Data‐Efficient Optimization of Entangled Granular Metamaterials (Adv. Funct. Mater. 86/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78669?af=R","doi":"10.1002/adfm.78669","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"active learning","matchWhere":"标题：active learning","score":6,"authors":["Peng Wang","Gaoyan Shi","Xin Bian","Yu Guo"],"authorMore":false,"abstract":"AI-Empowered Design of Granular Metamaterials An active learning scheme combining a Supervised Graph Wasserstein Autoencoder with Langevin-based stochastic optimization is developed to identify optimal shapes of elongated, non-convex particles that self-assemble into strong, free-standing structures with maximized yield stress. This work establishes a data-efficient paradigm for optimizing granular metamaterials. More details can be found in the Research Article by Xin Bian, Yu Guo, and co-workers (DOI: 10.1002/adfm.77723).","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":77},{"title":"Discovery of Multicomponent Invar Materials With Low Thermal Expansion, High Curie Temperature, and Superior Phase Stability Assisted by Active Learning","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74942?af=R","doi":"10.1002/adma.74942","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习"],"matchTerm":"active learning","matchWhere":"标题：active learning","score":6,"authors":[],"authorMore":false,"abstract":"An interpretable active-learning framework navigates a multicomponent Fe─Co─Ni─Cr─Mn space to identify and experimentally refine a productive low-thermal-expansion basin. The resulting FCC Invar alloy combines near-zero expansion over a broad temperature range with a Curie temperature of about 580 K and good ductility, demonstrating a property-first route to accelerated alloy discovery. ABSTRACT Zero thermal expansion (ZTE) materials provide exceptional dimensional stability under temperature fluctuations, making them indispensable for high-precision instrumentation and extreme environments. However, their natural scarcity, combined with the vast compositional space in multicomponent …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-28","tkey":"other","id":78},{"title":"Distributed Haptic Chips With Materials’ Multifunctionalities for Dual‐Way Tactile Communication Enabled Terrain Recognition and Reconstruction in Robotic Teleoperation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78287?af=R","doi":"10.1002/adfm.78287","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-24","topic":"智能传感","topics":["智能传感","压电材料"],"matchTerm":"piezoresistive","matchWhere":"摘要：piezoresistive、摘要：piezoelectric","score":6,"authors":["Minglu Zhu","Junyi Chen","Xinyu Wang","Ke Chen","Kuihan Chen","Chang Li"],"authorMore":true,"abstract":"A haptic chip utilizes the multifunctionality of laser induced graphene and silicone materials for multi-modal tactile sensing, and haptic feedback is present for the application of teleoperating robots with terrain recognition and reconstruction functions. The modular and distributed design of the haptic chip system ensures compatibilities in different tasks. ABSTRACT Current robotic teleoperations rely on vision-based detection and feedback of the operation environment. Establishing dual-way tactile sensing and feedback remains challenging for improving comprehensive status awareness. Here, with the aid of laser induced graphene and silicone materials, we present a haptic chip capable of …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":79},{"title":"Interpretable Deep Learning of Molecule‐Solvent Interactions Using a Solvatochromic Subgroup Contribution Framework","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77347?af=R","doi":"10.1002/advs.77347","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-23","topic":"深度学习","topics":["深度学习"],"matchTerm":"deep learning","matchWhere":"标题：deep learning","score":6,"authors":["Jinyong Park","Minhi Han","Kiwoong Lee","Seokwoo Kim","Sungnam Park"],"authorMore":false,"abstract":"Chemistry-informed deep learning (DL) models based on the solvatochromic subgroup contribution (SSC) framework predict and interpret solvent-dependent spectral shifts, revealing physically meaningful subgroup-solvent interactions. ABSTRACT Solvent effects critically influence the photophysical and optical properties of molecules in solution, yet a quantitative and interpretable description of solvent effects remains a long-standing challenge. In this study, to quantitatively understand and chemically interpret solvatochromism, deep learning (DL) models based on the solvatochromic subgroup contribution (SSC) framework were introduced, which describes solvatochromic shifts through localized …","tier":"worth_reading","tierLabel":"值得一读","reportDate":"2026-10-26","tkey":"other","id":80},{"title":"Amorphous–Nanocrystalline Silicate–Superalloy Heterointerfaces Combining High‐Temperature Electrical Insulation with Large‐Strain Tolerance","url":"https://doi.org/10.1002/adfm.79412","doi":"10.1002/adfm.79412","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-30","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":["Lida Xu","Shilong Jia","Yuelong Li","Ning Wang","Rui Liang","Qinnan Chen"],"authorMore":true,"abstract":"ABSTRACT The key bottleneck in in situ monitoring of nickel‐based superalloy hot‐section components is the lack of a reliable insulating interface for oxidative and thermomechanical extremes. Conventional ceramic insulating layers and multilayer architectures remain constrained by complex processing, interfacial mismatch, limited strain tolerance, and brittle failure. Here, we report a directly printable amorphous–nanocrystalline silicate coating that enables a robust multifunctional interface on nickel‐based superalloys without additional bonding or transition layers. During annealing, the printed silicate layer densifies, locally crystallizes, and wets the superalloy surface, producing an …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-30","tkey":"other","id":81},{"title":"Robust, Highly Extensible, and Conformally Self‐Adhesive Ionogels Enabled by Spiderweb‐Inspired Supramolecular Topology","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78449?af=R","doi":"10.1002/adfm.78449","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-28","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocking","matchWhere":"摘要：interlocking","score":5,"authors":["Chengyu Wang","You Lu","Weicheng Zhao","Jin Zhang","Yebang Tan"],"authorMore":false,"abstract":"Addressing the trade-off between robustness and both conformality and extensibility of ionogels, this work proposes a spiderweb-inspired supramolecular topology strategy. Host-guest interactions assisted radial 8-arm topology structures enhance the toughness and extensibility without increasing the skin-conformal modulus, and P(DMAA- co -HVIm)/[HMIm]Br spiral chains enable recyclable topological ionogels for conformally self-adhesive applications, even under dynamic and mechanically demanding conditions. ABSTRACT Ionogels have attracted significant interest in bioelectronics and soft robotics owing to their eco-friendly stability and adhesion. However, conventional ionogels face an inherent …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-29","tkey":"other","id":82},{"title":"Broadband Convolutional Processing Perception‐Memory‐Computation InSe Neuromorphic Vision Device for High‐Accuracy Recognition of Color Images","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78335?af=R","doi":"10.1002/adfm.78335","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"深度学习","topics":["深度学习","压电材料"],"matchTerm":"neural network","matchWhere":"摘要：neural network、摘要：PZT","score":5,"authors":[],"authorMore":false,"abstract":"Under positive and negative biases, the InSe ferroelectric transistor exhibits symmetric positive and negative photoconductances, which can be utilized for the high-accuracy recognition of color images. ABSTRACT Broadband convolution processing is critical for accurate color image recognition. However, current broadband convolution processing involves a photoresponse matrix based on continuous-voltage modulation devices, resulting in high energy consumption. Here, we demonstrate an InSe neuromorphic device that integrates broadband convolutional processing with perception, memory, and computation functions to realize high-accuracy recognition of color images with the potential for low …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":83},{"title":"Vectorial Slip‐Touch Perception Enabled by Sliding‐Gated Charge Carrier Dynamics","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78455?af=R","doi":"10.1002/adfm.78455","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：triboelectric","score":5,"authors":["Chongxiang Pan","Hongxiang Xue","Hao Sun","Zi Hao Guo","Jing Wang","Yutong Song","Fuchun Sun","Zhong Lin Wang","Xiong Pu"],"authorMore":false,"abstract":"Enabled by sliding-gated charge carrier dynamics, a monolithic, array-free robotic skin intrinsically decouples multidimensional tactile stimuli to achieve high-fidelity slip-touch perception. Bypassing traditional dense sensor arrays and complex inverse computations, this hardware-minimalist, in-sensor encoding strategy facilitates real-time robotic manipulation via computationally lightweight algorithms, providing a scalable physical foundation for next-generation embodied intelligence. ABSTRACT High-dimensional tactile perception is essential for dexterous robotic manipulation, but is severely constrained by the hardware-stacking of pixelated arrays or the computational latency of …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":84},{"title":"Deformation‐Robust Multimodal Electronic Skin Enabled by Conformal Surface Plasmons for Cross‐Medium Robotic Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79263?af=R","doi":"10.1002/adfm.79263","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：piezoresistive","score":5,"authors":["Yongze Li","He Gao","Lang Yuan","Ting Cui","Minglu Zhu","Jian He"],"authorMore":true,"abstract":"An ultrathin deformation-robust e-skin unifies a five-channel piezoresistive network and a conformal surface plasmon waveguide within one flexible interdigitated-electrode architecture. It maps grasp pressure, perceives approaching targets before contact, and interrogates concealed substances through dielectric barriers. Frequency-resolved microwave fingerprints, interpreted by machine learning, reveal cross-medium material identity during dexterous robotic manipulation. ABSTRACT Electronic skins (e-skins) generally transduce contact mechanics but cannot interrogate materials concealed by packaging, limiting robotic perception to accessible surfaces. A multimodal cross-medium e-skin is …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":85},{"title":"Mechanical Programming of PEGDA‐β‐CD Polyrotaxane‐Based Hydrogels via Host–Guest Molecular Recognition","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.77853?af=R","doi":"10.1002/adfm.77853","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":[],"authorMore":false,"abstract":"A mechanically programmable hydrogel for tissue engineering is developed by modulating the molecular threading density of poly(ethylene glycol) diacrylate- β -cyclodextrin (PEGDA- β -CD) polyrotaxane and combining it with β -CD-modified gelatin. The polyrotaxane-guided transition from disordered pores to laminar microstructures enables precise tuning between high elasticity and high damping. Hydrogels ideally accelerate wound healing in vivo due to their biocompatibility and proper mechanical properties. ABSTRACT Polyrotaxane-based hydrogels with mechanically interlocked structures offer unique opportunities for designing biomaterials with tunable mechanical properties in tissue …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":86},{"title":"Decoupled Temperature‐Pressure Sensing via Hierarchical Porous Sponge for Thermo‐Tactile Perception","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78367?af=R","doi":"10.1002/adfm.78367","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"机器学习","topics":["机器学习","智能传感"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：piezoresistive","score":5,"authors":["Jiachen Dong","Bo Xu","Hongyu Mi","Xin Zhao","Yuqing Zhai","Yongqi Zhu"],"authorMore":true,"abstract":"A hierarchically porous PDMS/CNT sponge sensor was fabricated via a template method. It converts pressure and temperature into independent resistance and voltage signals via piezoresistive and thermoelectric effects, physically avoiding crosstalk. Benefiting from excellent compressibility, thermal insulation, and conductivity, it achieves high sensitivity, fast response, and outstanding durability for electronic skin and motion detection even under complex mechanical stimuli. ABSTRACT Precise and crosstalk-free discrimination of pressure and temperature remains a fundamental challenge in artificial sensory systems due to the intrinsic coupling of mechanical and thermal transduction. Herein, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":87},{"title":"Embedded Direct Ink Writing of Thermoset and Elastomeric Polymers via Frontal Polymerization","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78142?af=R","doi":"10.1002/adfm.78142","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-10-23","topic":"自锁与互锁结构","topics":["自锁与互锁结构"],"matchTerm":"interlocked","matchWhere":"摘要：interlocked","score":5,"authors":[],"authorMore":false,"abstract":"Embedded frontal polymerization direct ink writing (FP-DIW) combines frontal ring-opening metathesis polymerization with embedded 3D printing to decouple deposition from curing. A yield-stress support bath stabilizes low-viscosity inks, while on-demand thermal initiation enables controlled front propagation. This approach expands the accessible feature size, geometry, and material range beyond conventional FP-DIW in air. ABSTRACT Direct ink writing (DIW) using frontal ring-opening metathesis polymerization (FROMP) enables rapid, energy-efficient fabrication of thermoset and elastomeric architectures through a self-propagating exothermic curing reaction. However, FP-DIW is constrained by …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-26","tkey":"other","id":88},{"title":"Flexible High‐Speed Low‐Noise Organic Photodiode Arrays for Dynamic Near‐Infrared Imaging","url":"https://doi.org/10.1002/adma.75605","doi":"10.1002/adma.75605","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-03","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：neural network","score":4,"authors":["Tingting Guo","Yu Zhu","Zhe Zhang","Ruiman Han","Hanzhe Shi","Haoyu Li"],"authorMore":false,"abstract":"ABSTRACT Organic photodiodes (OPDs) hold significant promise for next‐generation IoT optical sensing and low‐power imaging applications. However, widespread application of OPD in flexible and dynamic imaging has been constrained by high dark current, poor stability, and the lack of a cost‐effective imaging system. In this work, we present an integrated solution through tailoring pseudo‐planar heterojunction (PPHJ) OPD arrays and a customized, rapidly accessible imaging system, the dynamic organic photonics imaging system (DOIS). The resulting PPHJ OPD exhibited a high responsivity (0.6 A W −1 at 868 nm), low dark current (1.5 × 10 −8 A cm −2 at −1 V) and fast response time (480 ns), …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":89},{"title":"Artificial Intelligence Meets Micro/Nanorobotics","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74721?af=R","doi":"10.1002/adma.74721","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-10-27","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：deep learning","score":4,"authors":[],"authorMore":false,"abstract":"Artificial intelligence is transforming micro- and nanorobots from externally controlled, task-specific machines into adaptive, autonomous systems. Machine learning, multimodal perception, digital twins, AI-guided materials and geometry design enhance propulsion, localization, decision-making, whichaccelerates clinical and environmental applications including targeted delivery, diagnostics, biosensing, remediation, and pollutant capture. ABSTRACT Microrobots and nanorobots are a developing technology, which evolved from simple “motoric” motion-capable micro/nanomachines to physical machine intelligence capable of communicating with each other using chemical or physical signals. Meanwhile, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-28","tkey":"other","id":90},{"title":"An Integrated Artificial Intelligence Framework for Nanomedicine Engineering","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.78125?af=R","doi":"10.1002/advs.78125","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-10-26","topic":"机器学习","topics":["机器学习","深度学习"],"matchTerm":"machine learning","matchWhere":"摘要：machine learning、摘要：neural networks","score":4,"authors":["Meichen Dong","Qin Luo","Xinyi Ding","Chaoqi Lu","Ru Zhang","Qingqing Tan"],"authorMore":true,"abstract":"This review outlines a closed-loop AI ecosystem for nanomedicine engineering. By synergizing multimodal data harmonization, objective-driven AI architectures, and automated high-throughput validation, this “Design-Make-Test-Analyze” (DMTA) workflow transforms traditional heuristic formulation into a predictive, self-optimizing paradigm, accelerating the translation of next-generation nanotherapeutics. ABSTRACT The translation of nanomedicines is frequently bottlenecked by trial-and-error optimization. Integrating artificial intelligence (AI) transforms this process into a closed-loop, experimentally grounded discovery ecosystem. This Review provides a roadmap for this paradigm, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-10-27","tkey":"other","id":91},{"title":"Snake‐Scale‐Inspired Serrated Structures With Frictional Anisotropy for Tunable Bidirectional Shear‐Force Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.79497?af=R","doi":"10.1002/adfm.79497","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-05","topic":"智能传感","topics":["智能传感"],"matchTerm":"tactile sensor","matchWhere":"摘要：tactile sensor","score":3,"authors":["Qinggang Guo","Yumin Li","Long Zheng","Luquan Ren"],"authorMore":false,"abstract":"A bioinspired piezoresistive flexible sensor simultaneously detects normal pressure and tangential forces while distinguishing shear direction. Its serrated anisotropic architecture enables direction-dependent mechanical responses and allows the sensing sensitivity and working range to be tuned through structural design, offering a versatile platform for multidirectional tactile perception in flexible sensing and robotic interfaces. ABSTRACT Flexible tactile sensors are essential components of intelligent robotics, wearable healthcare systems, and human-machine interfaces. However, most existing tactile sensors have limited capability to discriminate the direction of tangential forces, …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":92},{"title":"Mechanically‐Gated Stochastic Resonance for All‐Optical Acoustic Sensing in Noisy Environments","url":"https://doi.org/10.1002/advs.78634","doi":"10.1002/advs.78634","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-05","topic":"力学超材料","topics":["力学超材料"],"matchTerm":"bistable","matchWhere":"摘要：bistable","score":3,"authors":["Xuyu Zhang","Minzheng Sun","Cunzheng Fan","Shuolong Zhu","Qilin Hong","Pan Xu"],"authorMore":false,"abstract":"ABSTRACT Weak signal detection in harsh and noisy environments remains a critical challenge across diverse fields. Stochastic resonance (SR) offers a counterintuitive strategy by exploiting noise to enhance, rather than suppress, weak signals, yet its practical deployment is severely limited by poor frequency selectivity, inadequate adaptability to fluctuating noise levels, and reliance on offline post‐processing. Here we report the discovery and experimental demonstration of mechanically‐gated stochastic resonance (MGSR), a novel physical mechanism that couples stochastic resonance with intrinsic mechanical resonance. By using mechanical resonance to actively modulate the bistable …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":93},{"title":"Wearable E‐Textiles for Cardiovascular Monitoring: Materials, Devices, and Integrated Systems","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77999?af=R","doi":"10.1002/advs.77999","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-04","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-powered sensing","matchWhere":"摘要：self-powered sensing","score":3,"authors":["Bangul Khan","Mahmoud Tavakoli","Norbert Radacsi","Bee Luan KHOO"],"authorMore":false,"abstract":"The graphical abstract highlights the role of conductive materials and textile fabrication techniques in enabling smart textiles for cardiovascular applications. It showcases textile-based ECG monitoring, pulse sensing, hemodynamic monitoring, and cardiovascular tissue engineering, while emphasizing the challenges and design considerations that govern device performance, wearability, and clinical translation toward personalized healthcare. ABSTRACT Cardiovascular diseases remain the leading cause of morbidity and mortality worldwide, highlighting the need for continuous, non-invasive, and reliable physiological monitoring beyond conventional clinical assessments. Smart textiles have emerged …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-06","tkey":"other","id":94},{"title":"Bio‐Inspired Rigid‐Flexible Synergistic Nanofibrous Textiles for Mechanically Robust Radiative Cooling","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adfm.78652?af=R","doi":"10.1002/adfm.78652","journal":"Advanced Functional Materials","jabbr":"Advanced Functional Materials","pubdate":"2026-11-03","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Xirui Han","Junyu Sun","Jun Tang","Shuxin Bai","Fengqi Liu","Hongbo Xu"],"authorMore":true,"abstract":"A spider silk-inspired, filler-free TPU@PVDF-HFP core-sheath film is fabricated via coaxial electrospinning, wherein dynamic hydrogen bonding mediates rigid-flexible synergy. The resulting membrane achieves high solar reflectivity (96.2%) and infrared emissivity (92.5%), delivering a maximum temperature reduction of 25.4°C, while retaining exceptional mechanical and spectral stability over 1000 stretch-release cycles. ABSTRACT Passive daytime radiative cooling (PDRC) textiles offer an efficient pathway for personal thermal management. However, the inherent conflict between optical performance and mechanical robustness remains a formidable challenge. Although elastomer-based electrospun …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":95},{"title":"Orientation‐Engineered Insulator‐Metal Transition in Vanadium Dioxide","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77134?af=R","doi":"10.1002/advs.77134","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"摘要：iontronic","score":3,"authors":["Xuanchi Zhou","Xiaohui Yao","Wentian Lu","Chunwei Yao","Xiaomei Qiao"],"authorMore":false,"abstract":"Crystallographic orientation engineering in VO₂ /TiO₂ heterostructures enables tunable insulator-metal transitions. The high-Miller-index (102) orientation breaks in-plane mirror symmetry, inducing anisotropic transport, while its inclined oxygen channels accelerate protonation kinetics. This work establishes orientation design as a powerful knob for accessing exotic correlated electronic states and advancing high-speed iontronic devices. ABSTRACT The artificial design of material microstructure in correlated oxides offers an emerging pathway for unlocking exotic electronic states through adjusting coupled order parameters. Here, we showcase the robust capability of a crystallographic …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":96},{"title":"High‐Power Hybrid Nanogenerator With Multi‐Degree‐of‐Freedom Mechanical Coupling for Harvesting Water Wave Energy","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/advs.77154?af=R","doi":"10.1002/advs.77154","journal":"Advanced Science","jabbr":"Advanced Science","pubdate":"2026-11-03","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":[],"authorMore":false,"abstract":"A high-power hybrid nanogenerator (HP-HNG) with multi-degree-of-freedom mechanical coupling is reported, integrating multi-directional wave energy for output to achieve 1 + 1 \u003e 2 energy harvesting. The HP-HNG achieves a peak output power of 0.764 W, corresponding to a peak power density of 127.303 W m − 3. At a wave frequency of 1 Hz, the HP-HNG delivers 111.06 mJ of energy within 5 s under pendulum + heave motion. This work demonstrates the HP-HNG's capability to simultaneously harvest multi-degree-of-freedom wave energy, providing sustainable power for future submarine cable monitoring and distributed sensing systems in the marine Internet of Things. ABSTRACT Wave energy is an important …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-05","tkey":"other","id":97},{"title":"Lignin‐Based Supramolecular Dynamic Networks: A General Platform for Energy Harvesting and Sensing","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75521?af=R","doi":"10.1002/adma.75521","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-03","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Zhimin Kou","Meiting Liu","Fuchun Huang","Caiying Bo","Puyou Jia","Yonghong Zhou"],"authorMore":false,"abstract":"A rigid–flexible supramolecular design transforms lignin from a passive rigid filler into an active dynamic building block. The resulting ionogel synergistically integrates high stretchability, underwater adhesion, self-healing, strain sensing, and mechanical energy harvesting, overcoming the persistent trade-off between robustness and multifunctionality for sustainable flexible electronics. ABSTRACT Lignin- based ionogels are promising sustainable materials for flexible electronics, yet their development is limited by a persistent tradeoff between mechanical robustness and dynamic multifunctionality. Here, we report a rigid flexible supramolecular design strategy that transforms lignin …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":98},{"title":"Anchored Fluoro‐Shielded Solvation for Lithium Metal Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75606?af=R","doi":"10.1002/adma.75606","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"PVDF","matchWhere":"摘要：PVDF","score":3,"authors":["Kaihua Wen","Tengsheng Chi","Junyao You","Lei Mao","Xinxin Zhu","Yan‐Bing He"],"authorMore":true,"abstract":"Anchored fluoro-shielded solvation reconstructs PVDF-based polymer electrolytes by coupling polyanionic Li + -solvate sites with fluorinated shielding segments. This design organizes anion-rich solvation networks, strengthens selective Li + transport, and generates LiF-rich solid electrolyte interphase, enabling high conductivity, wide oxidative tolerance, stable Li metal cycling, and long-term LiNi 0.8 Co 0.1 Mn 0.1 O₂ ||Li battery operation under demanding high-voltage and high-rate conditions. ABSTRACT Polyvinylidene fluoride (PVDF)-based polymer electrolytes are promising candidates for solid-state lithium metal batteries owing to their favorable overall electrochemical properties. …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":99},{"title":"All‐Amyloid Functional Coacervates (Adv. Mater. 61/2026)","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75423?af=R","doi":"10.1002/adma.75423","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"摘要：iontronic","score":3,"authors":["Seyyed Alireza Hashemi","Mohammad Peydayesh","Laura Baraldi","Mohammad Arjmand","Raffaele Mezzenga"],"authorMore":false,"abstract":"All-Amyloid Functional Coacervates Interfacial complex coacervation enables artificial bioscaffolds that mimic life chemistry. In their Research Article (DOI: 10.1002/adma.74737), Seyyed Alireza Hashemi, Mohammad Peydayesh, Laura Baraldi, Mohammad Arjmand, and Raffaele Mezzenga harness oppositely charged food-derived amyloid nanofibrils to induce liquid-liquid phase separation, creating structurally tunable proteinaceous vein-like tubules, capsules, and films with functionalities spanning bioscaffolds, iontronic/electronic circuits, soft electromagnetic shielding, bio-optics, and beyond.","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":100},{"title":"TESCLA: A Fully Soft Electromagnetic Linear Actuator With Continuous Bending Enabled by Liquid‐Metal Solenoids","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74642?af=R","doi":"10.1002/adma.74642","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"self-sensing","matchWhere":"摘要：self-sensing","score":3,"authors":["Yeongjin Choi","Jeongnam Kim","Seongjun Koh","Yong‐Lae Park"],"authorMore":false,"abstract":"TESCLA (tubular electromagnetic soft conformal linear actuator) combines liquid-metal solenoids and compliant magnetic composites to achieve large-stroke bidirectional actuation with continuous bending. Integrated inductance-based self-sensing enables proprioceptive position estimation without external sensors, providing a versatile platform for soft robotics, biomimetic systems, and wearable haptic devices. ABSTRACT Linear actuators are widely employed in robots and wearable devices due to their capability of directly generating linear motion. Although soft actuators and flexible linear actuators have been developed to enable effective operation in various configurations, they are still …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":101},{"title":"All‐Amyloid Functional Coacervates","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.74737?af=R","doi":"10.1002/adma.74737","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"iontronic","matchWhere":"摘要：iontronic","score":3,"authors":["Seyyed Alireza Hashemi","Mohammad Peydayesh","Laura Baraldi","Mohammad Arjmand","Raffaele Mezzenga"],"authorMore":false,"abstract":"This study introduces an all-amyloid interfacial complex coacervate technique that employs charge-mediated or functionalization-assisted complexation of oppositely charged food protein-derived amyloid nanofibrils to engineer functional soft constructs across multiple length scales. This versatile strategy enables the fabrication of proteinaceous vein-like tubules, bioelectronic and iontronic circuits, soft electromagnetic shields, viscoelastically tunable constructs, and bio-optical systems. ABSTRACT Electrostatic complex coacervates offer a robust pathway to convert homogeneous oppositely charged polyelectrolyte solutions into condensed structured liquids via liquid–liquid phase separation …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":102},{"title":"A Defect‐Engineered Sono‐Piezocatalytic In Situ Hydrogel for Preventing Hepatocellular Carcinoma Recurrence After Incomplete Radiofrequency Ablation","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75010?af=R","doi":"10.1002/adma.75010","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"压电材料","topics":["压电材料"],"matchTerm":"piezoelectric","matchWhere":"摘要：piezoelectric","score":3,"authors":["Jianji Ke","Feiqi Liu","Changzheng Li","Ying Yan","Xiuan Li","Mingda Han"],"authorMore":true,"abstract":"An injectable sono-piezocatalytic hydrogel is designed to suppress hepatocellular carcinoma recurrence after incomplete radiofrequency ablation. Oxygen vacancies in a CD44-targeted Mn–Ti framework enhance ultrasound-driven generation of reactive oxygen species, which kill residual tumor cells and release the co-loaded STING agonist and anti-PD-1 antibody. The resulting cGAS-STING activation reshapes the immune microenvironment and establishes durable antitumor memory. ABSTRACT Residual tumor cells and the immunosuppressive microenvironment caused by incomplete radiofrequency ablation (iRFA) lead to hepatocellular carcinoma (HCC) recurrence. In this study, HA-V-MTO/LMP@Gel, an injectable …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":103},{"title":"Closed‐Loop Wearable Energy Management: From Biomechanical Energy Harvesting to Full‐Cycle Battery Charging","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75016?af=R","doi":"10.1002/adma.75016","journal":"Advanced Materials","jabbr":"Advanced Materials","pubdate":"2026-11-02","topic":"智能传感","topics":["智能传感"],"matchTerm":"triboelectric","matchWhere":"摘要：triboelectric","score":3,"authors":["Yingjin Luo","Yingfan Chang","Andeng Liu","Yixin Dong","Guoxu Wu","Meidan Ye"],"authorMore":true,"abstract":"This work presents a closed-loop wearable energy system that impedance-matches the output of a biomechanical triboelectric nanogenerator to fiber lithium-ion batteries controlled using a constant-current–constant-voltage protocol, enabling complete electrochemical charging through human walking and autonomous operation of a GPS under intermittent real-world motion. ABSTRACT Biomechanical energy is abundant but irregular and low-grade, posing a significant challenge for wearable electronics, where existing energy-harvesting solutions are mainly limited to charging capacitors via physical storage, falling short of achieving a full chemical-charging cycle for practical batteries. To bridge …","tier":"other","tierLabel":"其他相关","reportDate":"2026-11-04","tkey":"other","id":104},{"title":"Data‐Driven Discovery of MOF–Polymer Synergies Enabling High‐Performance Solid‐State Sodium Batteries","url":"https://advanced.onlinelibrary.wiley.com/doi/10.1002/adma.75031?af=R","doi":"10.1002/adma.7503
